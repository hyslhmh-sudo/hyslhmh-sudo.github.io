(function () {
'use strict';
const S = window.STARH, E = S.esc, app = document.getElementById('app');
// Respaldo sin conexión (la versión vigente se edita en la hoja FUENTES del libro)
const BASE = [
  ['STAR-H', 'Organización Panamericana de la Salud. STAR-H: Evaluación estratégica del riesgo de emergencias y desastres en establecimientos de salud. Washington, D.C.: OPS; 2022. ISBN 978-92-75-32558-2 (pdf). Licencia: CC BY-NC-SA 3.0 IGO.', 'https://doi.org/10.37774/9789275325582', 'Base del relevamiento de amenazas y de las escalas A, B, C y D.'],
  ['General', 'Organización Panamericana de la Salud. Hospitales resilientes: Documento interregional de orientaciones para fortalecer la resiliencia de los establecimientos de salud ante emergencias y desastres. Washington, D.C.: OPS; 2025. ISBN 978-92-75-32906-1 (pdf).', 'https://doi.org/10.37774/9789275329061', 'Resiliencia hospitalaria y matriz operativa antes, durante y después. Vincula STAR-H, ISH y PHR.'],
  ['General', 'Organización Panamericana de la Salud. Gestión del riesgo de emergencias de salud y desastres originados por olas de calor. Orientaciones para contextos urbanos (OPS/PHE/CPI/24-0005). Washington, D.C.: OPS; 2024.', '', 'Amenaza específica: olas de calor en ciudades.'],
  ['General', 'Kaless, G. Crónica de las inundaciones en el valle y la meseta del Chubut. Desde los relatos de los pioneros galeses a los informes técnicos (1865–2021). Párrafos Geográficos. 2021;20(2):51-101. UNPSJB.', '', 'Antecedentes de inundaciones del VIRCH.'],
  ['STAR-H', 'OMS. Strategic toolkit for assessing risks (STAR): a comprehensive toolkit for all-hazards health emergency risk assessment. Ginebra: OMS; 2021.', '', 'Metodología general de la que deriva STAR-H.'],
  ['PHR', 'OPS. Instructivo para elaborar un plan hospitalario de respuesta a emergencias de salud y desastres (OPS/PHE/CPI/23-0015). Washington, D.C.: OPS; 2023.', 'https://educacionensalud.imss.gob.mx/p/portal/wp-content/uploads/2025/10/Instructivo-para-elaborar-un-plan-hospitalario-1.pdf', 'Copia publicada por el IMSS. Base de los 80 ítems del relevamiento inicial PHR.'],
  ['ISH', 'OPS/OMS. Índice de seguridad hospitalaria. Guía para evaluadores, 2.ª ed. Washington, D.C.: OPS; 2018.', 'https://www.salud.gob.ec/wp-content/uploads/2021/01/ISH-Guia-de-Evaluadores-2da-Edicion.pdf', 'Copia publicada por el Ministerio de Salud Pública de Ecuador. Cálculo, modelos de ponderación y categorías A, B y C.'],
  ['ISH', 'OPS/OMS. Índice de seguridad hospitalaria. Formularios para la evaluación, 2.ª ed. Washington, D.C.: OPS; 2018.', 'https://www.salud.gob.ec/wp-content/uploads/2021/01/ISH-Formularios-2da-Edicion.pdf', 'Copia publicada por el Ministerio de Salud Pública de Ecuador. Formulario 2: lista de verificación de 151 ítems.'],
  ['Evacuación', 'Vítolo, F. Planes de contingencia hospitalarios. Preparación, respuesta y recuperación ante catástrofes y desastres en Argentina. Buenos Aires: NOBLE Compañía de Seguros; 2026 (monografía y webinar plenario, julio de 2026).', '', 'Sistema de comando de incidentes hospitalario, continuidad operativa (96 horas), acuerdos de ayuda mutua con dos destinos alternativos por categoría, escenarios y autoevaluación de la conducción.'],
  ['Evacuación', 'Vítolo, F. Evacuación de hospitales: principios básicos. Biblioteca Virtual NOBLE; 2019.', '', 'Decisión de evacuar (modelo RED de la NFPA, árbol de decisión de la AHRQ), tipos y fases de evacuación, seguimiento de pacientes y acuerdos con instituciones receptoras.'],
  ['Evacuación', 'OPS. EVAC-H: Evacuación de hospitales y sus áreas críticas. Washington, D.C.: OPS; 2024.', 'https://www.paho.org/es/documentos/evac-h-evacuacion-hospitales-sus-areas-criticas', 'Clasificación de pacientes por movilidad, evacuación horizontal y vertical, zonas seguras, áreas críticas. Base de las fichas de dependencia.'],
  ['Evacuación', 'OPS/OMS. Índice de seguridad hospitalaria, 2.ª ed., 2018: Formulario 1 (información general acerca del hospital) e ítem 147 (plan de evacuación).', 'https://www.salud.gob.ec/wp-content/uploads/2021/01/ISH-Formularios-2da-Edicion.pdf', 'Base de la ficha del establecimiento.'],
  ['Evacuación', 'Decreto N.º 351/79, Anexo VII, capítulo 18: protección contra incendios y medios de escape.', '', ''],
  ['General', 'OPS. Hospitales seguros (iniciativa regional).', 'https://www.paho.org/es/emergencias-salud/hospitales-seguros', ''],
  ['General', 'OPS. Caja de herramientas de preparación para emergencias de salud.', 'https://www.paho.org/es/emergencias-salud/preparacion-paises-para-emergencias-salud-rsi/caja-herramientas-preparacion', ''],
  ['Normativa', 'Ley N.º 19.587 de Higiene y Seguridad en el Trabajo y su Decreto reglamentario N.º 351/79 (capítulo 18: protección contra incendios).', '', ''],
  ['Normativa', 'Resolución SRT N.º 905/2015, Anexo II, punto 2.2: funciones de los Servicios de Higiene y Seguridad en el Trabajo (planes de contingencia y emergencias).', '', '']
].map(x => ({ modulo: x[0], cita: x[1], enlace: x[2], nota: x[3] }));
const ORDEN = ['STAR-H', 'ISH', 'PHR', 'COE', 'Evacuación', 'General', 'Normativa'];
// 14/11/2026 · Belén: «separar las fuentes en subtemas». Se agrupa por Subtema (hoja FUENTES, col. F); el módulo queda como etiqueta.
const SUBT = ['Normativa', 'Herramientas OPS/OMS', 'Cursos gratuitos', 'Bibliografía de gestión de riesgos', 'Salud mental', 'Archivos de APTW', 'Links a páginas']; // 14/11/2026 · Salud mental (Belén: «agregar carpeta/tema de salud mental y yo cargo»)
const ICO_S = { Normativa: 'gavel', 'Herramientas OPS/OMS': 'construction', 'Cursos gratuitos': 'school', 'Bibliografía de gestión de riesgos': 'menu_book', 'Salud mental': 'psychology', 'Archivos de APTW': 'folder_shared', 'Links a páginas': 'link' };
const subDe = f => { const t = String(f.subtema || '').trim(); if (t) return t; const m = String(f.modulo || '').trim();
  if (/^normativa$/i.test(m)) return 'Normativa'; if (/^(STAR-H|ISH|PHR|Evacuación)$/i.test(m)) return 'Herramientas OPS/OMS';
  return f.enlace && !f.archivo && !f.archivoId ? 'Links a páginas' : 'Bibliografía de gestión de riesgos'; };
const modNom = m => m === 'COE' ? 'COEsp' : m;
const idS = k => 'sub-' + k.normalize('NFD').replace(/[^\w]+/g, '-').toLowerCase();
const ICO = { 'STAR-H': 'crisis_alert', ISH: 'local_hospital', PHR: 'fact_check', COE: 'groups', 'Evacuación': 'directions_run', General: 'public', Normativa: 'gavel' };
// 05/11/2026 · Carpeta de bibliografía (Drive › 07 · REFERENCIAS, privada) y subida: solo Administración.
let CARPETA = (S.sesion.token() && S.store.get('fuentes.carpeta', '')) || ''; // 06/11/2026 · El enlace lo manda el servidor solo a Administración (no va en el código público).
const MAX_MB = 20;
const esAdm = () => { const u = S.sesion.token() ? (S.sesion.usuario() || {}) : {}; return u.rol === 'Administración'; };
let actual = [];
function barraAdm() {
  if (!esAdm()) return '';
  return `<div class="adm"><b>Bibliografía en Drive<small>Carpeta 07 · REFERENCIAS. Es privada: solo la abrís vos. Lo que subas queda ahí y en esta lista.</small></b>
    ${CARPETA ? `<a class="btn sec" href="${E(CARPETA)}" target="_blank" rel="noopener"><span class="ms">folder_open</span>Abrir la carpeta</a>` : ''}
    <button class="btn" type="button" id="bSubir"><span class="ms">upload_file</span>Subir a la bibliografía</button></div>`;
}
function dlgSubir() {
  const mods = ORDEN.concat(actual.map(f => f.modulo)).filter((x, i, a) => x && a.indexOf(x) === i);
  const d = document.getElementById('dlg');
  d.innerHTML = `<div class="dlg-cab"><b>Subir a la bibliografía</b><button class="cerrar" data-c aria-label="Cerrar"><span class="ms">close</span></button></div>
    <form class="dlg-c" id="fSub">
      <label class="campo"><span>Archivo (PDF, Word, Excel, imagen · hasta ${MAX_MB} MB) · optativo</span><input type="file" name="archivo" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,image/*"></label>
      <label class="campo"><span>Cita *</span><textarea name="cita" placeholder="Autor. Título. Ciudad: Editorial o institución; año."></textarea></label>
      <label class="campo"><span>Subtema</span><select name="subtema">${SUBT.map(t => `<option${t === 'Bibliografía de gestión de riesgos' ? ' selected' : ''}>${E(t)}</option>`).join('')}</select></label>
      <label class="campo"><span>Módulo o tema</span><input name="modulo" list="dlMod" value="General"><datalist id="dlMod">${mods.map(m => `<option value="${E(m)}">`).join('')}</datalist></label>
      <label class="campo"><span>Enlace público (si existe en internet) · optativo</span><input name="enlace" type="url" placeholder="https://…"></label>
      <label class="campo"><span>Nota (para qué sirve, qué parte usar) · optativo</span><textarea name="nota"></textarea></label>
      <p class="msg-s">El archivo queda en la carpeta privada 07 · REFERENCIAS. Todos los usuarios ven la cita y el enlace público, y leen el archivo desde la app con «Leer el documento» (la carpeta no se comparte). El enlace de Drive lo ves solo vos. Las planillas de Google no se muestran a los demás.</p>
      <p class="msg-s" id="estSub"></p>
    </form>
    <div class="dlg-p"><button class="btn sec" type="button" data-c>Cancelar</button><button class="btn" type="button" id="bGuardarSub"><span class="ms">save</span>Guardar</button></div>`;
  d.showModal();
  const f = document.getElementById('fSub');
  f.archivo.addEventListener('change', () => { const a = f.archivo.files[0]; if (a && !f.cita.value.trim()) f.cita.value = a.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ') + ' (s/d (revisar): completar autor, título, año)'; });
  document.getElementById('bGuardarSub').addEventListener('click', guardarSub);
}
const base64 = a => new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => mal(new Error('No se pudo leer el archivo.')); r.readAsDataURL(a); });
async function guardarSub() {
  const f = document.getElementById('fSub'), b = document.getElementById('bGuardarSub'), est = document.getElementById('estSub');
  const a = f.archivo.files[0];
  if (!f.cita.value.trim()) { est.textContent = 'Falta la cita.'; return; }
  if (a && a.size > MAX_MB * 1048576) { est.textContent = 'El archivo supera ' + MAX_MB + ' MB.'; return; }
  if (!navigator.onLine) { est.textContent = 'Para subir se necesita conexión.'; return; }
  b.disabled = true; est.textContent = a ? 'Subiendo ' + a.name + '… (puede tardar un poco)' : 'Guardando…';
  try {
    const datos = { cita: f.cita.value, subtema: f.subtema.value, modulo: f.modulo.value, enlace: f.enlace.value, nota: f.nota.value };
    if (a) datos.archivo = { nombre: a.name, tipo: a.type || '', datos: await base64(a) };
    const r = await S.api('fuente_subir', datos, 180000);
    if (!r.ok) throw r;
    document.getElementById('dlg').close(); actualizar('Guardado en la bibliografía.');
  } catch (e) {
    const m = (e && (e.error || e.message)) || 'No se pudo guardar.';
    est.textContent = /acci[oó]n desconocida/i.test(m) ? 'Falta publicar la versión nueva del Apps Script de la app (Implementar › Administrar implementaciones › Editar › Nueva versión).' : m;
    b.disabled = false;
  }
}
// 14/11/2026 · Todos leen los documentos de Fuentes desde la app: el servidor entrega el archivo a quien inició sesión (el Drive no se comparte).
async function leer(b) {
  const id = b.dataset.leer, txt = b.lastChild.textContent;
  if (!S.sesion.token() || S.DEMO) { alert('Para leer el documento tenés que iniciar sesión.'); return; }
  const w = window.open('', '_blank');
  b.disabled = true; b.lastChild.textContent = 'Abriendo…';
  try {
    const r = await S.api('fuentes_archivo', { id: id }, 120000);
    if (!r || !r.ok) throw new Error((r && r.error) || 'No se pudo abrir el documento.');
    const bin = atob(r.datos), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([u8], { type: r.tipo }));
    if (w) w.location.href = url; else { const a = document.createElement('a'); a.href = url; a.download = r.nombre; a.click(); }
    setTimeout(() => URL.revokeObjectURL(url), 600000);
  } catch (e) { if (w) w.close(); alert(/desconocida|disponible/i.test(e.message) ? 'Falta publicar la versión nueva del Apps Script de la app.' : e.message); }
  finally { b.disabled = false; b.lastChild.textContent = txt; }
}
document.addEventListener('click', ev => { const l = ev.target.closest('[data-leer]'); if (l) leer(l); if (ev.target.closest('#bSubir')) dlgSubir(); if (ev.target.closest('[data-c]')) document.getElementById('dlg').close(); });
function actualizar(nota) {
  if (S.DEMO || !navigator.onLine) return;
  S.api('fuentes').then(r => { if (r && r.carpeta) { CARPETA = r.carpeta; S.store.set('fuentes.carpeta', r.carpeta); } if (r && r.ok && r.fuentes.length) { S.store.set('fuentes', r.fuentes); pintar(r.fuentes, nota || 'Actualizado.'); } }).catch(() => {});
}
// 14/11/2026 · Nota larga (Belén: «cómo lo agrego sin que ocupe tanta vista»): la primera línea de la nota se ve siempre;
// las demás (una por renglón en la celda) quedan plegadas en «Ver detalle». Los enlaces de cada renglón se ven como botón «Abrir».
function lineaHtml(l) {
  const partes = String(l).split(/(https?:\/\/\S+)/g);
  return partes.map(x => /^https?:\/\//.test(x) ? `<a class="det-a" href="${E(x)}" target="_blank" rel="noopener">${/zoom\.us\/rec/.test(x) ? 'Ver grabación' : /register/.test(x) ? 'Inscribirse' : 'Abrir'}</a>` : E(x)).join('');
}
// 14/11/2026 · Fuente destacada (Belén: «ponerla como destacada, en el 1.er lugar y con borde de color»): la nota empieza con «★».
const esDest = f => /^\s*★/.test(String(f.nota || ''));
function notaHtml(n) {
  const L = String(n || '').replace(/^\s*★\s*/, '').split(/\n+/).map(x => x.trim()).filter(Boolean);
  if (!L.length) return '';
  return `<small>${lineaHtml(L[0])}</small>` + (L.length > 1 ? `<details class="det"><summary>Ver detalle (${L.length - 1})</summary><ul>${L.slice(1).map(l => `<li>${lineaHtml(l)}</li>`).join('')}</ul></details>` : '');
}
// 14/11/2026 · Cada subtema se pliega (Belén: que no ocupe tanta vista). «Cursos gratuitos» arranca cerrado; el resto abierto. Se recuerda en este equipo.
const CERRADOS = ['Cursos gratuitos'];
const abierto = () => false; // 14/11/2026 · Todas cerradas hasta que se tocan (regla de Belén); al abrir una se cierran las otras (starh.js).
document.addEventListener('click', ev => { const a = ev.target.closest('.subs a'); if (!a) return; const sec = document.querySelector(a.getAttribute('href')); const d = sec && sec.querySelector('details.gr'); if (d) d.open = true; });
function pintar(lista, nota) {
  actual = lista;
  const g = {}; lista.forEach(f => { const k = subDe(f); (g[k] = g[k] || []).push(f); });
  Object.keys(g).forEach(k => { g[k] = g[k].filter(esDest).concat(g[k].filter(f => !esDest(f))); }); // destacadas primero
  const claves = Object.keys(g).sort((a, b) => (SUBT.indexOf(a) + 99) % 99 - (SUBT.indexOf(b) + 99) % 99);
  const indice = `<nav class="subs">${claves.map(k => `<a href="#${idS(k)}"><span class="ms">${ICO_S[k] || 'description'}</span>${E(k)} <b>${g[k].length}</b></a>`).join('')}</nav>`;
  app.innerHTML = barraAdm() + indice + claves.map(k => `<section class="grupo" id="${idS(k)}"><details class="gr" data-k="${E(k)}"${abierto(k) ? ' open' : ''}><summary><h2><span class="ms">${ICO_S[k] || 'description'}</span>${E(k)}<b class="n">${g[k].length}</b><span class="ms fl">expand_more</span></h2></summary><ol>${g[k].map(f => `<li${esDest(f) ? ' class="dest"' : ''}>${esDest(f) ? '<span class="dest-t"><span class="ms">star</span>Destacado</span><br>' : ''}${f.modulo && !/^(general|normativa)$/i.test(f.modulo) ? `<span class="mod-t">${E(modNom(f.modulo))}</span> ` : ''}${E(f.cita)}
    ${f.enlace ? `<br><a href="${E(f.enlace)}" target="_blank" rel="noopener">${E(f.enlace.replace(/^https?:\/\//, '').split('/')[0])} · abrir</a>` : ''}${f.archivoId ? `<br><button class="chip-a leer" type="button" data-leer="${E(f.archivoId)}"><span class="ms" style="font-size:15px">menu_book</span>Leer el documento</button>` : ''}${f.archivo && esAdm() ? `${f.archivoId ? ' ' : '<br>'}<a class="chip-a" href="${E(f.archivo)}" target="_blank" rel="noopener"><span class="ms" style="font-size:15px">folder_open</span>Archivo en 07 · REFERENCIAS</a>` : ''}${notaHtml(f.nota)}</li>`).join('')}</ol></details></section>`).join('')
    + `<p class="pie">${E(nota)} La lista se mantiene en la hoja FUENTES del libro «STAR-H y PHR · Tablero comparativo».</p>`;
}
const guardadas = S.store.get('fuentes', null);
pintar(guardadas || BASE, guardadas ? 'Últimos datos guardados.' : 'Lista base.');
actualizar();
})();
</script>
