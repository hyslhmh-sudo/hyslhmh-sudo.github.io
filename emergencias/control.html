<style>
/* Tablero de control · general, por unidad y por establecimiento · versión 0 (20/11/2026) · solo lectura.
 * Diseño aprobado por Belén el 20/11/2026 (canvas «Tablero de control · App COESP · Pantallas (v0)»).

:root{--texto:#1D2129;--suave:#5B6270;--linea:#E1E4EA;--fondo:#F4F5F8;--papel:#fff;--rojo:#D32F2F;--amar:#E0A100;--verde:#3B8B2E;--gris:#9E9E9E;
  --azul:#1F5FA8;--turq:#0E8C8C;--viol:#6A3FA0;--rojoS:#C62828;--naranja:#F57C00}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--texto);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14.5px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.ms{font-family:'Material Symbols Outlined';font-size:20px;line-height:1;display:inline-block;vertical-align:middle;font-feature-settings:'liga'}
.oculto{display:none!important}
.barra{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,#8A4A00 0%,#F57C00 100%);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:6px}
.barra h1{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra h1 small{display:block;font-size:11.5px;font-weight:500;opacity:.9}
.icono{background:transparent;border:0;color:inherit;height:40px;padding:0 10px;border-radius:10px;display:inline-flex;gap:6px;align-items:center;cursor:pointer;font-weight:600;font-size:13px;text-decoration:none}
.icono:hover{background:rgba(255,255,255,.16)}
main{max-width:1240px;margin:0 auto;padding:18px 16px 40px}
.kick{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--rojoS)}
.tit{font-size:24px;font-weight:800;margin:2px 0}
.sub{font-size:13px;color:var(--suave)}
.cabeza{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-end}
.sello{font-size:12px;color:var(--suave)}
.aviso{margin-top:12px;background:#FFF6E0;border:1px solid #F0D58C;color:#6B4A00;border-radius:10px;padding:8px 12px;font-size:12.5px}
.sec{display:flex;align-items:center;gap:10px;margin:26px 0 12px;flex-wrap:wrap}
.sec h2{margin:0;font-size:17px;font-weight:800}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{position:relative;overflow:hidden;background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-height:140px}
.bgi{position:absolute;right:-6px;bottom:-14px;font-size:112px!important;opacity:.08;pointer-events:none}
.ct{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ct h3{margin:0;font-size:15px;font-weight:700}
.row{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:2px 0}
.row>span:last-child{font-weight:600;text-align:right}
.big{font-size:30px;font-weight:800;line-height:1.1}
.muted{font-size:12px;color:var(--suave)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;flex:none}
.chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.c-v{background:#E7F3E3;color:#24561B}.c-a{background:#FBF0D4;color:#6B4A00}.c-r{background:#FBE3E3;color:#8E1F1F}.c-n{background:#EEEEEE;color:#4A4A4A}
.lnk{background:none;border:0;padding:6px 0 0;font-size:12.5px;font-weight:700;color:var(--azul);cursor:pointer;text-align:left;min-height:32px;align-self:flex-start;margin-top:auto}

.pill{font-size:13px;font-weight:700;border-radius:999px;padding:8px 14px;border:1px solid #D3D7DF;background:#fff;cursor:pointer;min-height:38px;text-decoration:none;color:var(--texto);display:inline-flex;align-items:center;gap:6px}

.campo{display:block;margin:14px 0}.campo span{display:block;font-size:12.5px;font-weight:600;color:var(--suave);margin-bottom:5px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--azul);color:#fff;min-height:44px}

.semaf{display:flex;gap:6px;justify-content:center}

.solo-movil{display:none}
footer{text-align:center;padding:10px 16px 28px}footer img{width:66.67%;min-width:min(300px,92%);max-width:900px;object-fit:contain;height:auto}footer p{font-size:11.5px;color:var(--suave);margin:6px 0 0}
@media (max-width:640px){.tw.esc{display:none}.solo-movil{display:block}.refs{grid-template-columns:1fr}.icono .t{display:none}}
@media print{.barra,.no-imp,footer{display:none!important}body{background:#fff}.card{break-inside:avoid}}

<script>
(function () {
'use strict';
const S = window.STARH, $ = s => document.querySelector(s), E = S.esc, app = $('#app');
const SD = 's/d (revisar)';
const COL = { v: '#3B8B2E', a: '#E0A100', r: '#D32F2F', n: '#9E9E9E' };
const LBL = { v: 'Normal', a: 'Alerta', r: 'Crítico', n: 's/d' };
const AREA = 'Área Programática Trelew';
// Puestos sanitarios que van como fila propia, con su nombre, hasta que se confirme de qué hospital dependen (Belén, 20/11/2026).
const SIN_DEP = ['L-009', 'L-010', 'L-080', 'L-081'];
const TRELEW = ['L-001', 'L-002'];
const EMERG = ['Inundación', 'Corte de energía', 'Falta de agua', 'Clima', 'Pandemia', 'Materiales peligrosos'];
const ESTADO_OK = /^(muy bueno|bueno|funciona)/i;
let D = null, M = null, offline = false, cargando = false;
const ST = Object.assign({ vista: 'general', unidad: '', estab: '', emerg: 'Inundación', cap: 'A' }, S.store.get('control2.vista', {}));
const abiertos = new Set();
const guardarVista = () => S.store.set('control2.vista', { vista: ST.vista, unidad: ST.unidad, estab: ST.estab, emerg: ST.emerg, cap: ST.cap });

/* ---------- utilidades ---------- */
const norm = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[«»"()]/g, ' ').replace(/\s+/g, ' ').trim();
const num = v => { const t = String(v == null ? '' : v).trim(); if (!t || /^s\/d/i.test(t)) return null; const n = Number(t.replace(/\./g, '').replace(',', '.')); return isFinite(n) ? n : null; };
const fmt = n => n == null ? SD : n.toLocaleString('es-AR');
const sd = v => { const t = String(v == null ? '' : v).trim(); return !t || /^s\/d/i.test(t) || t === '—' ? SD : t; };
const fecha = t => { const s = String(t || '').trim(); let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return new Date(+m[3], +m[2] - 1, +m[1]); m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const ddmm = d => d ? String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear() : SD;
const masMeses = (d, n) => { const x = new Date(d); x.setMonth(x.getMonth() + n); return x; };
const hoy = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const dias = d => Math.round((d - hoy()) / 864e5);
const peor = cs => cs.indexOf('r') >= 0 ? 'r' : cs.indexOf('a') >= 0 ? 'a' : cs.indexOf('v') >= 0 ? 'v' : 'n';
const pctCol = p => p == null ? 'n' : p >= 80 ? 'v' : p >= 50 ? 'a' : 'r';
const dot = c => `<span class="dot" style="background:${COL[c] || COL.n}"></span>`;
const chip = c => `<span class="chip c-${c}">${LBL[c]}</span>`;
const sumN = L => { const v = L.filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) : null; };
const cumplido = r => r && r.status === 'fulfilled' && r.value && r.value.ok ? r.value : null;

/* ---------- datos (con copia en el dispositivo para usar sin conexión) ---------- */
async function cargar(forzar) {
  if (cargando) return; cargando = true; offline = false;
  const c = S.store.get('control2.cache', null);
  if (c && !D) { D = c; armar(); pintar(); }
  try {
    if (!navigator.onLine) throw { offline: true };
    const pedidos = [['estab', 'estab_consolidado'], ['trans', 'transportes_leer'], ['agenda', 'red_agenda'], ['deriv', 'deriv_catalogo'], ['planes', 'plan_catalogo'],
      ['pac', 'red_pacientes'], ['matriz', 'coe_matriz'], ['sol', 'coe_solicitudes'], ['starh', 'tablero'], ['phr', 'phr_tablero'], ['vuln', 'vuln_barrios']];
    const R = await Promise.allSettled(pedidos.map(p => S.api(p[1], forzar ? { actualizar: true } : {}, 120000)));
    if (R[0].status === 'fulfilled' && R[0].value && R[0].value.sesion) { S.sesion.cerrar(); cargando = false; return vistaIngreso(); }
    const N = {}; pedidos.forEach((p, i) => { N[p[0]] = cumplido(R[i]); });
    if (!N.estab) throw (R[0].value || R[0].reason || { error: 'No se pudo leer el consolidado de establecimientos.' });
    N.pc = {};
    const cods = ((N.planes && N.planes.planes) || []).map(p => p.codigo);
    const RP = await Promise.allSettled(cods.map(k => S.api('plan_pc', { codigo: k }, 90000)));
    cods.forEach((k, i) => { const v = cumplido(RP[i]); if (v) N.pc[k] = v.planes || []; });
    N.cuando = new Date().toLocaleString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    D = N; S.store.set('control2.cache', D);
  } catch (e) {
    if (!D) { cargando = false; app.innerHTML = `<div class="vacio">${E((e && (e.error || e.message)) || (e && e.offline ? 'Sin conexión y sin copia guardada en este dispositivo.' : 'No se pudo cargar el tablero.'))}</div>`; return; }
    offline = true;
  }
  cargando = false; armar(); pintar();
}

/* ---------- modelo ---------- */
function estadoFicha(f) {
  if (!f) return null;
  const SECC = f.caps ? 8 : 10, c = f.claves || [];
  // Mismas secciones que la página Establecimientos: alcanza con que una sección tenga un dato.
  const SEC = f.caps ? [['nombre','corto','sisa','depende','horario','ref'],['dir','coord','accesos','cortes','inundable','agua_cerca'],['servicios','camillas','pob_at','barrios'],['grupo','grupo_h','tanques','limpieza','limpieza_f','agua_alt','oxigeno','calef','comun'],['trab_total','med_total','med_oper','enf_total','ref_tit','ref_alt'],['contactos'],['plan','extintores','ext_cant','ext_estado','simulacro','sim_fecha','cap_ext','cap_fecha','seg_obs'],['emerg_rol','antec']]
    : [['nombre','corto','sisa','complejidad','depende','h24','guardia','ref'],['dir','coord','accesos','cortes','inundable','agua_cerca'],['pob_at','pob_ciu','viv','depto','pob_depto','dens','mayores','indices','sin_cob'],['servicios','camas','camas_obs','cam_guardia','arm','ambs','movs','chofer'],['grupo','grupo_areas','grupo_h','tanques','limpieza','limpieza_f','agua_alt','oxigeno','calef','comun'],['trab_total','med_total','med_oper','enf_total','ref_tit','ref_alt'],['contactos'],['plan','extintores','ext_cant','ext_estado','simulacro','sim_fecha','cap_ext','cap_fecha','seg_obs'],['antec']];
  const n = SEC.filter(s => s.some(k => c.indexOf(k) >= 0)).length;
  return Math.round(n / SEC.length * 100);
}
function aguaDe(d, base) {
  const g = k => { const v = (d && d[k]) || (base && base[k]) || ''; return /^s\/d/i.test(v) || v === '—' ? '' : v; };
  const clas = t => !t || /sin registro/i.test(t) ? null : /no apta|no cumple|arriba|supera|fuera de norma|no potable/i.test(t) ? 'no' : /^apta\b|^apta$|apta con/i.test(t.trim()) ? 'si' : 'obs';
  const an = (fk, rk, nk, meses) => {
    const f = fecha(g(fk)), r = g(rk), nc = g(nk), cl = clas(r) === 'si' && nc ? 'obs' : clas(r);
    if (!f && !cl) return { fecha: SD, res: r || SD, vence: SD, c: 'n', cl: null };
    const v = f ? masMeses(f, meses) : null, dd = v ? dias(v) : null;
    const c = cl === 'no' || (dd != null && dd < 0) || !f ? 'r' : cl === 'obs' || (dd != null && dd <= 60) ? 'a' : 'v';
    return { fecha: f ? ddmm(f) : SD, res: r || SD, vence: v ? ddmm(v) : SD, c: c, cl: cl };
  };
  const b = an('agua_bact_fecha', 'agua_bact_resultado', 'agua_bact_no_cumple', 6), q = an('agua_fq_fecha', 'agua_fq_resultado', 'agua_fq_no_cumple', 12);
  const cls = [b.cl, q.cl];
  const apta = cls.indexOf('no') >= 0 ? 'No' : cls.indexOf('si') >= 0 || cls.indexOf('obs') >= 0 ? 'Sí' : SD;
  const c = apta === SD ? 'n' : apta === 'No' ? 'r' : peor([b.c === 'n' ? 'a' : b.c, q.c === 'n' ? 'a' : q.c]);
  return { apta: apta, c: c, bac: b, fq: q };
}
function incendioDe(d) {
  if (!d || !['plan', 'extintores', 'simulacro', 'ext_estado', 'sim_fecha', 'cap_ext', 'cap_fecha'].some(k => d[k])) return { pct: null, c: 'n', partes: null };
  let ext = 0; const est = d.ext_estado || '', cant = num(d.ext_cant), venc = num(d.ext_venc);
  if (S.esSi(d.extintores) || est) {
    if (/todos al d/i.test(est)) ext = 25;
    else if (/algunos/i.test(est)) ext = cant && venc != null && venc <= cant ? 25 * (cant - venc) / cant : 12.5;
    else ext = 0;
  }
  const anual = (si, f) => { const x = fecha(f); if (x) return dias(masMeses(x, 12)) >= 0 ? 25 : 12.5; return S.esSi(si) ? 12.5 : 0; };
  const plan = S.esSi(d.plan) ? 25 : 0, sim = anual(d.simulacro, d.sim_fecha), cap = anual(d.cap_ext, d.cap_fecha);
  const pct = Math.round((ext + plan + sim + cap) * 10) / 10;
  return { pct: pct, c: pctCol(pct), partes: { ext: ext, plan: plan, sim: sim, cap: cap } };
}
function armar() {
  const est = (D.estab.establecimientos || []).filter(e => e.area === AREA && !/sede administrativa/i.test(e.tipo || ''));
  const hosp = est.filter(e => /^hospital/i.test(e.tipo || ''));
  const lug = {}; ((D.trans && D.trans.base && D.trans.base.lugares) || []).forEach(l => { lug[l.id] = l; });
  const flota = {}; ((D.trans && D.trans.hospitales) || []).forEach(h => { flota[h.id] = h; });
  const nombreSt = []; [D.starh, D.phr].forEach((t, i) => ((t && t.redes) || []).forEach(r => (r.establecimientos || []).forEach(x => nombreSt.push([i, norm(x.nombre), x.estado]))));
  const relev = (e, i) => { const n = norm(e.corto || e.nombre), m = nombreSt.find(x => x[0] === i && (x[1].indexOf(n) >= 0 || x[1].indexOf(norm(e.nombre)) >= 0)); return m ? m[2] : SD; };
  const codPlan = e => e.id === 'L-001' ? 'HZT' : e.id === 'L-002' ? 'HMH' : e.id === 'L-003' ? 'HSST' : '';
  const unidadDe = e => {
    if (TRELEW.indexOf(e.id) >= 0) return 'trelew';
    if (/^hospital/i.test(e.tipo || '') || SIN_DEP.indexOf(e.id) >= 0) return e.id;
    const dep = norm(e.depende);
    if (/hospital zonal trelew/.test(dep)) return 'trelew';
    const h = dep && hosp.find(x => norm(x.nombre).indexOf(dep) === 0);
    return h ? h.id : e.id;
  };
  const E2 = est.map(e => {
    const f = e.ficha, d = (f && f.datos) || {}, fl = flota[e.id] || {};
    const cuentaOk = L => Array.isArray(L) && L.length ? L.filter(x => ESTADO_OK.test(x.estado || '')).length : null;
    let amb = cuentaOk(fl.ambs); if (amb == null && d.ambs && typeof d.ambs === 'object' && !Array.isArray(d.ambs)) amb = Object.keys(d.ambs).filter(k => ESTADO_OK.test(k)).reduce((a, k) => a + d.ambs[k], 0) || null;
    const inc = incendioDe(d), agua = aguaDe(d, (lug[e.id] || {}).agua), fp = estadoFicha(f), cp = codPlan(e);
    const planes = cp && D.pc && D.pc[cp] ? D.pc[cp].map(p => ({ plan: p.Plan || p['Código'], cod: p['Código'] || '', estado: p.Estado || SD, tipo: p.Tipo || '' })) : null;
    let planC = 'n', planTxt = SD;
    if (planes && planes.length) {
      const ap = planes.filter(p => /aprobado/i.test(p.estado)).length, enM = planes.filter(p => !/sin empezar|aprobado/i.test(p.estado)).length, pct = Math.round(ap / planes.length * 100);
      if (cp !== 'HMH' && !ap && !enM) { planC = 'n'; planTxt = '2027'; } else { planC = pctCol(pct); planTxt = ap + ' de ' + planes.length + ' aprobados'; }
    }
    return { id: e.id, nombre: e.nombre, corto: e.corto || e.nombre, tipo: e.tipo, loc: /^s\/d/.test(e.loc || '') ? SD : e.loc, unidad: unidadDe(e), ficha: f, puede: !!(f && f.puede),

    + (capA ? fila('Siguen funcionando (' + E(ST.emerg) + ')', `s/d de ${ests.length}`, 'n') + fila('Albergues', u.alb.length || SD) + (rolCaps ? `<div class="muted" style="margin-top:4px">Lo que declara cada CAPS en su ficha:</div>${rolCaps}` : '')
      : fila('Receptoras públicas y privadas', u.rec.length || SD) + (abiertos.has('rec') ? `<div class="caja">${u.rec.map(r => `<b>${E(r.nombre)}</b> · ${E(sd(r.tipo))} · ${E(sd(r.localidad))}<br><span class="muted">${E(sd(r.distancia))} · ${E(sd(r.tiempo))} · internación ${E(sd(r.internacion_est))} · UTI adultos ${E(sd(r.uti_adultos_est))}</span>`).join('<br>') || SD}</div>` : '') + `<button class="lnk" type="button" data-crit="rec">${abiertos.has('rec') ? 'Ocultar lista' : 'Ver lista con nombre y capacidad'}</button>`);
  const tipos = {}; u.pob.forEach(p => { tipos[p.tipo || 'Otro'] = (tipos[p.tipo || 'Otro'] || 0) + 1; });
  const pobHtml = Object.keys(tipos).length ? Object.keys(tipos).sort().map(k => fila(E(k), tipos[k])).join('') + (abiertos.has('pob') ? `<div class="caja">${u.pob.map(p => `<b>${E(p.nombre)}</b> · ${E(sd(p.tipo))}<br><span class="muted">plazas ${E(sd(p.poblacion))} · dependientes ${E(sd(p.dependientes))}</span>`).join('<br>')}</div>` : '') + `<button class="lnk" type="button" data-crit="pob">${abiertos.has('pob') ? 'Ocultar lista' : 'Ver nombre, plazas y dependientes'}</button>` : fila('Instituciones cargadas', SD, 'n');
  const pat = Object.keys(u.pat || {});
  const pacHtml = `<div class="big">${u.pac == null ? SD : u.pac}</div><button class="lnk" type="button" data-crit="pac" style="margin-top:0">De qué dependen ${abiertos.has('pac') ? '▴' : '▾'}</button>${abiertos.has('pac') ? `<div class="caja">${pat.length ? pat.map(k => `${E(k)}: ${u.pat[k]}`).join('<br>') : SD}</div>` : ''}`;
  const tar = u.tareas;
  const fichaPct = e ? e.fichaPct : u.ficha;
  return nav + fichaBtn + lista + recursos
    + sec('Preparación', 'var(--rojoS)') + `<div class="grid">
      ${tarjeta('description', '#C62828', 'Planes', planesHtml + crit('c6', '6', 'Estados: sin empezar, compilando información, en redacción, en revisión, presentado a la Dirección, aprobado. Avance = planes aprobados sobre el total. Gris: no corresponde aún (HZT y HSST, 2027).'), planC)}
      ${tarjeta('local_fire_department', '#C62828', 'Seguridad básica', fila('Índice contra incendios', inc == null ? SD : inc + ' %', incC) + incDet + `<button class="lnk" type="button" data-crit="agua" style="margin-top:0;display:flex;justify-content:space-between;width:100%;color:inherit;font-weight:400;font-size:14px"><span>Agua apta para consumo ${abiertos.has('agua') ? '▴' : '▾'}</span><span style="font-weight:600">${dot(aguaC)}${E(aguaTxt)}</span></button>` + aguaDet + crit('c7', '7', 'Índice: extintores, plan de evacuación, simulacro y capacitación en uso de extintores, 25 % cada uno. Extintores bajan en proporción a los vencidos. Simulacro y capacitación: anual; con más de 12 meses valen la mitad. LEY · Dto. 351/79, Anexo VII, cap. 18. Agua: el color toma el peor de los dos análisis; bacteriológico cada 6 meses y físico-químico cada 12 (LEY · Dto. 351/79, Anexo I, cap. 6, arts. 57 y 58).'), segC)}
      ${tarjeta('fact_check', '#6A3FA0', 'Relevamientos', relHtml + crit('c5', '', 'Cada línea por separado y por establecimiento: STAR-H, PHR e ISH no se mezclan. Hoy se muestra el estado del relevamiento.'), null)}</div>`
    + sec('Capacidad y población', 'var(--turq)') + `<div class="grid">
      ${tarjeta('bed', '#0E8C8C', 'Capacidad estimada', capHtml + crit('c8', '', 'Camas: única fuente LUGARES. Qué sigue funcionando se carga por establecimiento y tipo de emergencia; lo decide la Dirección o el Área Externa con el COE. Receptoras y albergues: con nombre y capacidad, sin contactos.'))}
      ${tarjeta('groups', '#0E8C8C', 'Población a cargo', pobHtml + crit('c9', '5', 'Instituciones con población dependiente (cárceles, comisarías, geriátricos, hogares), por localidad. Sin contactos.'))}
      ${tarjeta('monitor_heart', '#0E8C8C', 'Pacientes con necesidades especiales', pacHtml + crit('c10', '', 'Total y de qué dependen. El mapa con un punto por paciente lo ve solo la lista cerrada con acceso a esos datos.'))}</div>`
    + sec('Seguimiento', 'var(--viol)') + `<div class="grid">
      ${tarjeta('checklist', '#6A3FA0', 'Tareas y pedidos', fila('Tareas abiertas', tar.abiertas) + fila('Vencidas', tar.venc) + fila('Vencen en 15 días', tar.prox) + crit('c11', '8', 'Tareas del COEsp del hospital. Hasta que la matriz tenga la columna «Hospital», se asignan por el nombre del proyecto (PE-HMH, PC-HMH…).'), tar.c)}
      ${tarjeta('badge', '#6A3FA0', 'Ficha del establecimiento', `<div style="height:10px;background:#EEF0F3;border-radius:5px;margin:8px 0"><div style="height:10px;border-radius:5px;width:${fichaPct || 0}%;background:${COL[pctCol(fichaPct)]}"></div></div>${fila('Completa', fichaPct == null ? SD : fichaPct + ' %')}${e && e.ficha ? `<button class="lnk" type="button" data-ficha="${E(e.ficha.est)}" style="margin-top:0">${e.puede ? 'Completar la ficha ›' : 'Ver la ficha ›'}</button>` : !e ? '<span class="muted">la ficha se completa en cada establecimiento</span>' : ''}` + crit('c12', '9', 'Porcentaje de secciones con datos; «s/d» cuenta como faltante. Verde 80 % o más, amarillo 50 a 79 %, rojo menos de 50 %.'), pctCol(fichaPct))}</div>`;
}

/* ---------- descargas ---------- */
function bajar(nombre, tipo, contenido) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿', contenido], { type: tipo }));
  a.download = nombre.replace(/[\\/:*?"<>|]/g, '-'); document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const fechaArch = () => new Date().toLocaleDateString('es-AR').replace(/\//g, '-');
function csv() {
  const q = v => '"' + String(v == null ? SD : v).replace(/"/g, '""') + '"';
  const L = [['Unidad', 'Qué suma', 'Médicos', 'Médicos operativos', 'Enfermeros', 'Ambulancias', 'Vehículos de apoyo', 'Población a cargo', 'Planes', 'Seguridad básica', 'Tareas', 'Ficha (%)', 'Camas']]
    .concat(M.unidades.map(u => [u.nombre, u.sub, u.med, u.medOp, u.enf, u.amb, u.veh, u.pob.length, u.planTxt, u.segTxt, u.tarTxt, u.ficha, u.camas]));
  bajar('Tablero de control - ' + fechaArch() + '.csv', 'text/csv', L.map(r => r.map(q).join(';')).join('\r\n'));
}
function word() {
  const cuerpo = app.cloneNode(true); cuerpo.querySelectorAll('.no-imp,button.lnk,.solo-movil').forEach(n => n.remove()); cuerpo.querySelectorAll('.ms').forEach(n => n.remove());
  const css = 'body{font-family:Arial,sans-serif;font-size:9.5pt;color:#1D2129}table{border-collapse:collapse;width:100%}td,th{border:1pt solid #D3D7DF;padding:3pt 5pt;font-size:8.5pt}.card{border:1pt solid #D3D7DF;padding:6pt;margin:4pt 0}.dot{display:none}.big{font-size:14pt;font-weight:bold}h2{font-size:11pt;border-bottom:1.5pt solid #F57C00}';
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>Tablero de control</title><style>${css}</style></head><body>${cuerpo.innerHTML}<p style="text-align:center"><img src="https://hyslhmh-sudo.github.io/emergencias/logo-hysl.png" width="472" alt="HySL"></p><p style="text-align:center;font-size:8pt">Versión 0 · fecha de corte ${E(D.cuando || '')}</p></body></html>`;
  bajar('Tablero de control - ' + fechaArch() + '.doc', 'application/msword', html);
}

/* ---------- ingreso ---------- */
function vistaIngreso() {
  ['#bAct', '#bWord', '#bCsv'].forEach(s => $(s).classList.add('oculto'));
  app.innerHTML = `<form class="ingreso" id="fIng"><h2 style="margin:0 0 4px">Tablero de control</h2><p class="sub">Ingresá con el mismo usuario y clave de las apps.</p>
    <label class="campo"><span>Usuario (nombre y apellido)</span><input name="dni" autocomplete="username" autocapitalize="words" spellcheck="false" required maxlength="200"></label>
    <label class="campo"><span>Clave</span><input name="clave" type="password" autocomplete="current-password" required maxlength="40"></label>
    <button class="btn" type="submit" style="width:100%"><span class="ms">login</span>Ingresar</button><div class="msg oculto" id="msg" style="margin-top:10px"></div></form>`;
  $('#fIng').addEventListener('submit', async ev => {
    ev.preventDefault(); const f = ev.target, b = f.querySelector('button'), m = $('#msg'); b.disabled = true; m.classList.add('oculto');
    try { const r = await S.api('login', { dni: f.dni.value, clave: f.clave.value }); if (!r.ok) throw r; S.sesion.guardar(r.token, r.usuario); app.innerHTML = '<div class="vacio">Cargando…</div>'; cargar(); }
    catch (e) { m.textContent = (e && (e.error || e.message)) || 'No se pudo ingresar.'; m.classList.remove('oculto'); }
    finally { b.disabled = false; }
  });
}

/* ---------- eventos ---------- */
app.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.ir === 'general') { ST.vista = 'general'; ST.estab = ''; }
  else if (t.dataset.unidad) { ST.vista = 'unidad'; ST.unidad = t.dataset.unidad; ST.estab = ''; abiertos.clear(); }
  else if (t.dataset.estab) { ST.vista = 'estab'; ST.estab = t.dataset.estab; abiertos.clear(); }
  else if (t.dataset.emerg) ST.emerg = t.dataset.emerg;
  else if (t.dataset.cap) ST.cap = t.dataset.cap;
  else if (t.dataset.crit) { const k = t.dataset.crit; abiertos.has(k) ? abiertos.delete(k) : abiertos.add(k); }
  else if (t.dataset.ficha) { S.store.set('ficha.estab', t.dataset.ficha); location.href = 'ficha.html'; return; }
  else return;
  guardarVista(); pintar();
  if (t.dataset.unidad || t.dataset.estab || t.dataset.ir) window.scrollTo({ top: 0 });
});
$('#bAct').addEventListener('click', () => { app.insertAdjacentHTML('afterbegin', '<div class="aviso">Actualizando…</div>'); cargar(true); });
$('#bWord').addEventListener('click', word);
$('#bCsv').addEventListener('click', csv);
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
if (S.sesion.token()) cargar(); else vistaIngreso();
})();
</script>
</body>
</html>
