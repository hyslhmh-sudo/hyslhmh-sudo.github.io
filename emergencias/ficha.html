<title>Ficha del establecimiento · Emergencias y desastres</title>

<style>
/* 14/11/2026 · VISTA DE PRUEBA (v0) de la ficha del establecimiento para los referentes de los hospitales rurales.
   No guarda en el libro: lo cargado queda solo en este equipo. Diseño pedido por Belén. */
:root{--fuerte:#172B4D;--medio:#2F5BEA;--claro:#E4EAFB;--borde:#C5D1F2;--texto:#172B4D;--suave:#4B5B73;--tenue:#6B7A90;--fondo:#F5F7FB;--coral:#F57C00;--ok:#1E8E5A}
*{box-sizing:border-box}
.deps{margin-top:14px;padding:12px 14px;border:1px solid var(--borde);border-radius:12px;background:#fff}.deps h4{margin:0 0 4px;color:var(--fuerte)}.deps .nota{margin:4px 0;color:var(--suave);font-size:13px}.tabla-dep{overflow-x:auto}.tabla-dep table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}.tabla-dep th,.tabla-dep td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--borde);vertical-align:middle}.tabla-dep th{color:var(--suave);font-weight:600}.tabla-dep .btn{padding:4px 10px;font-size:13px}
html,body{margin:0;background:var(--fondo);color:var(--texto);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;line-height:1.5}
.ms{font-family:'Material Symbols Outlined';font-size:20px;line-height:1;display:inline-block;vertical-align:middle;font-feature-settings:'liga'}
.barra{position:sticky;top:0;z-index:5;background:var(--fuerte);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--medio)}
.barra h1{font-size:16px;margin:0;flex:1}.barra h1 small{display:block;font-size:11.5px;font-weight:500;opacity:.85}
.icono{color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;font-weight:600;font-size:13px;background:none;border:0;cursor:pointer;font-family:inherit}
.icono:hover{background:rgba(255,255,255,.14)}
main{max-width:860px;margin:0 auto;padding:16px 16px 40px}
.aviso{background:#FFF6EC;border:1.5px solid var(--coral);border-left:6px solid var(--coral);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.cab{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:14px 16px;margin-bottom:14px;display:grid;gap:10px}
.cab label{font-size:12.5px;font-weight:700;color:var(--suave)}
select,input,textarea{width:100%;border:1px solid var(--borde);border-radius:10px;padding:9px 11px;font:inherit;font-size:14px;background:#fff;color:var(--texto)}
textarea{min-height:64px;resize:vertical}
.prog{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* 21/11/2026 · Lo que falta cargar (se actualiza con cada dato) */
#falta{margin-top:10px;border-radius:14px;overflow:hidden;border:1px solid #EBC3D3;background:#fff}
#falta .fc{display:flex;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(135deg,#2F5BEA 0%,#00897B 100%);color:#fff;font-weight:800;font-size:14px}
#falta .fb{padding:10px 14px 8px;border-left:5px solid #C2185B;font-size:13.5px;line-height:1.5}
#falta .fb p{margin:0 0 6px}#falta ul{margin:0 0 8px;padding-left:18px}#falta li{margin:2px 0}
#falta a{color:#2F5BEA;font-weight:800;text-decoration:none;cursor:pointer}#falta a:hover{text-decoration:underline}
#falta .pre{color:#C2185B;font-weight:800}#falta.ok .fb{border-left-color:#1E8E5A}
.barrita{flex:1;min-width:160px;height:10px;background:var(--claro);border-radius:999px;overflow:hidden}.barrita i{display:block;height:100%;background:var(--medio)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--claro);color:var(--fuerte)}
.chip.ok{background:#E3F4EC;color:var(--ok)}.chip.falta{background:#FFF0E0;color:#B35500}
details.sec{background:#fff;border:1px solid var(--borde);border-left:5px solid var(--medio);border-radius:14px;margin-bottom:10px}
details.sec>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:700}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .n{width:28px;height:28px;border-radius:9px;background:var(--claro);display:grid;place-items:center;font-size:13px;flex:none}
details.sec>summary .t{flex:1}details.sec>summary .t small{display:block;font-weight:500;font-size:12px;color:var(--suave)}
details.sec>summary .fl{color:var(--medio);transition:transform .2s}details.sec[open]>summary .fl{transform:rotate(180deg)}
details.sec[open]>summary{border-bottom:1px solid var(--claro)}
details.sec.min{border-left-color:var(--coral)}
.pre{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:#e3f2ea;color:#1f6b45;vertical-align:middle;margin-left:4px}
.cuerpo{padding:12px 14px 14px;display:grid;gap:12px}
.campo>span{display:block;font-size:12.5px;font-weight:700;color:var(--suave);margin-bottom:4px}
.campo>span em{font-style:normal;font-weight:500;color:var(--tenue)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.dos{grid-template-columns:1fr}}
.sn{display:flex;gap:6px;flex-wrap:wrap}.sn label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--borde);border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer;background:#fff}
.sn input{width:auto;margin:0}.sn label:has(input:checked){background:var(--claro);border-color:var(--medio);font-weight:700}
.auto{background:var(--fondo);border:1px dashed var(--borde);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--suave)}
.rep{display:grid;gap:8px}.rep .fila{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));background:var(--fondo);border-radius:10px;padding:8px;position:relative}
.tabw{overflow-x:auto}.tab{border-collapse:collapse;width:100%;max-width:640px}.tab th{font-size:12px;text-align:left;padding:4px 6px;color:var(--tenue);border-bottom:1.5px solid var(--claro)}.tab td{padding:3px 4px;border-bottom:1px solid var(--claro)}
.tab input{width:100%;box-sizing:border-box;min-width:64px}.tab input.nom{border:0;background:transparent;font-weight:600;padding-left:2px}.tab input.num{max-width:110px;text-align:center}.tab .quitar{border:0;background:none;color:var(--tenue);cursor:pointer}
.tab td.nomfijo{font-weight:600;padding-right:12px}
.estadoG{font-size:12px;color:var(--tenue);min-height:16px;margin-top:4px}.estadoG.mal{color:#C62828;font-weight:600}
.ayuda{display:block;color:var(--tenue);font-size:12px;margin:-2px 0 6px}
.rep .rc{display:block;margin:0}.rep .rc small{display:block;font-size:11px;font-weight:700;color:var(--tenue);margin:0 0 2px;line-height:1.2}
.rep .fila .quitar{position:absolute;top:4px;right:4px;border:0;background:none;color:var(--tenue);cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--medio);border-radius:10px;padding:7px 12px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;background:#fff;color:var(--fuerte);width:max-content}
.btn.pri{background:var(--medio);color:#fff}
.tag{font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 6px;margin-right:4px;vertical-align:1px}.tag.ley{background:#172B4D;color:#fff}.tag.mej{background:var(--claro);color:var(--fuerte)}
.pie{font-size:12px;color:var(--tenue)}
footer{text-align:center;padding:10px 16px 28px}footer img{width:66.67%;min-width:min(300px,92%);max-width:900px;object-fit:contain;height:auto}
.paso{font-size:15px;margin:18px 0 6px;color:var(--fuerte)}.paso small{font-weight:400;color:var(--tenue);font-size:12px}
.blanco-cab{border:1.5px solid #999;border-radius:8px;padding:10px;margin-bottom:10px;line-height:2}
@media print{.barra .icono,.aviso,.no-imp,#prog{display:none}details.sec{break-inside:avoid}details.sec summary .chip,details.sec summary .fl{display:none}
body.blanco input:not([type=radio]):not([type=checkbox]),body.blanco textarea,body.blanco select{border:0;border-bottom:1px solid #777;border-radius:0;background:none}
body.blanco textarea{min-height:70px;border:1px solid #777}body.blanco select{-webkit-appearance:none;appearance:none}}
</style>

  const L = deps.filter(d => d.id && esDeEste(d.depende)).sort((x, y) => String(x.tipo).localeCompare(String(y.tipo)) || String(x.nombre).localeCompare(String(y.nombre)));
  if (!L.length) { box.innerHTML = cab + '<p class="nota">No figura ninguna dependencia de este establecimiento en LUGARES.</p>'; return; }
  const porTipo = {}; L.forEach(d => porTipo[d.tipo || 's/d'] = (porTipo[d.tipo || 's/d'] || 0) + 1);
  const fichas = srv.establecimientos || ESTAB;
  box.innerHTML = cab + `<p class="nota"><b>${L.length}</b>: ${Object.keys(porTipo).map(k => `${porTipo[k]} ${E(k)}`).join(' · ')}</p><div class="tabla-dep"><table><thead><tr><th>Tipo</th><th>Nombre</th><th>Localidad</th><th class="no-imp"></th></tr></thead><tbody>${L.map(d => `<tr><td>${E(d.tipo || 's/d (revisar)')}</td><td>${E(d.nombre || d.corto || d.id)}</td><td>${E(d.loc || 's/d (revisar)')}</td><td class="no-imp">${fichas.indexOf(d.nombre) >= 0 ? `<button class="btn" type="button" data-verficha="${E(d.nombre)}">Abrir su ficha</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
}
function pintar() {
  leer();
  const B = window.__blanco;
  app.innerHTML = B ? `<div class="blanco-cab"><b>Ficha del establecimiento · planilla para completar a mano</b><br>Establecimiento: ____________________________________ &nbsp; Fecha: ____/____/______<br>Completó (apellido y nombre): ____________________________________</div>
  <h2 class="paso">Paso 2 · Datos del establecimiento</h2><p class="pie" style="text-align:left">(El paso 1, «Mis datos», se completa en la app al ingresar.)</p>${SEC.map((s, i) => secHtml(s, i + 1)).join('')}
  <p class="pie">Versión 0. Lo que no se sabe se deja en blanco o se anota «no sabe». Después se pasa a la app (se puede cargar por partes).</p>` : `${srv.puede ? `<div class="aviso" style="background:var(--claro)"><b>Algunos datos ya vienen cargados</b> con la información que tenemos (marcados «Precargado»): revisalos y corregilos si no son correctos. Si están bien, tocá <button class="btn" type="button" onclick="confirmarPre()" style="display:inline-flex;margin:4px 0">Confirmar los precargados</button><br><b>Se completa por partes.</b> No hace falta cargar todo de una vez: cada dato se guarda solo en el libro apenas lo escribís. Podés cerrar y seguir otro día, por la sección que quieras. Lo que no sabés, dejalo vacío.</div>` : `<div class="aviso"><b>Solo lectura.</b> Esta ficha la carga el referente del establecimiento (y Administración).</div>`}
  <div class="cab"><label for="selEst">Establecimiento</label><select id="selEst">${(srv.establecimientos || ESTAB).map(e => `<option value="${E(e)}"${e === estab ? ' selected' : ''}>${E(e)}${(srv.mios || []).indexOf(e) < 0 ? ' (solo lectura)' : ''}</option>`).join('')}</select>
  <div id="estadoG" class="estadoG" aria-live="polite"></div>
  <div class="no-imp" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn" type="button" onclick="imprimir(true)"><span class="ms">print</span>Imprimir planilla en blanco</button><button class="btn" type="button" onclick="imprimir(false)"><span class="ms">print</span>Imprimir lo cargado</button></div>
  <div id="prog"></div><div id="falta" class="no-imp" hidden></div></div>
  <h2 class="paso">Paso 1 · Mis datos <small>(se completan al ingresar; para revisarlos, en el inicio tocá tu nombre)</small></h2>
  <h2 class="paso">Paso 2 · Datos del establecimiento <small>(se puede completar por partes)</small></h2>
  <fieldset ${srv.puede ? '' : 'disabled'} style="border:0;padding:0;margin:0;min-width:0">${SEC.map((s, i) => secHtml(s, i + 1)).join('')}</fieldset>
  <p class="pie">Versión 0. Lo que no se sabe queda como «s/d (revisar)». Base orientadora: no es un registro en tiempo real.</p>`;
  progreso();  if (!B) rolesEnFicha();
}
// 21/11/2026 · Roles de llamada (en diseño): debajo de «Cadena de llamadas», resumen y acceso a la tarjeta. Solo para quien el servidor habilita (roles_acceso).
let ROLES_RES = null;
async function rolesEnFicha() {
  if (!S.store.get('roles.quien', '') || (S.sesion.enVista && S.sesion.enVista())) return;
  const ta = app.querySelector('textarea[data-k="cadena"]'); if (!ta) return;
  try { if (!ROLES_RES) { const r = await S.api('roles_leer', { solo: 'resumen' }); if (!r || !r.ok) return; ROLES_RES = r.resumen || {}; } } catch (e) { return; }
  const x = ROLES_RES[estab], lab = ta.closest('.campo'); if (!lab || document.getElementById('rolesFicha')) return;
  const d = document.createElement('div'); d.id = 'rolesFicha'; d.className = 'no-imp';
  d.style.cssText = 'background:#FBE7EF;border:1px solid #EBC3D3;border-radius:12px;padding:8px 12px;margin:-4px 0 12px;font-size:13px';
  d.innerHTML = x ? `<b>Roles de llamada</b> (en diseño): ${x.completas} de ${x.total} contingencias completas · ${x.cargadas} con pasos cargados (propios o del modelo). <a href="roles-llamada.html?est=${encodeURIComponent(estab)}">Ver los roles de llamada de este establecimiento</a>. Este campo de texto queda como antecedente.`
    : '<b>Roles de llamada</b> (en diseño): por ahora son para el HMH, el HZT, el HSST y sus CAPS.';
  lab.insertAdjacentElement('afterend', d);
}
// 21/11/2026 · Belén: «que les aparezca en pantalla lo que les falta cargar y, si corresponde, revisar y confirmar los precargados;
// que este cartel se actualice conforme avance la carga». Se recalcula con cada dato (lo llama progreso()).
const etq = c => String(c.l || '').replace(/<[^>]+>/g, '').replace(/^(LEY|MEJORA)/, '').split(' (')[0].split(': uno por fila')[0].replace(/ · opcional$/, '').replace(/, el establecimiento…$/, '').replace(/: los que .*$/, '').replace(/\.$/, '').trim();
function faltaBox() {
  const box = document.getElementById('falta'); if (!box) return;
  if (window.__blanco || !srv.puede) { box.hidden = true; return; }
  const filas = [], pres = [];
  SEC.forEach((s, i) => {
    const R = req(s).filter(c => !['h', 'auto', 'aguah'].includes(c.t)), f = R.filter(c => !lleno(c)).map(etq);
    const pr = s.c.filter(c => esPre(c.k)).map(etq);
    const a = `<a data-irsec="${s.id}">${i + 1} · ${E(s.t)}</a>`;
    // Corto para el celular: sección entera, hasta 4 datos por nombre, o los 3 primeros y «y N más».
    const lista = (L, todo) => todo ? '<b>toda la sección</b>' : L.length <= 4 ? L.map(E).join(', ') : L.slice(0, 3).map(E).join(', ') + ` y ${L.length - 3} más`;
    if (f.length) filas.push(`<li>${a}: ${lista(f, f.length === R.length && R.length > 2)}</li>`);
    if (pr.length) pres.push(`<li>${a}: ${lista(pr, false)}</li>`);
  });
  box.hidden = false; box.className = 'no-imp' + (filas.length || pres.length ? '' : ' ok');
  box.innerHTML = `<div class="fc"><span class="ms" style="font-size:20px">checklist</span>${filas.length || pres.length ? 'Lo que falta en esta ficha' : 'Ficha completa'}</div><div class="fb">`
    + (pres.length ? `<p><span class="pre">Revisá y confirmá</span> los datos precargados (si están bien, tocá «Confirmar los precargados»):</p><ul>${pres.join('')}</ul>` : '')
    + (filas.length ? `<p><b>Te falta cargar:</b></p><ul>${filas.join('')}</ul>` : '')
    + (filas.length || pres.length ? '<p style="color:var(--suave);font-size:12.5px">Se actualiza solo a medida que cargás. Tocá una sección para ir directo.</p>' : '<p>No falta nada obligatorio. Gracias.</p>')
    + '</div>';
}
app.addEventListener('click', ev => { const a = ev.target.closest && ev.target.closest('[data-irsec]'); if (!a) return; const d = document.getElementById(a.dataset.irsec); if (d) { d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' }); } });
function progreso() {
  faltaBox();
  const ok = SEC.filter(secOk).length, min = SEC.filter(s => s.min), minOk = min.every(secOk);
  const p = document.getElementById('prog'); if (!p) return;
  p.innerHTML = `<div class="prog"><div class="barrita"><i style="width:${Math.round(ok / SEC.length * 100)}%"></i></div><b>${ok} de ${SEC.length} secciones completas</b><small>· ${fechaAct()}</small>
    <span class="chip ${minOk ? 'ok' : 'falta'}"><span class="ms" style="font-size:16px">${minOk ? 'check_circle' : 'schedule'}</span>${minOk ? 'Ya están las secciones 1, 2, 7 y 8: alcanza para empezar STAR-H y PHR' : 'Sugerido: empezar por las secciones 1, 2, 7 y 8 (marcadas en naranja)'}</span></div>`;
  SEC.forEach(s => { const ch = document.querySelector(`[data-chip="${s.id}"]`); if (!ch) return; const R = req(s), n = R.filter(lleno).length; ch.className = 'chip ' + (n === R.length ? 'ok' : 'falta'); ch.textContent = n === R.length ? 'Completa' : n ? `En curso · ${n} de ${R.length}` : 'Sin empezar'; });
}
app.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.ahadj) { if (t.files && t.files.length) subirAguaAdj(t.files); t.value = ''; return; }
  if (t.dataset.af) { AH_FORM[t.dataset.af] = t.value; return; }
  if (t.id === 'selEst') { if (Object.keys(pend).length) { clearTimeout(tGuardar); enviar(); } cargar(t.value); return; }
  if (t.dataset.r) { const L = datos[t.dataset.r]; L[+t.dataset.i] = Object.assign({}, L[+t.dataset.i], { [t.dataset.c]: t.value }); return marcar(t.dataset.r); }
  if (t.dataset.m) { const k = t.dataset.k; datos[k] = [...app.querySelectorAll(`input[data-m][data-k="${k}"]:checked`)].map(x => x.value); return marcar(k); }
  if (t.dataset.k) { datos[t.dataset.k] = t.value; marcar(t.dataset.k); }
});
app.addEventListener('input', ev => { const t = ev.target; if (t.dataset.af) { AH_FORM[t.dataset.af] = t.value; return; } if (t.dataset.k && !t.dataset.m && t.type !== 'radio') { datos[t.dataset.k] = t.value; marcar(t.dataset.k); } else if (t.dataset.r) { const L = datos[t.dataset.r]; L[+t.dataset.i] = Object.assign({}, L[+t.dataset.i], { [t.dataset.c]: t.value }); marcar(t.dataset.r); } });
app.addEventListener('click', ev => {
  const a = ev.target.closest('[data-agregar]'), q = ev.target.closest('[data-quitar]'), g = ev.target.closest('[data-gps]');
  const ah = ev.target.closest('[data-ahnuevo],[data-ahedit],[data-ahquitar],[data-ahguardar],[data-ahcancelar],[data-ahadjq]');
  if (ah) { ev.preventDefault(); const D = ah.dataset;
    if (D.ahnuevo) { AH_FORM = { analisis: '', fecha: '', resultado: '', adj: [] }; pintarAgua(); }
    else if (D.ahedit) { const f = (AH.filas || []).find(x => String(x.fila) === D.ahedit); if (f) { AH_FORM = { fila: f.fila, analisis: f.analisis, fecha: ahFecha(f.fecha), lugar: f.lugar === 's/d' ? '' : f.lugar, resultado: f.resultado, detalle: f.detalle === 's/d' ? '' : f.detalle, muestra: f.muestra === 's/d' ? '' : f.muestra, lab: f.lab === 's/d' ? '' : f.lab, obs: f.obs, adj: (f.adj || []).slice() }; pintarAgua(); } }
    else if (D.ahquitar) { if (confirm('¿Quitar este análisis del historial?')) guardarAgua(D.ahquitar); }
    else if (D.ahguardar) guardarAgua();
    else if (D.ahcancelar) { AH_FORM = null; pintarAgua(); }
    else if (D.ahadjq != null) { AH_FORM.adj.splice(+D.ahadjq, 1); pintarAgua(); }
    return; }
  const va = ev.target.closest('[data-verarch]'); if (va) { ev.preventDefault(); verAdj(va.dataset.verarch, va.dataset.nom); return; }
  const vf = ev.target.closest('[data-verficha]'); if (vf) { if (Object.keys(pend).length) { clearTimeout(tGuardar); enviar(); } cargar(vf.dataset.verficha); window.scrollTo(0, 0); return; }
  const reabrir = id => { pintar(); const d = document.getElementById(id); if (d) d.open = true; };
  if (a) { const k = a.dataset.agregar; (datos[k] = datos[k] || []).push({}); marcar(k); srv.datos[k] = datos[k]; reabrir(a.closest('details').id); }
  if (q) { const k = q.dataset.quitar; datos[k].splice(+q.dataset.i, 1); marcar(k); srv.datos[k] = datos[k]; reabrir(q.closest('details').id); }
  if (g) { if (!navigator.geolocation) return alert('Este equipo no permite tomar la ubicación.'); const id = g.closest('details').id;
    navigator.geolocation.getCurrentPosition(p => { datos[g.dataset.gps] = p.coords.latitude.toFixed(6) + ', ' + p.coords.longitude.toFixed(6); marcar(g.dataset.gps); srv.datos[g.dataset.gps] = datos[g.dataset.gps]; reabrir(id); }, () => alert('No se pudo tomar la ubicación. Escribila a mano.')); }
});
window.abrirTodo = () => { window.__sinAcordeon = true; document.querySelectorAll('details.sec').forEach(d => d.setAttribute('open', '')); };
window.imprimir = enBlanco => { window.__blanco = !!enBlanco; document.body.classList.toggle('blanco', !!enBlanco); if (enBlanco) pintar(); window.abrirTodo(); setTimeout(() => window.print(), 150); };
window.addEventListener('afterprint', () => { setTimeout(() => { window.__sinAcordeon = false; if (window.__blanco) { window.__blanco = false; document.body.classList.remove('blanco'); pintar(); } }, 500); });
window.addEventListener('beforeunload', () => { if (Object.keys(pend).length) { clearTimeout(tGuardar); enviar(); } });
{ const p0 = pintar; pintar = function () { p0(); pintarDeps(); }; } // la caja de dependencias se vuelve a dibujar cada vez que se repinta la ficha
cargar(S.store.get('ficha.estab', ''));
})();
