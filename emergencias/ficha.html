const FUENTE_PRE = { camas: 'hoja CAMAS de la app (rurales: informe APTW ene–oct 2026; HZT y HMH: Epidemiología HMH 05/11/2026; HSST: dato de Belén 12/11/2026)', camas_obs: 'hoja CAMAS de la app', ref_tit: 'referente designado (COEsp · Participantes)' };
['pob_ciu', 'viv'].forEach(k => FUENTE_PRE[k] = 'INDEC, Censo 2022, Chubut, cuadro 1.5 por gobierno local');
['depto', 'pob_depto', 'dens', 'mayores', 'indices', 'sin_cob'].forEach(k => FUENTE_PRE[k] = 'INDEC, Censo 2022, Chubut, cuadros por departamento (la densidad solo se publica por departamento)');
const vacio = v => v == null || (Array.isArray(v) ? !v.some(f => f && typeof f === 'object' ? Object.entries(f).some(([k2, x]) => k2 !== 'quien' && String(x || '').trim()) : String(f).trim()) : String(v).trim() === '');
const esPre = k => { if (window.__blanco) return false; const p = PRE[estab]; return p && p[k] !== undefined && JSON.stringify(p[k]) === JSON.stringify(datos[k]); };
// 14/11/2026 · Ficha real: se lee y se guarda en el libro (hoja FICHA ESTAB) con las acciones ficha_leer y ficha_guardar.
let estab = '', datos = {}, srv = { datos: {}, puede: false, establecimientos: ESTAB, mios: [], actualizado: '' }, pend = {}, tGuardar = null;
const leer = () => { if (window.__blanco) { datos = {}; return; } datos = JSON.parse(JSON.stringify(Object.assign({}, srv.datos || {}, pend || {}))); if (datos.camas) datos.camas = homogeneizar(datos.camas); const p = PRE[estab] || {}; Object.keys(p).forEach(k => { if (vacio(datos[k])) datos[k] = JSON.parse(JSON.stringify(p[k])); }); };
const COLA = () => 'ficha.' + estab + '.cola'; // termina en «.cola»: se conserva al salir (starh.js)
const estado = (t, mal) => { const el = document.getElementById('estadoG'); if (el) { el.textContent = t; el.className = 'estadoG' + (mal ? ' mal' : ''); } };
// Cada cambio queda pendiente (también en este equipo, por si se corta la conexión) y se envía al rato de dejar de escribir.
const marcar = k => { if (!srv.puede || !k) return; pend[k] = datos[k]; S.store.set(COLA(), pend); estado('Guardando…'); clearTimeout(tGuardar); tGuardar = setTimeout(enviar, 1200); progreso(); };
async function enviar() {
  const c = pend; if (!Object.keys(c).length) return; pend = {};
  try { const r = await S.api('ficha_guardar', { est: estab, cambios: c }); if (!r.ok) throw r;
    Object.assign(srv.datos, c); if (!Object.keys(pend).length) S.store.del(COLA());
    srv.actualizado = new Date().toLocaleString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' · ' + ((S.sesion.usuario() || {}).nombre || '');
    estado('Guardado ✓'); }
  catch (e) { pend = Object.assign(c, pend); S.store.set(COLA(), pend); estado('No se pudo guardar (' + ((e && (e.error || e.message)) || 'sin conexión') + '). Queda pendiente en este equipo y se reintenta.', true); }
  progreso();
}
async function cargar(est) {
  app.innerHTML = '<p class="pie">Cargando la ficha…</p>';
  try { const r = await S.api('ficha_leer', { est: est || '' }); if (!r.ok) throw r;
    srv = r; estab = r.est; pend = S.store.get(COLA(), {}) || {};
    if (Object.keys(pend).length && srv.puede) { Object.assign(srv.datos, pend); setTimeout(enviar, 400); }
    S.store.set('ficha.estab', estab); pintar(); }
  catch (e) { if (e && e.sesion) { location.replace('index.html'); return; } app.innerHTML = `<div class="aviso"><b>No se pudo abrir la ficha.</b> ${E((e && (e.error || e.message)) || 'Revisá la conexión y volvé a entrar.')}</div>`; }
}
window.confirmarPre = () => { const p = PRE[estab] || {}; let n = 0; Object.keys(p).forEach(k => { if (esPre(k)) { marcar(k); n++; } }); estado(n ? 'Guardando ' + n + ' datos precargados…' : 'No hay datos precargados para confirmar.'); };
const fechaAct = () => srv.actualizado ? 'última carga ' + srv.actualizado : 'todavía no se cargó nada';
const lleno = (c) => { const v = datos[c.k]; if (c.t === 'auto') return true; if (c.t === 'rep') return Array.isArray(v) && v.some(f => Object.entries(f || {}).some(([k2, x]) => k2 !== 'quien' && String(x || '').trim())); if (Array.isArray(v)) return v.length > 0; return String(v == null ? '' : v).trim() !== ''; };
const req = s => s.c.filter(c => !c.opt); // los opcionales no cuentan para «Completa»
const secOk = s => req(s).every(lleno);
function campo(c) {
  const v = datos[c.k], id = 'f_' + c.k;
  const lab = `<span>${c.l}${esPre(c.k) ? ` <span class="pre" title="Dato que ya teníamos${FUENTE_PRE[c.k] ? ': ' + E(FUENTE_PRE[c.k]) : ' (libro de la app, hoja LUGARES)'}. Revisalo y cambialo si no es correcto.">Precargado</span>` : ''}</span>`;
  if (c.t === 'auto') return `<div class="campo">${lab}<div class="auto"><span class="ms" style="font-size:16px">sync</span> ${E(c.x)}</div></div>`;
  if (c.t === 'sn') return `<div class="campo">${lab}<div class="sn">${SN.map(o => `<label><input type="radio" name="${id}" data-k="${c.k}" value="${o}"${v === o ? ' checked' : ''}>${o}</label>`).join('')}</div></div>`;
  if (c.t === 'm') return `<div class="campo">${lab}<div class="sn">${c.o.map(o => `<label><input type="checkbox" data-k="${c.k}" data-m="1" value="${E(o)}"${Array.isArray(v) && v.includes(o) ? ' checked' : ''}>${E(o)}</label>`).join('')}</div></div>`;
  if (c.t === 'a') return `<label class="campo">${lab}<textarea data-k="${c.k}" placeholder="${window.__blanco ? '' : 's/d (revisar)'}">${E(v || '')}</textarea></label>`;
  if (c.t === 'coord') return `<label class="campo">${lab}<input data-k="${c.k}" value="${E(v || '')}" placeholder="${window.__blanco ? '' : '-43.2, -65.5 · s/d (revisar)'}"></label><div class="no-imp" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" data-gps="${c.k}"><span class="ms">my_location</span>Usar mi ubicación</button>${v ? `<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${encodeURIComponent(v)}"><span class="ms">map</span>Ver en el mapa</a>` : ''}</div>`;
  if (c.t === 'rep') {
    let L = Array.isArray(v) && v.length ? v : (c.fijo ? c.fijo.map(q => ({ quien: q })) : (window.__blanco ? [{}, {}, {}] : [{}]));
    datos[c.k] = L;
    if (c.tabla) return `<div class="campo">${lab}<small class="ayuda">${E(c.tabla)}</small><div class="tabw"><table class="tab"><thead><tr>${c.cols.map(col => `<th>${E(col.l)}</th>`).join('')}${c.fija ? '' : '<th class="no-imp"></th>'}</tr></thead><tbody>${L.map((f, i) => `<tr>${c.cols.map(col => col.k === 'quien'
      ? (c.fija ? `<td class="nomfijo">${E(f.quien || '')}</td>` : `<td><input class="nom" data-r="${c.k}" data-i="${i}" data-c="quien" value="${E(f.quien || '')}" aria-label="${E(col.l)}"></td>`)
      : `<td><input class="num" data-r="${c.k}" data-i="${i}" data-c="${col.k}" inputmode="numeric" value="${E(f[col.k] || '')}" aria-label="${E(col.l + ' · ' + (f.quien || ''))}"></td>`).join('')}${c.fija ? '' : `<td class="no-imp"><button class="quitar" type="button" data-quitar="${c.k}" data-i="${i}" aria-label="Quitar fila"><span class="ms" style="font-size:18px">close</span></button></td>`}</tr>`).join('')}</tbody></table></div>
      ${c.fija ? '' : `<button class="btn no-imp" type="button" data-agregar="${c.k}"><span class="ms">add</span>${E(c.add)}</button>`}</div>`;
    return `<div class="campo">${lab}<div class="rep" data-rep="${c.k}">${L.map((f, i) => `<div class="fila">${c.cols.map(col => col.o
      ? `<select data-r="${c.k}" data-i="${i}" data-c="${col.k}" aria-label="${E(col.l)}"><option value="">${E(col.l)}</option>${col.o.map(o => `<option${f[col.k] === o ? ' selected' : ''}>${E(o)}</option>`).join('')}</select>`
      : `<input data-r="${c.k}" data-i="${i}" data-c="${col.k}" ${col.t === 'n' ? 'inputmode="numeric"' : ''} placeholder="${E(col.l)}" value="${E(f[col.k] || '')}">`).join('')}<button class="quitar no-imp" type="button" data-quitar="${c.k}" data-i="${i}" aria-label="Quitar"><span class="ms" style="font-size:18px">close</span></button></div>`).join('')}</div>
      <button class="btn no-imp" type="button" data-agregar="${c.k}"><span class="ms">add</span>${E(c.add)}</button></div>`;
  }
  return `<label class="campo">${lab}<input data-k="${c.k}" ${c.t === 'n' ? 'inputmode="numeric"' : ''} ${c.t === 'f' ? 'type="date"' : ''} value="${E(v || '')}" placeholder="${window.__blanco ? '' : 's/d (revisar)'}"></label>`;
}
const secHtml = (s, n) => `<details class="sec${s.min ? ' min' : ''}" id="${s.id}"><summary><span class="n">${n}</span><span class="t">${E(s.t)}<small>${E(s.d)}${s.min ? ' · conviene empezar por esta' : ''}</small></span><span class="chip" data-chip="${s.id}"></span><span class="ms fl">expand_more</span></summary><div class="cuerpo">${s.c.map(campo).join('')}</div></details>`;
function pintar() {
  leer();
  const B = window.__blanco;
  app.innerHTML = B ? `<div class="blanco-cab"><b>Ficha del establecimiento · planilla para completar a mano</b><br>Establecimiento: ____________________________________ &nbsp; Fecha: ____/____/______<br>Completó (apellido y nombre): ____________________________________</div>
  <h2 class="paso">Paso 2 · Datos del establecimiento</h2><p class="pie" style="text-align:left">(El paso 1, «Mis datos», se completa en la app al ingresar.)</p>${SEC.map((s, i) => secHtml(s, i + 1)).join('')}
  <p class="pie">Versión 0. Lo que no se sabe se deja en blanco o se anota «no sabe». Después se pasa a la app (se puede cargar por partes).</p>` : `${srv.puede ? `<div class="aviso" style="background:var(--claro)"><b>Algunos datos ya vienen cargados</b> con la información que tenemos (marcados «Precargado»): revisalos y corregilos si no son correctos. Si están bien, tocá <button class="btn" type="button" onclick="confirmarPre()" style="display:inline-flex;margin:4px 0">Confirmar los precargados</button><br><b>Se completa por partes.</b> No hace falta cargar todo de una vez: cada dato se guarda solo en el libro apenas lo escribís. Podés cerrar y seguir otro día, por la sección que quieras. Lo que no sabés, dejalo vacío.</div>` : `<div class="aviso"><b>Solo lectura.</b> Esta ficha la carga el referente del establecimiento (y Administración).</div>`}
  <div class="cab"><label for="selEst">Establecimiento</label><select id="selEst">${(srv.establecimientos || ESTAB).map(e => `<option value="${E(e)}"${e === estab ? ' selected' : ''}>${E(e)}${(srv.mios || []).indexOf(e) < 0 ? ' (solo lectura)' : ''}</option>`).join('')}</select>
  <div id="estadoG" class="estadoG" aria-live="polite"></div>
  <div class="no-imp" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn" type="button" onclick="imprimir(true)"><span class="ms">print</span>Imprimir planilla en blanco</button><button class="btn" type="button" onclick="imprimir(false)"><span class="ms">print</span>Imprimir lo cargado</button></div>
  <div id="prog"></div></div>
  <h2 class="paso">Paso 1 · Mis datos <small>(se completan al ingresar; para revisarlos, en el inicio tocá tu nombre)</small></h2>
  <h2 class="paso">Paso 2 · Datos del establecimiento <small>(se puede completar por partes)</small></h2>
  <fieldset ${srv.puede ? '' : 'disabled'} style="border:0;padding:0;margin:0;min-width:0">${SEC.map((s, i) => secHtml(s, i + 1)).join('')}</fieldset>
  <p class="pie">Versión 0. Lo que no se sabe queda como «s/d (revisar)». Base orientadora: no es un registro en tiempo real.</p>`;
  progreso();
}
function progreso() {
  const ok = SEC.filter(secOk).length, min = SEC.filter(s => s.min), minOk = min.every(secOk);
  const p = document.getElementById('prog'); if (!p) return;
  p.innerHTML = `<div class="prog"><div class="barrita"><i style="width:${Math.round(ok / SEC.length * 100)}%"></i></div><b>${ok} de ${SEC.length} secciones completas</b><small>· ${fechaAct()}</small>
    <span class="chip ${minOk ? 'ok' : 'falta'}"><span class="ms" style="font-size:16px">${minOk ? 'check_circle' : 'schedule'}</span>${minOk ? 'Ya están las secciones 1, 2, 7 y 8: alcanza para empezar STAR-H y PHR' : 'Sugerido: empezar por las secciones 1, 2, 7 y 8 (marcadas en naranja)'}</span></div>`;
  SEC.forEach(s => { const ch = document.querySelector(`[data-chip="${s.id}"]`); if (!ch) return; const R = req(s), n = R.filter(lleno).length; ch.className = 'chip ' + (n === R.length ? 'ok' : 'falta'); ch.textContent = n === R.length ? 'Completa' : n ? `En curso · ${n} de ${R.length}` : 'Sin empezar'; });
}
app.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'selEst') { if (Object.keys(pend).length) { clearTimeout(tGuardar); enviar(); } cargar(t.value); return; }
  if (t.dataset.r) { const L = datos[t.dataset.r]; L[+t.dataset.i] = Object.assign({}, L[+t.dataset.i], { [t.dataset.c]: t.value }); return marcar(t.dataset.r); }
  if (t.dataset.m) { const k = t.dataset.k; datos[k] = [...app.querySelectorAll(`input[data-m][data-k="${k}"]:checked`)].map(x => x.value); return marcar(k); }
  if (t.dataset.k) { datos[t.dataset.k] = t.value; marcar(t.dataset.k); }
});
app.addEventListener('input', ev => { const t = ev.target; if (t.dataset.k && !t.dataset.m && t.type !== 'radio') { datos[t.dataset.k] = t.value; marcar(t.dataset.k); } else if (t.dataset.r) { const L = datos[t.dataset.r]; L[+t.dataset.i] = Object.assign({}, L[+t.dataset.i], { [t.dataset.c]: t.value }); marcar(t.dataset.r); } });
app.addEventListener('click', ev => {
  const a = ev.target.closest('[data-agregar]'), q = ev.target.closest('[data-quitar]'), g = ev.target.closest('[data-gps]');
  const reabrir = id => { pintar(); const d = document.getElementById(id); if (d) d.open = true; };
  if (a) { const k = a.dataset.agregar; (datos[k] = datos[k] || []).push({}); marcar(k); srv.datos[k] = datos[k]; reabrir(a.closest('details').id); }
  if (q) { const k = q.dataset.quitar; datos[k].splice(+q.dataset.i, 1); marcar(k); srv.datos[k] = datos[k]; reabrir(q.closest('details').id); }
  if (g) { if (!navigator.geolocation) return alert('Este equipo no permite tomar la ubicación.'); const id = g.closest('details').id;
    navigator.geolocation.getCurrentPosition(p => { datos[g.dataset.gps] = p.coords.latitude.toFixed(6) + ', ' + p.coords.longitude.toFixed(6); marcar(g.dataset.gps); srv.datos[g.dataset.gps] = datos[g.dataset.gps]; reabrir(id); }, () => alert('No se pudo tomar la ubicación. Escribila a mano.')); }
});
window.abrirTodo = () => { window.__sinAcordeon = true; document.querySelectorAll('details.sec').forEach(d => d.setAttribute('open', '')); };

window.addEventListener('afterprint', () => { setTimeout(() => { window.__sinAcordeon = false; if (window.__blanco) { window.__blanco = false; document.body.classList.remove('blanco'); pintar(); } }, 500); });

cargar(S.store.get('ficha.estab', ''));
