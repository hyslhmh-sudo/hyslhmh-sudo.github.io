<style>

<header class="barra">
  <a class="icono" href="index.html" aria-label="Inicio"><span class="ms">home</span></a>
  <h1>Cartografía<small>Láminas y mapas del Área Programática Trelew · versión 0</small></h1>
</header>
<main id="app"><p class="pie">Cargando…</p></main>
<dialog id="dlg"></dialog>
<footer><img src="logo-hysl.png" alt="Hospitales más seguros para las personas"></footer>
<script src="config.js"></script>

<script>
(function () {
'use strict';
// 15/11/2026 · Cartografía (Belén: «quiero una carpeta para guardar la cartografía dentro de la app»; tarjeta nueva en el inicio;
// todos los que ingresan ven y abren las láminas; solo Administración sube, reemplaza o da de baja).
// Los PDF están en Drive › 08 · CARTOGRAFÍA (carpeta privada, no se comparte): el servidor entrega el archivo a quien inició sesión.
// La lista se guarda en la hoja CARTOGRAFÍA del libro de la app.
const S = window.STARH, E = S.esc, app = document.getElementById('app');
const MAX_MB = 20;
const ZONAS = ['Trelew', 'Rawson', 'Trelew–Rawson', 'Valle inferior (VIRCH)', 'Valle completo hasta Paso de Indios', 'Gaiman', 'Dolavon', 'Camarones', 'Área Programática Trelew'];
const esAdm = () => { const u = S.sesion.token() ? (S.sesion.usuario() || {}) : {}; return u.rol === 'Administración' && !(S.sesion.enVista && S.sesion.enVista()); };
let LISTA = S.store.get('carto.lista', []), CARPETA = (esAdm() && S.store.get('carto.carpeta', '')) || '', filtro = { q: '', zona: '' }, notaPie = '';
const sinT = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

function ayuda() {
  return `<details class="ayuda"><summary><span class="ms">help</span> Ayuda</summary>
    <p><b>Qué es.</b> Láminas en PDF armadas en QGIS para el COEsp y la preparación ante emergencias: antecedentes de inundación, relieve (curvas de nivel), establecimientos de salud y recursos de apoyo.</p>
    <p><b>Carpetas.</b> «Planos de Hidroeléctrica Ameghino»: planos del Plan de Acción durante la Emergencia de la represa (julio 2019), con un escenario simulado de 70 m³/s de erogación más una crecida como la de 1992, sin rotura de la presa; no muestran lo que se inundó en 1992. «COEsp · Láminas propias»: las láminas de elaboración propia. «Epidemiología HMH · Mapas»: mapas de Epidemiología del HMH con la Municipalidad de Trelew (material de terceros; algunos son imágenes, no PDF). Tocá el nombre de la carpeta para abrirla; al abrir una se cierra la otra. Al buscar o elegir una zona, los resultados se muestran juntos, con el nombre de su carpeta.</p>
    <p><b>Mapa interactivo.</b> Arriba de las carpetas, «Mapa interactivo de capas» abre un mapa de Trelew donde cada uno prende y apaga capas (inundación de 1998, escurrimiento de lluvia, sistema pluvial, centros de salud, policía, centros vecinales, escuelas, calles y caminos). Se puede acercar con dos dedos o la ruedita del mouse y tocar cada elemento para ver sus datos. Las capas son de la Municipalidad de Trelew (Secretaría de Planificación y Desarrollo Urbano, 18/11/2026): material de terceros, orientador.</p>
    <p><b>Cómo se lee el código.</b> CART-COE-001 = cartografía (CART), para el COEsp (COE), número 001. HA-PAE-2019-C1 = Hidroeléctrica Ameghino (HA), Plan de Acción durante la Emergencia (PAE) de 2019, plano C1. EPI-HMH-2026-01 = Epidemiología (EPI) del HMH, año 2026, mapa 01. Cada lámina dice en su rótulo la fecha, el proyecto, quién la elaboró y la escala.</p>
    <p><b>Cómo se usa.</b> Tocá «Abrir» para ver la lámina dentro de la app (se puede ampliar en el teléfono). Las láminas se ven solo dentro de la app: no se descargan (15/11/2026, decisión de HySL). Si necesitás una copia, pedila a Higiene y Seguridad Laboral.</p>
    <p><b>Correcciones.</b> Si ves un error, avisá a Higiene y Seguridad Laboral.</p>
    ${esAdm() ? `<p><b>Administración.</b> Las láminas no se descargan desde la app (tampoco Administración): el PDF está en la carpeta 08 · CARTOGRAFÍA. «Subir lámina» agrega una nueva (PDF hasta ${MAX_MB} MB). Una imagen (JPG o PNG) se carga copiándola a 08 · CARTOGRAFÍA y agregando su fila en la hoja CARTOGRAFÍA; la app la muestra igual que un PDF. En cada lámina: «Corregir datos» (y, si querés, reemplazar el PDF: el anterior queda en la carpeta con la marca «reemplazado») y «Dar de baja» (no se borra: deja de verse para los demás). La lista está en la hoja CARTOGRAFÍA del libro de la app; también se puede corregir ahí. Capas del mapa interactivo: van en la hoja CARTOGRAFÍA con código CAPA-… (no se listan como láminas) y el archivo GeoJSON en 08 · CARTOGRAFÍA › «Capas del mapa interactivo»; para sacar una del mapa, «Dada de baja» en la hoja. «Anexo de fuentes» abre el anexo único con todas las fuentes de datos de la cartografía (solo lo ves y lo abrís vos).</p>` : ''}
  </details>`;
}
// 15/11/2026 (Belén: «el anexo lo puedo ver únicamente yo; ponerlo en Cartografía sin que nadie más pueda ver»).
// Botón solo en la barra de Administración. El documento es privado de Belén en claude.ai: aunque alguien viera el enlace, no lo puede abrir.
const ANEXO_FUENTES = 'https://claude.ai/artifact/X5xud6Ayfj8zztwqsyjcrH';
function barraAdm() {
  if (!esAdm()) return '';
  return `<div class="adm"><b>Carpeta 08 · CARTOGRAFÍA<small>Es privada: solo la abrís vos. Los demás leen las láminas desde la app.</small></b>
    ${CARPETA ? `<a class="btn sec" href="${E(CARPETA)}" target="_blank" rel="noopener"><span class="ms">folder_open</span>Abrir la carpeta</a>` : ''}
    <a class="btn sec" href="${ANEXO_FUENTES}" target="_blank" rel="noopener" title="Anexo de cartografía · fuentes de datos (solo lo abrís vos)"><span class="ms">menu_book</span>Anexo de fuentes</a>
    <button class="btn" type="button" data-nueva><span class="ms">upload_file</span>Subir lámina</button></div>`;
}
function tarjeta(x) {
  const baja = /baja/i.test(x.estado || '');
  const meta = [['place', x.zona], ['folder_special', x.proyecto], ['event', x.fecha], ['description', x.hojas ? x.hojas + (String(x.hojas) === '1' ? ' hoja' : ' hojas') : '']]
    .filter(m => m[1]).map(m => `<span><span class="ms">${m[0]}</span>${E(m[1])}</span>`).join('');
  return `<article class="lam${baja ? ' baja' : ''}">
    <span class="cod"><span class="ms" style="font-size:15px">map</span>${E(x.codigo)}</span>${baja ? '<span class="est-b">Dada de baja</span>' : ''}
    <h2>${E(x.titulo)}</h2>
    <div class="meta">${meta}</div>
    ${x.descripcion ? `<p>${E(x.descripcion)}</p>` : ''}
    <div class="acc">
      ${x.archivoId ? `<button class="btn" type="button" data-abrir="${E(x.archivoId)}" data-tit="${E(x.codigo + ' · ' + x.titulo)}"><span class="ms">visibility</span>Abrir</button>
      ` : '<span class="pie">Archivo: s/d (revisar)</span>'}
      ${esAdm() ? `<button class="btn sec" type="button" data-corregir="${E(x.codigo)}"><span class="ms">edit</span>Corregir datos</button>
      <button class="btn peligro" type="button" data-estado="${E(x.codigo)}" data-a="${baja ? 'Vigente' : 'Dada de baja'}"><span class="ms">${baja ? 'restore' : 'archive'}</span>${baja ? 'Volver a dar de alta' : 'Dar de baja'}</button>` : ''}
    </div>
    ${esAdm() && (x.actualizado || x.cargo) ? `<p class="pie" style="margin:8px 0 0">Actualizado ${E(x.actualizado || 's/d')}${x.cargo ? ' · ' + E(x.cargo) : ''}</p>` : ''}
  </article>`;
}
// 19/11/2026: las filas CAPA-… de la hoja CARTOGRAFÍA son capas del mapa interactivo, no láminas: no se listan.
const esCapa = x => /^CAPA-/i.test(String(x.codigo || ''));
function pintar() {
  const TODO = LISTA, CAPAS = TODO.filter(x => esCapa(x) && !/baja/i.test(x.estado || '') && x.archivoId);
  { const LISTA = TODO.filter(x => !esCapa(x));
  const zonas = LISTA.map(x => x.zona).filter((z, i, a) => z && a.indexOf(z) === i).sort();
  const q = sinT(filtro.q);
  const L = LISTA.filter(x => (!filtro.zona || x.zona === filtro.zona) && (!q || sinT([x.codigo, x.titulo, x.zona, x.proyecto, x.descripcion].join(' ')).indexOf(q) >= 0));
  app.innerHTML = ayuda() + barraAdm() + (CAPAS.length ? tarjetaMapa(CAPAS) : '')
    + (LISTA.length > 1 ? `<div class="filtros"><input type="search" id="fQ" placeholder="Buscar por código, título o tema" value="${E(filtro.q)}" aria-label="Buscar"><select id="fZ" aria-label="Zona"><option value="">Todas las zonas</option>${zonas.map(z => `<option${z === filtro.zona ? ' selected' : ''}>${E(z)}</option>`).join('')}</select></div>` : '')
    + (L.length ? carpetas(L) : `<div class="vacio">${LISTA.length ? 'Ninguna lámina coincide con la búsqueda.' : 'Todavía no hay láminas cargadas.'}</div>`)
    + `<p class="pie">${E(notaPie)}</p>`;
  const fq = document.getElementById('fQ'), fz = document.getElementById('fZ');
  if (fq) fq.addEventListener('input', () => { filtro.q = fq.value; const p = fq.selectionStart; pintar(); const n = document.getElementById('fQ'); n.focus(); n.setSelectionRange(p, p); });
  if (fz) fz.addEventListener('change', () => { filtro.zona = fz.value; pintar(); });
  }

  if (st.vias) { const e = VIAS.find(v => v[0] === p.TIPO) || VIAS[3]; return { color: e[1], weight: e[2], opacity: .9 }; }
  return { color: st.c, weight: st.w || 1.5, opacity: .85 };
}
async function prender(cod, si) {
  const capa = LISTA.find(x => x.codigo === cod), st = estDe(capa), Lf = window.L, o = CAPAOBJ[cod] || (CAPAOBJ[cod] = {}), lab = document.querySelector(`[data-est="${cod}"]`);
  if (!si) { if (o.capa) MAPA.removeLayer(o.capa); return; }
  if (o.capa) { o.capa.addTo(MAPA); return; }
  if (lab) lab.textContent = 'Cargando…';
  try {
    const r = await traer(capa.archivoId), gj = JSON.parse(new TextDecoder('utf-8').decode(b64aBytes(r.datos)));
    // 19/11/2026 06:43 (Belén: un clic sobre el HMH abría «Comisaría 2°»). Cada geometría va a su capa:
    // áreas y líneas en un solo lienzo abajo; puntos en SVG arriba (solo atrapan el clic sobre el punto);
    // áreas grandes (jurisdicciones policiales, límites de sistema pluvial) no se tocan: muestran su nombre como rótulo.
    const fs = gj.features, grande = f => /Polygon/.test(f.geometry.type) && /(03|05)$/.test(cod) && !/^CAPA-EPI/i.test(cod);
    const est = f => /Polygon/.test(f.geometry.type)
        ? { color: st.c, weight: grande(f) ? 2 : 1, dashArray: grande(f) ? '6 5' : null, fillColor: st.c, fillOpacity: grande(f) ? 0 : (st.op || .3) }
        : estiloLinea(st, f.properties || {});
    const pop = (f, l) => l.bindPopup(() => popupDe(f.properties || {}, capa), { maxWidth: 300 });
    const fc = l => ({ type: 'FeatureCollection', features: l });
    const g = Lf.layerGroup();
    const grandes = fs.filter(grande), vect = fs.filter(f => !/Point/.test(f.geometry.type) && !grande(f)), pts = fs.filter(f => /Point/.test(f.geometry.type));
    if (grandes.length) Lf.geoJSON(fc(grandes), { pane: 'lineas', renderer: REN.areas, interactive: false, style: est,
      onEachFeature: (f, l) => { const p = f.properties || {}, t = p.JURIDICCION || p.SISTEMA; if (t) l.bindTooltip(String(t) + (p.SISTEMA ? ' (sistema pluvial)' : ''), { permanent: true, direction: 'center', className: 'mlab' }); } }).addTo(g);
    if (vect.length) Lf.geoJSON(fc(vect), { pane: 'lineas', renderer: REN.lineas, style: est, onEachFeature: pop }).addTo(g);
    if (pts.length) Lf.geoJSON(fc(pts), { pointToLayer: (f, ll) => Lf.circleMarker(ll, { pane: 'puntos', renderer: REN.puntos, radius: /03$/.test(cod) ? 2.5 : (st.r || 5), color: '#fff', weight: /03$/.test(cod) ? 0 : 1.5, fillColor: st.c, fillOpacity: .95 }), onEachFeature: pop }).addTo(g);
    o.capa = g;
    const el = document.querySelector(`input[data-capa="${cod}"]`);
    if (el && el.checked) o.capa.addTo(MAPA);
    if (lab) lab.textContent = gj.features.length + ' elementos';
  } catch (e) { if (lab) lab.textContent = 'No se pudo cargar: ' + ((e && e.message) || 'error'); }
}
function panelCapas(C) {
  return GRUPOS.map(g => {
    const l = C.filter(x => estDe(x).g === g); if (!l.length) return '';
    return `<h3>${E(g)}</h3>` + l.map(x => { const st = estDe(x);
      const sub = st.nivel ? '<div class="sub">' + ESC.map(e => `<div><span class="sw ln" style="background:${e[1]};height:${Math.max(2, e[2])}px"></span>${E(e[0])}</div>`).join('') + '<div style="color:#6B7A90">1 = aporte de ladera · 5 = colector principal</div></div>'
        : st.vias ? '<div class="sub">' + VIAS.map(e => `<div><span class="sw ln" style="background:${e[1]}"></span>${E(e[0])}</div>`).join('') + '</div>' : '';
      return `<label class="mcapa"><input type="checkbox" data-capa="${E(x.codigo)}"${st.on ? ' checked' : ''}><span class="sw ${st.t === 'punto' ? 'pt' : st.t === 'linea' ? 'ln' : ''}" style="background:${st.c}${st.t === 'area' ? ';opacity:.7' : ''}"></span><span class="nm">${E(x.titulo)}<small data-est="${E(x.codigo)}">${E(st.nota || '')}</small></span></label>${sub}`; }).join('');
  }).join('') + `<p class="mnota"><b>Fuente de las capas:</b> Municipalidad de Trelew, Secretaría de Planificación y Desarrollo Urbano, Programa Ordenamiento Territorial (18/11/2026). Material de terceros, orientador: no reemplaza el relevamiento en terreno.<br><b>Epidemiología:</b> personas electrodependientes y en diálisis, sin nombre, DNI, domicilio ni teléfono; ubicación aproximada tomada del mapa de Epidemiología HMH y la Dirección de Organización Territorial (nov. 2026, pendiente revisión de domicilios). Solo aparecen las personas que figuran en ese mapa.<br><b>Mapa base:</b> © colaboradores de OpenStreetMap.<br>Tocá un punto, una línea o un área para ver sus datos.</p>`;
}
async function abrirMapa() {
  const v = mvis(), C = LISTA.filter(x => esCapa(x) && !/baja/i.test(x.estado || '') && x.archivoId);
  v.classList.add('abierto'); document.body.style.overflow = 'hidden';
  if (window.innerWidth < 700) document.getElementById('mpanel').classList.add('oculto');
  if (MAPA) { MAPA.invalidateSize(); return; }
  document.getElementById('mpanel').innerHTML = '<p class="pie">Cargando el mapa…</p>';
  let Lf; try { Lf = await cargarLeaflet(); } catch (e) { document.getElementById('mpanel').innerHTML = `<p class="vmsg mal">${E(e.message)}</p>`; return; }
  MAPA = Lf.map('mapaLeaf', { zoomControl: true }).setView([-43.252, -65.31], 13);
  [['areas', 410], ['lineas', 420], ['puntos', 440]].forEach(([n, z]) => { MAPA.createPane(n).style.zIndex = z; });
  // Lienzo (rápido) para áreas y líneas; SVG para los puntos, así un clic fuera de un punto llega a la capa de abajo.
  { const lien = Lf.canvas({ pane: 'lineas', tolerance: 4 }); REN = { areas: lien, lineas: lien, puntos: Lf.svg({ pane: 'puntos' }) }; } // un solo lienzo: el clic encuentra el área o la línea de abajo
  Lf.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(MAPA);
  Lf.control.scale({ imperial: false }).addTo(MAPA);
  document.getElementById('mpanel').innerHTML = panelCapas(C);
  setTimeout(() => MAPA.invalidateSize(), 100);
  C.filter(x => estDe(x).on).forEach(x => prender(x.codigo, true));
}

document.addEventListener('click', ev => {
  const t = ev.target;
  let b;
  if (t.closest('[data-mapa]')) abrirMapa();
  else if ((b = t.closest('[data-abrir]'))) abrir(b);
  else if ((b = t.closest('[data-bajar]'))) descargar(b.dataset.bajar, b);
  else if (t.closest('[data-nueva]')) dlgLamina(null);
  else if ((b = t.closest('[data-corregir]'))) dlgLamina(LISTA.find(x => x.codigo === b.dataset.corregir));
  else if ((b = t.closest('[data-estado]'))) cambiarEstado(b);
  else if ((b = t.closest('#bGuardarLam'))) guardarLam(b);
  else if (t.closest('[data-c]')) document.getElementById('dlg').close();
});
document.body.classList.add('sin-imprimir'); // 15/11/2026 · tampoco se imprime desde el navegador
notaPie = LISTA.length ? 'Últimos datos guardados en este equipo.' : '';
pintar();
actualizar();
})();
</script>
