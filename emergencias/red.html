<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COE · Reuniones, acuerdos y documentos · Emergencias y desastres</title>
<meta name="theme-color" content="#172B4D">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0..1,0&display=block" rel="stylesheet">
<style>
:root{--fuerte:#172B4D;--medio:#2F5BEA;--claro:#E4EAFB;--borde:#C5D1F2;--texto:#172B4D;--suave:#4B5B73;--tenue:#6B7A90;--linea:#E4EAFB;--fondo:#F5F7FB;--alerta:#F57C00}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--texto);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;line-height:1.5}
.ms{font-family:'Material Symbols Outlined';font-size:20px;line-height:1;display:inline-block;vertical-align:middle;font-feature-settings:'liga'}
.barra{position:sticky;top:0;z-index:5;background:var(--fuerte);color:#F5F7FB;border-bottom:3px solid var(--medio);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
.barra h1{font-size:16px;margin:0;flex:1}.barra h1 small{display:block;font-size:11.5px;font-weight:500;opacity:.85}
[hidden]{display:none!important}
.icono{color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;font-weight:600;font-size:13px;background:none;border:0;cursor:pointer;font-family:inherit}
.icono:hover{background:rgba(255,255,255,.14)}
.pest{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 0;max-width:1000px;margin:0 auto}
.pest button{flex:none;border:1.5px solid var(--borde);background:#fff;color:var(--fuerte);border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.pest button[aria-selected=true]{background:var(--fuerte);color:#fff;border-color:var(--fuerte)}
.pest .n{font-size:11px;background:var(--claro);color:var(--fuerte);border-radius:999px;padding:0 7px}
main{max-width:1000px;margin:0 auto;padding:12px 16px 40px}
.aviso{background:#fff;border:1px solid var(--linea);border-left:5px solid var(--medio);border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:13.5px;color:var(--suave)}
.aviso.alerta{border-left-color:var(--alerta)}
.herr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.herr select,.herr input{border:1px solid var(--borde);border-radius:10px;padding:8px 10px;font:inherit;font-size:13.5px;background:#fff;min-height:40px}
.herr .esp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid transparent;border-radius:10px;padding:8px 13px;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:none;min-height:40px;background:var(--medio);color:#fff}
.btn.sec{background:#fff;color:var(--fuerte);border-color:var(--medio)}
.btn.chico{min-height:32px;padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:default}
.tarj{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:12px 16px;margin-bottom:10px}
.tarj h3{margin:0 0 4px;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meta{font-size:12.5px;color:var(--suave)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--claro);color:var(--fuerte)}
.chip.int{background:#EEEAFD;color:#3B2A7A}.chip.val{background:#FFF1E0;color:#7A3E00}.chip.ok{background:#E3F4EA;color:#14532D}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--linea);vertical-align:top}
th{font-size:12px;color:var(--suave);font-weight:700;background:#F9FAFE;position:sticky;top:0}
.tabla{border:1px solid var(--linea);border-radius:12px;overflow:auto;max-height:70vh}
a{color:var(--fuerte);text-decoration-color:var(--medio)}
details{margin-top:8px}details summary{cursor:pointer;font-weight:700;font-size:13.5px}
ul.lst{margin:6px 0 0;padding-left:18px}ul.lst li{margin:3px 0;font-size:13.5px}
.vacio{color:var(--tenue);font-size:13.5px;padding:8px 0}
dialog{border:0;border-radius:16px;padding:0;max-width:720px;width:calc(100% - 24px);box-shadow:0 20px 60px rgba(23,43,77,.3)}dialog::backdrop{background:rgba(23,43,77,.45)}
.dlg-cab{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--linea)}.dlg-cab b{flex:1}
.dlg-c{padding:6px 16px 4px;max-height:70vh;overflow:auto}.dlg-p{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--linea)}
.campo{display:block;margin:9px 0}.campo span{display:block;font-size:12.5px;font-weight:600;color:var(--suave);margin-bottom:4px}
.campo input,.campo textarea,.campo select{width:100%;border:1px solid var(--borde);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px}.campo textarea{min-height:60px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:560px){.dos{grid-template-columns:1fr}}
.cerrar{background:none;border:0;cursor:pointer;color:var(--fuerte)}
.asis{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:4px 12px;margin:6px 0}
.asis label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:4px 0}
.acu-fila{border:1px solid var(--linea);border-radius:10px;padding:8px 10px;margin:6px 0;display:grid;grid-template-columns:110px 1fr;gap:6px}
.acu-fila textarea{grid-column:1/-1}
.acu-fila input,.acu-fila select,.acu-fila textarea{border:1px solid var(--borde);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;width:100%}
.est{font-size:13px;color:var(--suave);min-height:18px}
footer{text-align:center;padding:10px 16px 28px}footer img{width:66.67%;max-width:740px;max-height:56px;object-fit:contain;height:auto}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--fuerte);color:#F5F7FB;border-left:5px solid var(--medio);padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:20}
@media print{.barra,.pest,.herr,.btn,footer{display:none}}
tr.grupo-sec td{background:#E4EAFB;color:#172B4D;position:static!important}
</style>

  <a class="icono" href="index.html" aria-label="Inicio"><span class="ms">home</span></a>

  <button class="icono" id="bComentar" hidden title="Comentar STAR-H o PHR"><span class="ms">rate_review</span><span>Comentar</span></button>
  <button class="icono" id="bAyuda" aria-label="Ayuda"><span class="ms">help</span></button>

</header>
<nav class="pest" id="pest" role="tablist"></nav>

<script src="starh.js"></script>
<script>
(function () {
'use strict';
/* 06/11/2026 · Rediseño (v0). Lee la acción red_catalogo del Apps Script (Red.gs): órganos e integrantes, reuniones con
 * asistencia y acuerdos, índice de documentos, lugares y enlaces. Cada usuario recibe solo lo que puede ver:
 * la parte interna del COE ve lo del COE interno; los externos, solo lo del COE completo; lo de HySL, solo Administración.
 * Cargar reuniones, documentos, lugares y enlaces: por ahora solo Administración. */
const S = window.STARH, E = S.esc, $ = s => document.querySelector(s), app = $('#app');
const PEST = [
  ['reu', 'Reuniones', 'event_note'], ['acu', 'Acuerdos y tareas', 'task_alt'], ['doc', 'Documentos', 'description'],
  ['org', 'Órganos e integrantes', 'groups'], ['lug', 'Establecimientos', 'local_hospital'], ['enl', 'Enlaces', 'link'],
  ['pac', 'Necesidades especiales', 'accessible'], // lista cerrada: solo cantidades
  ['acc', 'Accesos', 'key'] // solo Administración
];
let D = S.store.get('red.cat', null), pest = (location.hash || '#reu').slice(1), filtro = {};
// 12/11/2026 · «Programar reunión» desde la agenda de la pantalla de inicio: red.html#programar abre el diálogo (Administración).
let PROG = pest === 'programar'; if (PROG) pest = 'reu';
const adm = () => !!(D && D.admin);
const nomOrg = id => { const o = (D && D.organos || []).filter(x => x.ID === id)[0]; return o ? o.Nombre : id; };
const fechaN = s => { const m = String(s || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? Number(m[3] + m[2].padStart(2, '0') + m[1].padStart(2, '0')) : 0; };
const toast = t => { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3500); };
const errTxt = e => { const m = (e && (e.error || e.message)) || 'No se pudo completar.'; return /desconocida|No disponible/i.test(m) ? 'Falta publicar la versión nueva del Apps Script (Implementar › Administrar implementaciones › Editar › Nueva versión).' : m; };
const parteChip = p => /^otra/i.test(p) ? '<span class="chip">Otra reunión</span>' : /intern/i.test(p) ? '<span class="chip int">COE interno</span>' : /extern/i.test(p) ? '<span class="chip">Externa</span>' : '<span class="chip">COE completo</span>';

async function cargar(nota) {
  if (S.DEMO) { app.innerHTML = '<div class="aviso alerta">Esta sección necesita conexión con el servidor (no funciona en modo demostración).</div>'; return; }
  if (!navigator.onLine) { pintar(D ? 'Sin conexión: últimos datos guardados.' : ''); return; }
  try { const r = await S.api('red_catalogo', {}, 60000); if (!r.ok) throw r; D = r; S.store.set('red.cat', r); pintar(nota || ''); if (PROG) { PROG = false; history.replaceState(null, '', '#reu'); if (adm()) dlgReunion('', true); } }
  catch (e) { if (e && e.sesion) { location.replace('index.html'); return; } app.innerHTML = `<div class="aviso alerta">${E(errTxt(e))}</div>` + (D ? '' : ''); if (D) pintar('No se pudo actualizar: se muestran los últimos datos guardados.'); }
}

function pintarPest() {
  const n = { pac: PAC && PAC.total != null ? PAC.total : '', acc: ((D.accesos || {}).permisos || []).length, reu: (D.reuniones || []).length, acu: (D.acuerdos || []).length, doc: (D.documentos || []).length, org: (D.organos || []).length, lug: (D.lugares || []).length, enl: (D.enlaces || []).length };
  const vePac = () => adm() || !!((D.niveles || {})['Pacientes con necesidades especiales']);
  $('#pest').innerHTML = PEST.filter(p => (p[0] !== 'acc' || adm()) && (p[0] !== 'pac' || vePac())).map(p => `<button role="tab" data-p="${p[0]}" aria-selected="${p[0] === pest}"><span class="ms" style="font-size:17px">${p[2]}</span>${p[1]}<span class="n">${n[p[0]]}</span></button>`).join('');
  $('#bComentar').hidden = !D.puedeComentar;
}
function pintar(nota) {
  if (!D) return;
  pintarPest();
  const aviso = nota ? `<div class="aviso">${E(nota)}</div>` : '';
  if ((pest === 'acc' && !adm()) || (pest === 'pac' && !adm() && !(D.niveles || {})['Pacientes con necesidades especiales'])) pest = 'reu';
  if (pest === 'pac' && !PAC && !PAC_CARGANDO) cargarPac();
  const f = { reu: vReuniones, acu: vAcuerdos, doc: vDocumentos, org: vOrganos, lug: vLugares, enl: vEnlaces, acc: vAccesos, pac: vPacientes }[pest] || vReuniones;
  app.innerHTML = aviso + f();
}

/* ---------- Reuniones ---------- */
function vReuniones() {
  const L = (D.reuniones || []).slice().sort((a, b) => fechaN(b.Fecha) - fechaN(a.Fecha));
  const herr = `<div class="herr"><span class="esp meta">Asistencia y acuerdos se cargan en el momento de la reunión. La planilla impresa se firma y el escaneo se vincula a la reunión.</span>${adm() ? '<button class="btn" data-a="reuProgramar"><span class="ms">event_upcoming</span>Programar reunión</button><button class="btn sec" data-a="reuNueva"><span class="ms">add</span>Cargar reunión realizada</button>' : ''}</div>`;
  if (!L.length) return herr + '<p class="vacio">No hay reuniones que puedas ver.</p>';
  return herr + L.map(r => {
    const as = (D.asistencia || []).filter(a => a['Reunión'] === r.ID), ac = (D.acuerdos || []).filter(a => a['Reunión'] === r.ID);
    return `<div class="tarj"><h3>${E(r.Fecha)} · ${E(nomOrg(r['Órgano']))} ${parteChip(r.Parte)}<span class="chip">${E(r['N.º'] ? 'N.º ' + r['N.º'] : r.ID)}</span>${r.Estado === 'Convocada' ? '<span class="chip int">Programada</span>' : r.Estado === 'Suspendida' ? '<span class="chip val">Suspendida</span>' : ''}</h3>
      ${adm() && r.Estado === 'Convocada' ? `<div class="meta">Mail: ${E(/^no$/i.test(r['Avisar por mail'] || '') ? 'sin aviso' : [r['Convocatoria enviada'] ? 'convocatoria: ' + r['Convocatoria enviada'] : 'convocatoria pendiente', r['Recordatorio enviado'] ? 'recordatorio: ' + r['Recordatorio enviado'] : 'recordatorio 24 h antes: pendiente'].join(' · '))}</div>` : ''}
      <div class="meta">${E([r.Tipo, r.Horario, r['Lugar o modalidad'], r['Convocó · coordinó'] ? 'Coordinó: ' + r['Convocó · coordinó'] : '', r['Redactó'] ? 'Redactó: ' + r['Redactó'] : ''].filter(x => x && !/^s\/d/.test(x)).join(' · '))}</div>
      ${r['Orden del día'] ? `<p style="margin:6px 0;font-size:14px">${E(r['Orden del día'])}</p>` : ''}
      ${r['Temas tratados'] ? `<details><summary>Temas tratados</summary><p style="white-space:pre-line;font-size:13.5px;margin:6px 0">${E(r['Temas tratados'])}</p></details>` : ''}
      ${r['Próxima reunión'] ? `<p class="meta" style="margin:4px 0">Próxima reunión: ${E(r['Próxima reunión'])}</p>` : ''}
      <div class="herr" style="margin:6px 0 0">
        ${r['Acta (Doc)'] ? `<a class="btn sec chico" href="${E(r['Acta (Doc)'])}" target="_blank" rel="noopener"><span class="ms">article</span>Acta</a>` : '<span class="chip val">Acta: s/d</span>'}
        ${r['Asistencia firmada (escaneo)'] ? `<a class="btn sec chico" href="${E(r['Asistencia firmada (escaneo)'])}" target="_blank" rel="noopener"><span class="ms">draw</span>Asistencia firmada</a>` : '<span class="chip val">Asistencia firmada: pendiente</span>'}
        <button class="btn sec chico" data-a="imprimir" data-id="${E(r.ID)}"><span class="ms">print</span>Planilla de asistencia</button>
        ${adm() ? `<button class="btn sec chico" data-a="reuEditar" data-id="${E(r.ID)}"><span class="ms">edit</span>Editar</button><button class="btn sec chico" data-a="acta" data-id="${E(r.ID)}"><span class="ms">description</span>${r['Acta (Doc)'] ? 'Volver a generar el acta' : 'Generar el acta (Doc)'}</button>` : ''}
      </div>
      <details><summary>${r.Estado === 'Convocada' ? 'Convocados' : 'Asistentes'} (${as.length})</summary><ul class="lst">${as.map(a => `<li>${E(a.Persona)}${a['Institución / función'] ? ' · ' + E(a['Institución / función']) : ''}${a.Presente === 'No' ? ' <span class="chip val">ausente</span>' : ''}</li>`).join('') || '<li class="vacio">Sin datos.</li>'}</ul></details>
      <details><summary>Acuerdos y tareas (${ac.length})</summary><ul class="lst">${ac.map(a => `<li><b>${E(a.ID)}</b> · ${E(a.Tipo)} · ${E(a.Texto)}${a.Responsable ? ` <span class="meta">· Responsable: ${E(a.Responsable)}</span>` : ''}${a.Plazo ? ` <span class="meta">· Plazo: ${E(a.Plazo)}</span>` : ''} <span class="chip ${/curso|pend/i.test(a.Estado) ? 'val' : 'ok'}">${E(a.Estado)}</span></li>`).join('') || '<li class="vacio">Sin acuerdos.</li>'}</ul></details>
    </div>`;
  }).join('');
}

/* ---------- Acuerdos ---------- */
function vAcuerdos() {
  const est = filtro.acuEst || '', q = (filtro.acuQ || '').toLowerCase();
  const estados = [...new Set((D.acuerdos || []).map(a => a.Estado).filter(Boolean))];
  const reu = id => (D.reuniones || []).filter(r => r.ID === id)[0] || {};
  const L = (D.acuerdos || []).filter(a => (!est || a.Estado === est) && (!q || (a.Texto + ' ' + a.Responsable).toLowerCase().indexOf(q) >= 0));
  return `<div class="herr"><select data-f="acuEst"><option value="">Todos los estados</option>${estados.map(e => `<option ${e === est ? 'selected' : ''}>${E(e)}</option>`).join('')}</select>
    <input data-f="acuQ" placeholder="Buscar texto o responsable" value="${E(filtro.acuQ || '')}"><span class="esp"></span><span class="meta">${L.length} de ${(D.acuerdos || []).length}</span></div>
    <div class="tabla"><table><thead><tr><th>ID</th><th>Reunión</th><th>Tipo</th><th>Texto</th><th>Responsable</th><th>Plazo</th><th>Estado</th></tr></thead><tbody>
    ${L.map(a => { const r = reu(a['Reunión']); return `<tr><td>${E(a.ID)}</td><td>${E(r.Fecha || a['Reunión'])}<br><span class="meta">${/intern/i.test(r.Parte) ? 'COE interno' : 'COE completo'}</span></td><td>${E(a.Tipo)}</td><td>${E(a.Texto)}</td><td>${E(a.Responsable)}</td><td>${E(a.Plazo)}</td><td><span class="chip ${/curso|pend/i.test(a.Estado) ? 'val' : 'ok'}">${E(a.Estado)}</span></td></tr>`; }).join('') || '<tr><td colspan="7" class="vacio">Sin resultados.</td></tr>'}
    </tbody></table></div>`;
}

/* ---------- Documentos ---------- */
// 13/11/2026 · Secciones del COE (decisión de Belén): internos A a M y anexos (Z). Se guardan en DOCUMENTOS › «Sección».
const SECCIONES = ['A · Administrativos', 'B · Derivación y traslados', 'C · Instituciones receptoras', 'D · Albergues', 'E · Medios de traslado',
  'F · Contactos y responsables', 'G · Pacientes con requerimientos especiales', 'H · Alerta, activación y comunicación', 'I · Población a cargo',
  'J · Servicios esenciales y continuidad', 'K · Seguridad del personal', 'L · Capacitación y simulacros', 'M · Después del evento', 'Z · Anexos'];
function vDocumentos() {
  const L0 = D.documentos || [];
  const op = k => [...new Set(L0.map(d => d[k]).filter(Boolean))];
  const fc = filtro.docClase || '', fe = filtro.docEmisor || '', fs = filtro.docEstado || '', fsec = filtro.docSec || '', q = (filtro.docQ || '').toLowerCase();
  const L = L0.filter(d => (!fc || d.Clase === fc) && (!fe || d.Emisor === fe) && (!fsec || (d['Sección'] || 'Sin sección') === fsec) && (!fs || (fs === '__val' ? /validar/i.test(d.Estado) : d.Estado === fs)) && (!q || d['Título'].toLowerCase().indexOf(q) >= 0));
  const nVal = L0.filter(d => /validar/i.test(d.Estado)).length;
  const sel = (k, t, arr) => `<select data-f="${k}"><option value="">${t}</option>${arr.map(x => `<option ${x === filtro[k] ? 'selected' : ''}>${E(x)}</option>`).join('')}</select>`;
  const secs = SECCIONES.concat(L.some(d => !d['Sección']) ? ['Sin sección'] : []);
  const fila = d => `<tr><td>${d.Enlace ? `<a href="${E(d.Enlace)}" target="_blank" rel="noopener">${E(d['Título'])}</a>` : E(d['Título'])}<br><span class="meta">${E(d.ID)} · v${E(d['Versión'] || '0')} · ${E(d.Fecha)}</span></td>
      <td>${E(d.Clase)}</td><td>${E(d.Emisor)}<br><span class="meta">${E(d.Alcance)}${d.Establecimiento && d.Establecimiento !== '—' ? ' · ' + E(d.Establecimiento) : ''}</span></td>
      <td><span class="chip ${/validar|borrador/i.test(d.Estado) ? 'val' : 'ok'}">${E(d.Estado)}</span></td><td class="meta">${E(d['Visible para'])}</td>
      ${adm() ? `<td><button class="btn sec chico" data-a="docEditar" data-id="${E(d.ID)}"><span class="ms">edit</span></button></td>` : ''}</tr>`;
  const nc = adm() ? 6 : 5;
  const cuerpo = secs.map(s => {
    const g = L.filter(d => (d['Sección'] || 'Sin sección') === s);
    if (!g.length && (fsec || !adm())) return '';
    const tit = s === 'Z · Anexos' ? 'Anexos' : (s === 'Sin sección' ? 'Sin sección asignada' : 'Internos · ' + s);
    return `<tr class="grupo-sec"><td colspan="${nc}"><b>${E(tit)}</b> <span class="meta">(${g.length})</span></td></tr>` + (g.length ? g.map(fila).join('') : `<tr><td colspan="${nc}" class="vacio">Todavía sin documentos.</td></tr>`);
  }).join('');

    .concat(f.extras.value.split('\n').map(x => x.trim()).filter(Boolean).map(x => { const p = x.split(/\s+·\s+|\s+-\s+/); return { persona: '', nombre: p[0], funcion: p.slice(1).join(' · '), presente: conv ? 'convocado' : true }; }));

let PAC = null, PAC_CARGANDO = false, PAC_ERR = '';
async function cargarPac() {
  PAC_CARGANDO = true; PAC_ERR = '';
  try { const r = await S.api('red_pacientes', {}, 120000); if (!r.ok) throw r; PAC = r; } catch (e) { PAC_ERR = errTxt(e); }
  PAC_CARGANDO = false; if (pest === 'pac') pintar();
}
function vPacientes() {
  const aviso = `<div class="aviso">Solo cantidades: la app no recibe nombres, documentos, domicilios ni teléfonos. ${PAC && !PAC.admin ? 'Las cantidades de 1 a 4 se muestran «<5» para que no se pueda reconocer a nadie. ' : ''}La base completa para contactar está en el libro de cada ciudad (confidencial, compartido solo con la lista cerrada). La ubicación la georreferencia Epidemiología.</div>`;
  if (PAC_ERR) return aviso + `<div class="aviso alerta">${E(PAC_ERR)}</div>`;
  if (!PAC) return aviso + '<p class="vacio">Contando…</p>';
  const tabla = (tit, o) => { const k = Object.keys(o); return `<div class="tarj"><h3>${tit}</h3>${k.length ? `<table><tbody>${k.map(x => `<tr><td>${E(x)}</td><td style="width:90px;text-align:right"><b>${E(o[x])}</b></td></tr>`).join('')}</tbody></table>` : '<p class="vacio">Sin pacientes cargados.</p>'}</div>`; };
  return aviso + `<div class="herr"><span class="meta">Área Programática Trelew · activos: <b>${E(PAC.total)}</b></span><span class="esp"></span><button class="btn sec chico" data-a="pacAct"><span class="ms">refresh</span>Contar de nuevo</button></div>
    <div class="tarj"><h3>${PAC.porCiudad ? 'Por ciudad' : 'Por establecimiento'}</h3><table><tbody>${PAC.establecimientos.map(e => `<tr><td><b>${E(e.corto)}</b> · <span class="meta">${E(e.nombre)}</span>${e.error ? ' <span class="chip val">' + E(e.error) + '</span>' : ''}</td><td style="width:90px;text-align:right"><b>${E(e.total)}</b></td>${PAC.admin ? `<td style="width:90px">${e.libro ? `<a href="${E(e.libro)}" target="_blank" rel="noopener">libro</a>` : ''}</td>` : ''}</tr>`).join('')}</tbody></table>
    ${PAC.sinLibro && PAC.sinLibro.length ? `<p class="meta">Sin libro: ${E(PAC.sinLibro.join(', '))}</p>` : ''}</div>
    ${tabla('Por tipo de patología', PAC.patologia)}${tabla('Por tipo de necesidad', PAC.necesidad)}
    <div class="tarj"><h3>Por localidad y barrio o zona</h3>${PAC.zonas.length ? `<div class="tabla"><table><thead><tr><th>Localidad · barrio o zona</th><th>Total</th><th>Por tipo de patología</th></tr></thead><tbody>${PAC.zonas.map(z => `<tr><td>${E(z.zona)}</td><td><b>${E(z.total)}</b></td><td class="meta">${Object.keys(z.patologia).map(p => E(p) + ': ' + E(z.patologia[p])).join(' · ')}</td></tr>`).join('')}</tbody></table></div>` : '<p class="vacio">Sin pacientes cargados.</p>'}</div>`;
}

/* ---------- Accesos (Administración): persona × herramienta, órganos y cuenta ---------- */
const NIV_OP = ['', 'Ver', 'Comentar', 'Cargar', 'Aprobar'];
const MOD_CORTO = { 'STAR-H': 'STAR-H', PHR: 'PHR', ISH: 'ISH', 'Derivaciones y albergues': 'Derivaciones', 'Pacientes con necesidades especiales': 'Pacientes' };
function esExterna(pid) {
  const p = (D.personas || []).filter(x => x.id === pid)[0];
  return !!(p && /^extern/i.test(p.tipo)) || (D.integrantes || []).some(i => i.persona === pid && /^extern/i.test(i.parte));
}
function vAccesos() {
  const A = D.accesos || { modulos: [], permisos: [], cuentas: [] }, q = (filtro.accQ || '').toLowerCase();
  const niv = (pid, m) => (A.permisos.filter(x => x.persona === pid && x.modulo === m)[0] || {}).nivel || '';
  const cuenta = pid => A.cuentas.filter(c => c.persona === pid)[0];
  const P = (D.personas || []).filter(p => !q || (p.nombre + ' ' + p.institucion).toLowerCase().indexOf(q) >= 0);
  return `<div class="aviso">Cada cambio se guarda al elegirlo. Las herramientas (STAR-H, PHR, ISH) se habilitan acá, no por integrar un órgano. «Pacientes» es lista cerrada: nunca para integrantes externos. La cuenta (usuario y clave) se crea en la planilla CONFIDENCIAL y se une a la persona por la columna N de ACCESOS STAR-H.</div>
    <div class="herr"><input data-f="accQ" placeholder="Buscar persona o institución" value="${E(filtro.accQ || '')}"><span class="esp"></span><span class="meta">${P.length} personas</span></div>
    <div class="tabla"><table><thead><tr><th>Persona</th><th>Órganos</th><th>Cuenta</th>${A.modulos.map(m => `<th>${E(MOD_CORTO[m] || m)}</th>`).join('')}<th></th></tr></thead><tbody>
    ${P.map(p => { const c = cuenta(p.id), ext = esExterna(p.id), org = (D.integrantes || []).filter(i => i.persona === p.id);
      return `<tr><td><b>${E(p.nombre)}</b><br><span class="meta">${E(p.id)} · ${E(p.tipo || '')}${p.institucion ? ' · ' + E(p.institucion) : ''}</span></td>
      <td>${org.map(i => `<span class="chip ${/^intern/i.test(i.parte) ? 'int' : ''}">${E(i.organo)}</span>`).join(' ') || '<span class="meta">—</span>'}</td>
      <td>${c ? `<span class="chip ${c.estado === 'Activo' ? 'ok' : 'val'}">${E(c.rol)} · ${E(c.estado)}</span>` : '<span class="chip val">sin cuenta</span>'}</td>
      ${A.modulos.map(m => { const v = niv(p.id, m), bloq = /^pacientes/i.test(m) && ext;
        return `<td><select data-perm="${E(p.id)}" data-mod="${E(m)}" ${bloq ? 'disabled title="Externo: sin acceso a pacientes"' : ''} style="min-height:32px;font-size:12.5px">${NIV_OP.map(n => `<option value="${n}" ${n === v ? 'selected' : ''}>${n || '—'}</option>`).join('')}</select></td>`; }).join('')}
      <td><button class="btn sec chico" data-a="intNuevoP" data-id="${E(p.id)}" title="Sumar a un órgano"><span class="ms">person_add</span></button></td></tr>`; }).join('')}
    </tbody></table></div>`;
}
function dlgIntegrante(org, iid, pid) {
  const i = iid ? (D.integrantes || []).filter(x => x.id === iid)[0] || {} : {};
  const P = D.personas || [];
  abrir(iid ? 'Editar integrante' : 'Sumar integrante',
    (iid ? `<p><b>${E(i.nombre)}</b> · ${E(nomOrg(i.organo))}</p>` :
      selC('persona', 'Persona (ficha del COE)', pid || '', [['', 'Elegí…']].concat(P.map(p => [p.id, p.nombre + ' · ' + (p.tipo || '')]))) +
      selC('organo', 'Órgano', org || 'COE-APTW', (D.organos || []).map(o => [o.ID, o.Nombre]))) +
    selC('parte', 'Parte', i.parte || '', [['', 'Según el tipo de actor de la ficha'], ['Interna', 'Interna (hospitales y Área Programática)'], ['Externa', 'Externa']]) +
    campo('funcion', 'Función', i.funcion || 'Integrante') +
    (iid ? campo('hasta', 'Hasta (dd/mm/aaaa) · deja de integrar el órgano, sin borrar la historia', '') : '') +
    '<p class="meta">Integrar un órgano da acceso a sus reuniones, acuerdos y documentos según su parte. No habilita STAR-H, PHR, ISH, carga ni pacientes: eso se da en Accesos.</p>',
    `<button class="btn sec" type="button" data-c>Cancelar</button><button class="btn" type="button" data-a="intGuardar" data-id="${E(iid || '')}"><span class="ms">save</span>Guardar</button>`);
  dlg._int = i;
}

/* ---------- acta como Google Doc (Administración) ---------- */
async function generarActa(btn, id) {
  const r = (D.reuniones || []).filter(x => x.ID === id)[0] || {};
  if (r['Acta (Doc)'] && !confirm('Esta reunión ya tiene acta. Si la generó la app, la anterior va a la papelera y queda la nueva. Lo que hayas corregido a mano en ese Doc se pierde (las correcciones se hacen en la app). ¿Generar de nuevo?')) return;
  btn.disabled = true; const txt = btn.innerHTML; btn.innerHTML = '<span class="ms">hourglass_top</span>Generando…';
  try { const x = await S.api('red_acta_generar', { id: id }, 180000); if (!x.ok) throw x; toast('Acta generada (versión 0).'); window.open(x.url, '_blank', 'noopener'); cargar(); }
  catch (e) { toast(errTxt(e)); btn.disabled = false; btn.innerHTML = txt; }
}

/* ---------- Ayuda ---------- */
function dlgAyuda() {
  const A = adm();
  const usu = `<p><b>Para qué sirve.</b> Reúne lo del COE de Trelew y Área Programática: reuniones, asistencia, acuerdos y tareas, documentos, integrantes, establecimientos y enlaces útiles. Es una base orientadora: no es un registro en tiempo real.</p>
    <p><b>Qué ves.</b> Solo lo que corresponde a tu participación. Si integrás la parte interna (hospitales y Área Programática), ves también lo del COE interno. Si sos integrante externo, ves lo del COE completo.</p>
    <p><b>Reuniones.</b> Cada tarjeta muestra los datos, el orden del día, los asistentes y los acuerdos. «Planilla de asistencia» imprime la planilla para firmar. «Acta» y «Asistencia firmada» abren los documentos cuando están cargados.</p>
    <p><b>Programar una reunión (Administración).</b> «Programar reunión» la guarda como «Programada (convocada)» con fecha, horario, lugar y temas a tratar. Aparece en la agenda de la pantalla de inicio de quienes la pueden ver. Si está tildado «Avisar por mail», al guardar sale la convocatoria y el día anterior (24 h antes) el recordatorio, desde belenpellegrini.hys@gmail.com y en copia oculta: COE interno, a los integrantes internos del órgano; COE externo, a todos sus integrantes; otra reunión, a los convocados que se tilden. Se usan los correos de cada ficha (institucional; si no hay, el personal). Si se cambia la fecha, el horario o el lugar, sale un aviso de cambio. Después de la reunión se edita, se pasa a «Realizada» y se marca la asistencia.</p>
    <p><b>Acuerdos y tareas.</b> Todos los acuerdos de las reuniones que ves, con responsable, plazo y estado. Podés filtrar por estado o buscar por texto.</p>
    <p><b>Documentos.</b> Están ordenados por sección: internos (A Administrativos, B Derivación y traslados, C Instituciones receptoras, D Albergues, E Medios de traslado, F Contactos y responsables, G Pacientes con requerimientos especiales, H Alerta, activación y comunicación, I Población a cargo, J Servicios esenciales y continuidad, K Seguridad del personal, L Capacitación y simulacros, M Después del evento) y anexos. Cada documento indica quién lo emite (COE interno, COE completo, Dirección) y su alcance. «Para validar» reúne los que esperan revisión.</p>
    <p><b>Establecimientos.</b> Registro único de la red. Los datos que faltan figuran como «s/d (revisar)».</p>
    <p><b>Necesidades especiales.</b> Si tu acceso lo permite, ves cantidades de pacientes por ciudad, tipo y zona. Nunca datos personales.</p>
    <p><b>Comentar.</b> Si tu acceso lo permite, el botón «Comentar» de arriba deja una observación sobre STAR-H o PHR sin modificar lo cargado.</p>
    <p><b>Sin conexión.</b> Se muestran los últimos datos guardados en el dispositivo. «Actualizar» (flecha circular) los pide de nuevo.</p>
    <p class="meta">Consultas: Servicio de Higiene y Seguridad Laboral, por los canales habituales del COE.</p>`;
  const adminTxt = `<hr style="border:0;border-top:1px solid var(--linea);margin:12px 0"><p><b>Administración</b></p>
    <p><b>Dónde están los datos.</b> En el libro de la app: hojas ORGANOS, INTEGRANTES, PERMISOS, LUGARES, ENLACES, DOCUMENTOS, REUNIONES, ASISTENCIA, ACUERDOS y COMENTARIOS. Todo se puede editar también desde Sheets (respetar los encabezados de la fila 1).</p>
    <p><b>Reunión nueva.</b> «Nueva reunión» › órgano y quiénes (COE completo o COE interno) › tildá los presentes en el momento y sumá invitados en «Otros asistentes» › acuerdos y tareas uno por uno › Guardar. Después «Planilla de asistencia» para imprimir y firmar; el escaneo se sube a Drive y su enlace se pega en la reunión.</p>
    <p><b>Acta.</b> «Generar el acta (Doc)» arma el Google Doc en 06 · COE, versión 0, con el logo HySL al pie, y deja el enlace en la reunión. REGLA DE EDICIÓN: lo que se corrige en el Doc no vuelve a la app; corregí en la app y volvé a generar (el acta anterior generada por la app va a la papelera).</p>
    <p><b>Documentos.</b> «Agregar»: sección (A a M o Anexos; se guarda en DOCUMENTOS › «Sección» y coincide con las subcarpetas 06.A a 06.M y 06.Z de Drive), clase, emisor, alcance, estado y «Visible para» (Todos, Integrantes del órgano, Parte interna o Solo Administración). Lo emitido por HySL lo ves solo vos.</p>
    <p><b>Accesos (pestaña).</b> Una fila por persona: órganos que integra, si tiene cuenta y un selector por herramienta (—, Ver, Comentar, Cargar, Aprobar) que se guarda al elegirlo. «Sumar a un órgano» (ícono de persona) la integra al COE o a un COE hospitalario. Para dejar de integrar un órgano, editá al integrante en «Órganos» y poné la fecha «Hasta».</p>
    <p><b>Permisos.</b> Hoja PERMISOS: una fila por persona, módulo y nivel (Ver, Comentar, Cargar, Aprobar). La persona se une a su cuenta por la columna N de ACCESOS STAR-H. Pacientes: lista cerrada, nunca externos.</p>
    <p><b>Necesidades especiales.</b> Un libro por ciudad del Área Programática Trelew en la carpeta 08 (confidencial); el enlace va en LUGARES, en cada establecimiento de esa ciudad (HZT y HMH → Trelew). Para dar acceso a una sola ciudad: Accesos › Pacientes y, en la hoja PERMISOS, tipo «Localidad» con la ciudad. La pestaña muestra solo cantidades. Quién la ve: lista cerrada en Accesos › Pacientes (nunca externos). Compartir cada libro con las cuentas que cargan es manual, desde Drive, persona por persona.</p>
    <p><b>Comentarios.</b> Llegan a la hoja COMENTARIOS con fecha, persona y módulo.</p>`;
  abrir('Ayuda', usu + (A ? adminTxt : ''), '<button class="btn" type="button" data-c>Entendido</button>');
}

/* ---------- eventos ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-p],[data-a],[data-c]'); if (!t) return;
  if (t.dataset.p) { pest = t.dataset.p; history.replaceState(null, '', '#' + pest); pintar(); return; }
  if (t.hasAttribute('data-c')) { dlg.close(); return; }
  const a = t.dataset.a, id = t.dataset.id;
  if (a === 'reuNueva') dlgReunion('');
  else if (a === 'reuProgramar') dlgReunion('', true);
  else if (a === 'reuEditar') dlgReunion(id);
  else if (a === 'acuMas') filaAcuerdo();
  else if (a === 'imprimir') {
    const r = (D.reuniones || []).filter(x => x.ID === id)[0] || {};
    imprimirPlanilla({ organo: r['Órgano'], parte: r.Parte, fecha: r.Fecha, horario: r.Horario, lugar: r['Lugar o modalidad'], num: r['N.º'], orden: r['Orden del día'] },
      (D.asistencia || []).filter(x => x['Reunión'] === id).map(x => ({ nombre: x.Persona, funcion: x['Institución / función'] })));
  }
  else if (a === 'imprimirDlg') { const r = leerReunion($('#fD')); imprimirPlanilla(r, r.asistencia); }
  else if (a === 'reuGuardar') { const r = leerReunion($('#fD')); r.id = id; if (!r.fecha) { $('#estD').textContent = 'Falta la fecha.'; return; } enviar(t, 'red_reunion_guardar', { reunion: r }, x => 'Reunión guardada.' + (x.aviso ? ' Mail: ' + x.aviso : '')); }
  else if (a === 'acta') generarActa(t, id);
  else if (a === 'pacAct') { PAC = null; pintar(); cargarPac(); }
  else if (a === 'intNuevo') dlgIntegrante(id, '', '');
  else if (a === 'intNuevoP') dlgIntegrante('', '', id);
  else if (a === 'intEditar') dlgIntegrante('', id, '');
  else if (a === 'intGuardar') {
    const f = $('#fD'), i = dlg._int || {};
    const datos = { id: id, persona: id ? i.persona : f.persona.value, organo: id ? i.organo : f.organo.value, parte: f.parte.value, funcion: f.funcion.value, hasta: f.hasta ? f.hasta.value.trim() : '' };
    if (!datos.persona) { $('#estD').textContent = 'Elegí la persona.'; return; }
    enviar(t, 'red_integrante_guardar', { integrante: datos }, 'Integrante guardado.');
  }
  else if (a === 'docNuevo') dlgFila('doc', ''); else if (a === 'docEditar') dlgFila('doc', id);
  else if (a === 'lugEditar') dlgFila('lug', id);
  else if (a === 'enlNuevo') dlgFila('enl', ''); else if (a === 'enlEditar') dlgFila('enl', id);
  else if (a === 'filaGuardar') {
    const cfg = dlg._cfg, f = $('#fD'), o = {}; [...f.elements].forEach(el => { if (el.name) o[el.name] = el.value; });
    o[cfg.key] = id || ''; const tit = o['Título'] || o['Nombre oficial'];
    if (!String(tit || '').trim()) { $('#estD').textContent = 'Falta el título o nombre.'; return; }
    if (cfg.prop === 'documento' && !o.Fecha) o.Fecha = new Date().toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    enviar(t, cfg.accion, { [cfg.prop]: o }, 'Guardado.');
  }
  else if (a === 'comGuardar') { const f = $('#fD'); if (!f.texto.value.trim()) { $('#estD').textContent = 'Escribí el comentario.'; return; } enviar(t, 'red_comentar', { modulo: f.modulo.value, ref: f.ref.value, texto: f.texto.value }, 'Comentario enviado.'); }
});
document.addEventListener('change', async ev => {
  const s = ev.target; if (!s.dataset || !s.dataset.perm) return;
  const pid = s.dataset.perm, mod = s.dataset.mod, prev = s.dataset.prev != null ? s.dataset.prev : '';
  const ant = ((D.accesos || {}).permisos || []).filter(x => x.persona === pid && x.modulo === mod)[0] || {};
  s.disabled = true;
  try {
    const r = await S.api('red_permiso_guardar', { permiso: { persona: pid, modulo: mod, nivel: s.value, tipo: ant.tipo || (/^pacientes/i.test(mod) ? 'Área' : 'Red'), alcance: ant.alcance || (/^pacientes/i.test(mod) ? 'Área Programática Trelew' : 'Red Trelew') } }, 60000);
    if (!r.ok) throw r; toast(s.value ? 'Acceso guardado: ' + mod + ' · ' + s.value : 'Acceso quitado: ' + mod);
    const L = D.accesos.permisos.filter(x => !(x.persona === pid && x.modulo === mod)); if (s.value) L.push(Object.assign({}, ant, { persona: pid, modulo: mod, nivel: s.value })); D.accesos.permisos = L;
  } catch (e) { toast(errTxt(e)); s.value = ant.nivel || ''; }
  finally { s.disabled = false; }
});
document.addEventListener('change', ev => { const k = ev.target.dataset && ev.target.dataset.f; if (k && ev.target.tagName === 'SELECT') { filtro[k] = ev.target.value; pintar(); } });
document.addEventListener('input', ev => { const k = ev.target.dataset && ev.target.dataset.f; if (k && ev.target.tagName === 'INPUT') { filtro[k] = ev.target.value; clearTimeout(ev.target._t); const pos = ev.target.selectionStart; ev.target._t = setTimeout(() => { pintar(); const n = document.querySelector(`[data-f="${k}"]`); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 300); } });
$('#bAct').addEventListener('click', () => cargar('Actualizado.'));
$('#bComentar').addEventListener('click', dlgComentar);
$('#bAyuda').addEventListener('click', dlgAyuda);
if (D) pintar('Últimos datos guardados. Actualizando…');
cargar();
})();
</script>
</body>
</html>
