/* Para mover la imagen y centrar otra región: cambiar --sst-x (izquierda/derecha) y --sst-y (arriba/abajo), en %.

.barra::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(10,20,40,.62) 0%,rgba(10,20,40,.25) 38%,rgba(10,20,40,0) 60%)}

function alertasSmnHtml(r, admin) {

async function alertasSmn(u, admin) {
