<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0..1,0&display=block" rel="stylesheet">
<style>
/* 15/11/2026 · Transportes y distancias (v0). Belén: «una tarjeta de transportes y distancias… ambulancias por hospital, medios privados
   de ambulancias, transportes especiales (inundación, vehículos de alguna fuerza)… sin pedir por duplicado la info».
   Diseño aprobado: 1 OK · 2 OK · 3 contactos para TODOS · 4 TODAS LAS DISTANCIAS.
   Ambulancias propias: campo «ambs» de la ficha de cada establecimiento. Medios privados y especiales, contactos y distancias:
   BASE · Establecimientos de salud (base maestra), por la acción transportes_leer. Ningún dato va en el código público de la página.
   Base orientadora: no es un registro en tiempo real. Ver claude/cambios-app-emergencias-13.md. */
:root{--fuerte:#123E7A;--medio:#2A7BD6;--claro:#E3EEFB;--borde:#C3D6F0;--texto:#172B4D;--suave:#4B5B73;--tenue:#6B7A90;--fondo:#F5F7FB;--coral:#F57C00;--ok:#1E8E5A;--rojo:#C62828;--ambar:#B26A00}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--texto);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;line-height:1.5}
.ms{font-family:'Material Symbols Outlined';font-size:20px;line-height:1;display:inline-block;vertical-align:middle;font-feature-settings:'liga'}
.barra{position:sticky;top:0;z-index:5;background:var(--fuerte);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--medio)}
.barra h1{font-size:16px;margin:0;flex:1}.barra h1 small{display:block;font-size:11.5px;font-weight:500;opacity:.85}
.icono{color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;font-weight:600;font-size:13px;background:none;border:0;cursor:pointer;font-family:inherit}
.icono:hover{background:rgba(255,255,255,.14)}
main{max-width:1100px;margin:0 auto;padding:16px 16px 40px}
.aviso{background:#FFF6EC;border:1.5px solid var(--coral);border-left:6px solid var(--coral);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.ayuda{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.ayuda summary{cursor:pointer;font-weight:700}.ayuda p{margin:.5em 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1.5px solid var(--borde);background:#fff;color:var(--fuerte);border-radius:999px;padding:8px 14px;font:600 13.5px 'Plus Jakarta Sans',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tab[aria-selected=true]{background:var(--fuerte);border-color:var(--fuerte);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:12px 14px}
.card h3{margin:0 0 2px;font-size:15px}.card .sub{font-size:12px;color:var(--tenue);margin-bottom:8px}
.amb{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--claro);font-size:13.5px}
.amb:first-of-type{border-top:0}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.e-ok{background:#E3F4EC;color:var(--ok)}.e-pr{background:#FFF1DB;color:var(--ambar)}.e-fs{background:#FDE7E7;color:var(--rojo)}.e-ns{background:#EEF1F6;color:var(--suave)}
.esc{background:var(--claro);color:var(--fuerte);font-weight:600;margin:2px 4px 2px 0}
.resumen{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--borde);background:#fff;color:var(--fuerte);border-radius:10px;padding:6px 10px;font:600 12.5px 'Plus Jakarta Sans',sans-serif;cursor:pointer;margin-top:8px}
.btn:hover{background:var(--claro)}.btn[disabled]{opacity:.45;cursor:default}
.sd{color:var(--tenue);font-style:italic}
dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0 0;font-size:13px}dt{color:var(--suave)}dd{margin:0}
.contacto{background:var(--fondo);border-radius:10px;padding:6px 10px;margin-top:8px;font-size:13px}
.contacto a{color:var(--medio)}
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
select,input[type=search]{font:500 14px 'Plus Jakarta Sans',sans-serif;border:1.5px solid var(--borde);border-radius:10px;padding:8px 10px;background:#fff;color:var(--texto);max-width:100%}
.escs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.escs button{border:1.5px solid var(--borde);background:#fff;border-radius:999px;padding:6px 12px;font:600 13px 'Plus Jakarta Sans',sans-serif;color:var(--fuerte);cursor:pointer}
.escs button[aria-pressed=true]{background:var(--medio);border-color:var(--medio);color:#fff}
.tabw{overflow-x:auto;background:#fff;border:1px solid var(--borde);border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--claro);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--suave);white-space:nowrap}
td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.fu{font-size:11px;color:var(--tenue)}
.pie{font-size:12px;color:var(--tenue);margin-top:12px}
footer{text-align:center;padding:10px 16px 28px}footer img{width:66.67%;min-width:min(300px,92%);max-width:900px;object-fit:contain;height:auto}
@media print{.barra .icono,.ayuda,.tabs,.filtros,.escs,.btn{display:none}.barra{position:static;background:#fff;color:#000;border-bottom:2px solid #000}body{background:#fff}.card{break-inside:avoid}}
</style>
</head>
<body>
<header class="barra">
  <a class="icono" href="index.html" aria-label="Inicio"><span class="ms">home</span></a>
  <h1>Transportes y distancias<small>Preparación · versión 0 · base orientadora</small></h1>
  <button class="icono" type="button" onclick="window.print()" aria-label="Imprimir"><span class="ms">print</span></button>
</header>
<main id="app"><p class="pie">Cargando…</p></main>
<footer><img src="logo-hysl.png" alt="Hospitales más seguros para las personas"></footer>
<script src="config.js"></script>
<script src="starh.js"></script>
<script>
(function () {
'use strict';
const S = window.STARH, E = S.esc, app = document.getElementById('app');
const SD = 's/d (revisar)';
const TABS = [['amb', 'local_hospital', 'Ambulancias de los hospitales'], ['med', 'airport_shuttle', 'Medios privados y de otros organismos'],
  ['esp', 'flood', 'Transportes especiales'], ['dis', 'route', 'Distancias']];
const ESCENARIOS = ['inundación o anegamiento', 'barro o ripio', 'nieve o hielo', 'zona sin acceso por ruta (aéreo)', 'traslado bariátrico',
  'neonatal (incubadora)', 'aislamiento infeccioso', 'salud mental'];
let D = null, tab = S.store.get('transp.tab') || 'amb', esc = '', orig = S.store.get('transp.orig') || 'L-002', dest = S.store.get('transp.dest') || '', filtro = '';

const vacio = v => !String(v == null ? '' : v).trim() || /^s\/d/i.test(String(v).trim());
const val = v => vacio(v) ? `<span class="sd">${E(String(v || '').trim() || SD)}</span>` : E(v);
function chipEstado(e) {
  const t = String(e || '').trim() || 'Sin estado';
  const c = /^funciona$/i.test(t) ? 'e-ok' : /problema/i.test(t) ? 'e-pr' : /fuera/i.test(t) ? 'e-fs' : 'e-ns';
  return `<span class="chip ${c}">${E(t)}</span>`;
}
const tel = t => vacio(t) ? val(t) : `<a href="tel:${E(String(t).replace(/[^\d+]/g, ''))}">${E(t)}</a>`;
const mail = t => vacio(t) ? val(t) : `<a href="mailto:${E(t)}">${E(t)}</a>`;
function nombreDe(id) {
  if (!D) return id;
  const l = D.base.lugares.find(x => x.id === id); if (l) return l.corto && l.corto !== l.nombre && !vacio(l.corto) ? `${l.nombre} (${l.corto})` : l.nombre;
  const r = D.base.recursos.find(x => x.id === id); return r ? r.nombre : id;
}
function contactosDe(id) {
  const out = [];
  const r = D.base.recursos.find(x => x.id === id);
  if (r && !vacio(r.telefono)) out.push(`<div class="contacto"><b>${E(r.nombre)}</b> · ${tel(r.telefono)}${vacio(r.direccion) ? '' : ' · ' + E(r.direccion)}</div>`);
  D.base.contactos.filter(c => c.id === id).forEach(c => out.push(`<div class="contacto"><b>${E(c.rol || 'Contacto')}</b>${vacio(c.nombre) ? '' : ' · ' + E(c.nombre)} · ${tel(c.telefono)}${vacio(c.correo) ? '' : ' · ' + mail(c.correo)}${vacio(c.horario) ? '' : ' · ' + E(c.horario)}</div>`));
  return out.join('') || `<div class="contacto"><span class="sd">Sin contacto cargado (${SD})</span></div>`;
}

// 1) Ambulancias de los hospitales (ficha de cada establecimiento)
function vAmb() {
  const hs = D.hospitales;
  const tot = {}; let n = 0;
  hs.forEach(h => (h.ambs || []).forEach(a => { n++; const e = String(a.estado || '').trim() || 'Sin estado'; tot[e] = (tot[e] || 0) + 1; }));
  const sin = hs.filter(h => !h.ambs).length;
  return `<div class="card" style="margin-bottom:12px"><h3>Total del Área Programática</h3>
    <div class="resumen"><span class="chip e-ns">${n} ambulancia${n === 1 ? '' : 's'} cargada${n === 1 ? '' : 's'}</span>${Object.keys(tot).map(e => chipEstado(e).replace('</span>', ` · ${tot[e]}</span>`)).join('')}</div>
    <div class="sub">${sin ? `${sin} establecimiento${sin === 1 ? '' : 's'} sin ambulancias cargadas en la ficha.` : 'Todos los establecimientos tienen la lista cargada.'}</div></div>
  <div class="grid">${hs.map(h => {
    const l = D.base.lugares.find(x => x.id === h.id);
    const lista = h.ambs === null ? `<p class="sd">Sin cargar en la ficha (${SD}).</p>` : !h.ambs.length ? '<p class="sd">La ficha indica que no hay ambulancias.</p>' :
      h.ambs.map(a => `<div class="amb"><span class="ms" style="color:var(--medio)">ambulance</span><div style="flex:1"><b>${val(a.id)}</b> ${chipEstado(a.estado)}${vacio(a.obs) ? '' : `<div class="fu">${E(a.obs)}</div>`}</div></div>`).join('');
    return `<div class="card"><h3>${E(h.est)}</h3><div class="sub">${l && !vacio(l.localidad) ? E(l.localidad) + ' · ' : ''}${h.act ? 'Ambulancias actualizadas el ' + E(h.act) : 'Ambulancias sin cargar'}</div>${lista}
      <button class="btn" type="button" data-ficha="${E(h.est)}"><span class="ms">edit_note</span>${h.puede ? 'Corregir en la ficha' : 'Ver la ficha'}</button></div>`;
  }).join('')}</div>
  <p class="pie">Fuente: ficha de cada establecimiento (campo «Ambulancias»), cargada por su referente. No se carga en otro lado.</p>`;
}

// 2) Medios privados y de otros organismos (BASE · MEDIOS DE TRASLADO)
function tarjetaMedio(m) {
  const escs = String(m.escenarios || '').split(';').map(s => s.trim()).filter(s => s && !vacio(s));
  return `<div class="card"><h3>${E(m.organismo_nombre || nombreDe(m.organismo) || m.organismo)}</h3>
    <div class="sub">${E(m.id)} · ${val(m.tipo)} · ${val(m.vehiculo)}</div>
    <dl><dt>Cantidad</dt><dd>${val(m.cantidad)}</dd><dt>Camilla / sentados</dt><dd>${val(m.camilla)} / ${val(m.sentados)}</dd>
    <dt>Equipamiento</dt><dd>${val(m.equipamiento)}</dd><dt>Disponible 24 h</dt><dd>${val(m.h24)}</dd>
    <dt>Cómo se solicita</dt><dd>${val(m.solicitud)}</dd><dt>Convenio o costo</dt><dd>${val(m.convenio)}</dd><dt>Base</dt><dd>${val(m.base)}</dd></dl>
    <div style="margin-top:6px">${escs.length ? escs.map(s => `<span class="chip esc">${E(s)}</span>`).join('') : '<span class="sd">Escenarios: ' + SD + '</span>'}</div>
    ${vacio(m.obs) ? '' : `<div class="fu" style="margin-top:6px">${E(m.obs)}</div>`}
    ${contactosDe(m.organismo)}
    <div class="fu" style="margin-top:6px">Fuente: ${val(m.fuente)}${vacio(m.actualizado) ? '' : ' · ' + E(m.actualizado)}</div></div>`;
}
function vMed() {
  const tipos = [...new Set(D.base.medios.map(m => m.tipo).filter(Boolean))].sort();
  const ms = D.base.medios.filter(m => !filtro || m.tipo === filtro);
  return `<div class="filtros"><label>Tipo de medio <select id="fTipo"><option value="">Todos (${D.base.medios.length})</option>${tipos.map(t => `<option${t === filtro ? ' selected' : ''}>${E(t)}</option>`).join('')}</select></label></div>
  ${ms.length ? `<div class="grid">${ms.map(tarjetaMedio).join('')}</div>` : '<p class="sd">Sin medios cargados.</p>'}
  <p class="pie">Fuente: BASE · Establecimientos de salud, hoja MEDIOS DE TRASLADO (la cargan Belén o el COEsp). Las ambulancias propias de los hospitales están en la primera pestaña.</p>`;
}

// 3) Transportes especiales: filtro por escenario sobre los mismos medios
function vEsp() {
  const ms = esc ? D.base.medios.filter(m => String(m.escenarios || '').toLowerCase().split(';').map(s => s.trim()).indexOf(esc) >= 0) : [];
  const cuenta = s => D.base.medios.filter(m => String(m.escenarios || '').toLowerCase().split(';').map(x => x.trim()).indexOf(s) >= 0).length;
  return `<p style="font-size:13.5px;margin-top:0">Elegí el escenario para ver qué medios sirven.</p>
  <div class="escs">${ESCENARIOS.map(s => `<button type="button" data-esc="${E(s)}" aria-pressed="${s === esc}">${E(s)} · ${cuenta(s)}</button>`).join('')}</div>
  ${!esc ? '' : ms.length ? `<div class="grid">${ms.map(tarjetaMedio).join('')}</div>` : `<div class="aviso">No hay medios cargados para «${E(esc)}». Se completa en la hoja MEDIOS DE TRASLADO, columna «Sirve para».</div>`}
  <p class="pie">Es la misma lista de la pestaña anterior, filtrada por la columna «Sirve para (escenarios)». No se carga aparte.</p>`;
}

// 4) Distancias (BASE · DISTANCIAS): cualquier origen a cualquier destino
function vDis() {
  const idx = {}; D.base.distancias.forEach(d => { idx[d[0] + '|' + d[1]] = d; });
  const par = (a, b) => idx[a + '|' + b] || (idx[b + '|' + a] ? [a, b].concat(idx[b + '|' + a].slice(2)) : null);
  const lugares = D.base.lugares.map(l => ({ id: l.id, n: l.nombre, g: 'Establecimientos de salud', t: l.tipo, loc: l.localidad }))
    // 15/11/2026 06:05 (Belén: «base almirante zar también sirve como albergue… los albergues separados de los recursos de apoyo»):
    // la columna «albergue» de RECURSOS DE APOYO tiene el ID A- del COE · Derivaciones y albergues.
    // 06:13 (Belén: «la base tb es rec de apoyo»): columna «recurso» = Sí → aparece en los dos grupos (en la tabla, una sola vez).
    .concat([].concat.apply([], D.base.recursos.map(r => { const alb = /^A-\d+/.test(String(r.albergue || '').trim()), rec = !alb || /^s[ií]/i.test(String(r.recurso || '').trim());
      const t = alb ? (rec ? 'Albergue y recurso de apoyo · ' : 'Albergue · ') + r.tipo : r.tipo, o = [];
      if (alb) o.push({ id: r.id, n: r.nombre, g: 'Albergues', t: t, loc: r.localidad });
      if (rec) o.push({ id: r.id, n: r.nombre, g: 'Recursos de apoyo', t: t, loc: r.localidad });
      return o; })))
    .concat((D.base.localidades || []).map(r => ({ id: r.id, n: r.nombre, g: 'Localidades', t: 'Localidad (centro)', loc: r.departamento ? 'Depto. ' + r.departamento : '' })));
  if (!lugares.some(l => l.id === orig)) orig = lugares.length ? lugares[0].id : '';
  if (dest === orig || (dest && !lugares.some(l => l.id === dest))) dest = '';
  const total = new Set(lugares.map(l => l.id)).size;
  const opt = (g, sel, sin) => lugares.filter(l => l.g === g && l.id !== sin).map(l => `<option value="${E(l.id)}"${l.id === sel ? ' selected' : ''}>${E(l.n)}</option>`).join('');
  const grupos = (sel, sin) => ['Establecimientos de salud', 'Albergues', 'Localidades', 'Recursos de apoyo'].map(g => `<optgroup label="${g}">${opt(g, sel, sin)}</optgroup>`).join('');
  const q = filtro.toLowerCase();
  const vistos = {};
  const filas = lugares.filter(l => !vistos[l.id] && (vistos[l.id] = true)).filter(l => l.id !== orig && (!dest || l.id === dest) && (!q || (l.n + ' ' + l.t + ' ' + l.loc).toLowerCase().indexOf(q) >= 0))
    .map(l => ({ l: l, d: par(orig, l.id) }))
    .sort((a, b) => (a.d ? parseFloat(String(a.d[3]).replace(',', '.')) : 1e9) - (b.d ? parseFloat(String(b.d[3]).replace(',', '.')) : 1e9));
  return `<div class="filtros"><label>Desde <select id="fOrig">${grupos(orig, '')}</select></label>
    <button class="btn" type="button" id="fInv" style="margin-top:0"${dest ? '' : ' disabled title="Elegí un destino para invertir"'} aria-label="Invertir origen y destino"><span class="ms">swap_horiz</span>Invertir</button>
    <label>Hasta <select id="fDest"><option value="">Todos (${total - 1})</option>${grupos(dest, orig)}</select></label>
    ${dest ? '' : `<input type="search" id="fBus" placeholder="Buscar destino, tipo o localidad" value="${E(filtro)}">`}</div>
  <div class="tabw"><table><thead><tr><th>Hasta</th><th>Tipo</th><th>Localidad</th><th class="n">km</th><th class="n">min</th><th>Fuente</th></tr></thead><tbody>
  ${filas.map(f => `<tr><td>${E(f.l.n)}${f.d && f.d[4] ? `<div class="fu">Por ${E(f.d[4])}</div>` : ''}</td><td>${val(f.l.t)}</td><td>${val(f.l.loc)}</td>
    <td class="n">${f.d ? E(f.d[2]) : '<span class="sd">s/d</span>'}</td><td class="n">${f.d ? E(f.d[3]) : '<span class="sd">s/d</span>'}</td>
    <td class="fu">${!f.d ? SD : f.d[5] === 'G' ? 'Google Maps (con tránsito)' : 'OSRM (sin tránsito)'}</td></tr>`).join('')}
  </tbody></table></div>
  <p class="pie">Distancia y tiempo en auto, ordenados del más cercano al más lejano. Hacia el HMH: Google Maps, 14/11/2026 18 h, con el tránsito de ese momento. Resto: cálculo por calles con OSRM (OpenStreetMap), 15/11/2026, sin tránsito. Las localidades se miden desde su punto central (OpenStreetMap). Son estimados: no reemplazan la planificación del traslado. Fuente: BASE · Establecimientos de salud, hoja DISTANCIAS.</p>`;
}

function pintar() {
  if (!D) return;
  const cuerpo = tab === 'med' ? vMed() : tab === 'esp' ? vEsp() : tab === 'dis' ? vDis() : vAmb();
  app.innerHTML = `<div class="aviso"><b>Distancias y tiempos en condiciones normales.</b> En una emergencia (inundación, barro, nieve, cortes), antes de trasladar verificá el estado de las rutas: <a href="https://chubut.gob.ar/destacado/1291" target="_blank" rel="noopener">Rutas · Defensa Civil Chubut</a>.<br>Base orientadora, versión 0: los datos son estimados y no son un registro en tiempo real. Si falta un dato figura «${SD}».${D.error ? '<br><b>' + E(D.error) + '</b>' : ''}</div>
  <details class="ayuda"><summary><span class="ms">help</span> Ayuda</summary>
  <p><b>Ambulancias de los hospitales:</b> salen de la ficha de cada establecimiento (las carga su referente). Para corregirlas, tocá «Corregir en la ficha». No se cargan en ningún otro lado.</p>
  <p><b>Medios privados y de otros organismos:</b> ambulancias privadas y vehículos de bomberos, fuerzas, Defensa Civil u otros. Los cargan Belén o el COEsp en la base maestra (hoja MEDIOS DE TRASLADO). El contacto sale de la hoja CONTACTOS y del teléfono del organismo.</p>
  <p><b>Transportes especiales:</b> es la misma lista, filtrada por escenario (inundación, barro, nieve, sin acceso por ruta, bariátrico, neonatal, aislamiento, salud mental).</p>
  <p><b>Distancias:</b> elegí el lugar de salida («Desde»). Con «Hasta» en «Todos» se ordenan todos los destinos del más cercano al más lejano; si elegís un destino, ves solo ese par, y «Invertir» cambia el sentido. Los lugares están en cuatro grupos: establecimientos de salud, albergues (los del COE · Derivaciones y albergues), localidades (punto central de cada una) y recursos de apoyo. Son estimados en auto.</p>
  <p>Consultado el ${E(D.consultado || '')}.</p></details>
  <div class="tabs" role="tablist">${TABS.map(t => `<button class="tab" role="tab" type="button" data-tab="${t[0]}" aria-selected="${t[0] === tab}"><span class="ms">${t[1]}</span>${E(t[2])}</button>`).join('')}</div>
  <section>${cuerpo}</section>`;
}
app.addEventListener('click', ev => {
  const t = ev.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; filtro = ''; S.store.set('transp.tab', tab); pintar(); return; }
  const e = ev.target.closest('[data-esc]'); if (e) { esc = esc === e.dataset.esc ? '' : e.dataset.esc; pintar(); return; }
  if (ev.target.closest('#fInv') && dest) { const t = orig; orig = dest; dest = t; S.store.set('transp.orig', orig); S.store.set('transp.dest', dest); pintar(); return; }
  const f = ev.target.closest('[data-ficha]'); if (f) { S.store.set('ficha.estab', f.dataset.ficha); location.href = 'ficha.html'; }
});
app.addEventListener('change', ev => {
  if (ev.target.id === 'fTipo') { filtro = ev.target.value; pintar(); }
  if (ev.target.id === 'fOrig') { orig = ev.target.value; S.store.set('transp.orig', orig); pintar(); }
  if (ev.target.id === 'fDest') { dest = ev.target.value; S.store.set('transp.dest', dest); pintar(); }
});
app.addEventListener('input', ev => {
  if (ev.target.id === 'fBus') { filtro = ev.target.value; const p = ev.target.selectionStart; pintar(); const b = document.getElementById('fBus'); if (b) { b.focus(); b.setSelectionRange(p, p); } }
});
(async function () {
  const c = S.store.get('transp.cache'); if (c && c.ok) { D = c; pintar(); }
  try { const r = await S.api('transportes_leer', {}); if (!r || !r.ok) throw r; S.store.set('transp.cache', r); D = r; pintar(); }
  catch (e) { if (!c) app.innerHTML = '<div class="aviso">No se pudieron leer los transportes. Probá de nuevo en un rato.</div>'; }
})();
})();
</script>
