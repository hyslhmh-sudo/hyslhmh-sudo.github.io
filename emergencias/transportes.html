<style>
/* 15/11/2026 · Transportes y distancias (v0). Belén: «una tarjeta de transportes y distancias… ambulancias por hospital, medios privados
   de ambulancias, transportes especiales (inundación, vehículos de alguna fuerza)… sin pedir por duplicado la info».
   Diseño aprobado: 1 OK · 2 OK · 3 contactos para TODOS · 4 TODAS LAS DISTANCIAS.
   Ambulancias propias: campo «ambs» de la ficha de cada establecimiento. Medios privados y especiales, contactos y distancias:
   BASE · Establecimientos de salud (base maestra), por la acción transportes_leer. Ningún dato va en el código público de la página.
   Base orientadora: no es un registro en tiempo real. Ver claude/cambios-app-emergencias-13.md. */
:root{--fuerte:#123E7A;--medio:#2A7BD6;--claro:#E3EEFB;--borde:#C3D6F0;--texto:#172B4D;--suave:#4B5B73;--tenue:#6B7A90;--fondo:#F5F7FB;--coral:#F57C00;--ok:#1E8E5A;--rojo:#C62828;--ambar:#B26A00}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--texto);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;line-height:1.5}
.ms{font-family:'Material Symbols Outlined';font-size:20px;line-height:1;display:inline-block;vertical-align:middle;font-feature-settings:'liga'}
.barra{position:sticky;top:0;z-index:5;background:var(--fuerte);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--medio)}
.barra h1{font-size:16px;margin:0;flex:1}.barra h1 small{display:block;font-size:11.5px;font-weight:500;opacity:.85}
.icono{color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;font-weight:600;font-size:13px;background:none;border:0;cursor:pointer;font-family:inherit}
.icono:hover{background:rgba(255,255,255,.14)}
main{max-width:1100px;margin:0 auto;padding:16px 16px 40px}
.aviso{background:#FFF6EC;border:1.5px solid var(--coral);border-left:6px solid var(--coral);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.ayuda{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.ayuda summary{cursor:pointer;font-weight:700}.ayuda p{margin:.5em 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1.5px solid var(--borde);background:#fff;color:var(--fuerte);border-radius:999px;padding:8px 14px;font:600 13.5px 'Plus Jakarta Sans',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tab[aria-selected=true]{background:var(--fuerte);border-color:var(--fuerte);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:12px 14px}
.card h3{margin:0 0 2px;font-size:15px}.card .sub{font-size:12px;color:var(--tenue);margin-bottom:8px}
.amb{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--claro);font-size:13.5px}
.amb:first-of-type{border-top:0}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.e-ok{background:#E3F4EC;color:var(--ok)}.e-pr{background:#FFF1DB;color:var(--ambar)}.e-fs{background:#FDE7E7;color:var(--rojo)}.e-ns{background:#EEF1F6;color:var(--suave)}
.esc{background:var(--claro);color:var(--fuerte);font-weight:600;margin:2px 4px 2px 0}
.resumen{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--borde);background:#fff;color:var(--fuerte);border-radius:10px;padding:6px 10px;font:600 12.5px 'Plus Jakarta Sans',sans-serif;cursor:pointer;margin-top:8px}
.btn:hover{background:var(--claro)}.btn[disabled]{opacity:.45;cursor:default}
.sd{color:var(--tenue);font-style:italic}
dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0 0;font-size:13px}dt{color:var(--suave)}dd{margin:0}
.contacto{background:var(--fondo);border-radius:10px;padding:6px 10px;margin-top:8px;font-size:13px}
.contacto a{color:var(--medio)}
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
select,input[type=search]{font:500 14px 'Plus Jakarta Sans',sans-serif;border:1.5px solid var(--borde);border-radius:10px;padding:8px 10px;background:#fff;color:var(--texto);max-width:100%}
.escs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.escs button{border:1.5px solid var(--borde);background:#fff;border-radius:999px;padding:6px 12px;font:600 13px 'Plus Jakarta Sans',sans-serif;color:var(--fuerte);cursor:pointer}
.escs button[aria-pressed=true]{background:var(--medio);border-color:var(--medio);color:#fff}
.tabw tr.grp td{background:var(--claro);color:var(--fuerte);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em}
.tabw{overflow-x:auto;background:#fff;border:1px solid var(--borde);border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--claro);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--suave);white-space:nowrap}
td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.fu{font-size:11px;color:var(--tenue)}
.pie{font-size:12px;color:var(--tenue);margin-top:12px}
/* 15/11/2026 · Carga de medios (Administración y referentes) */
dialog#dlgMedio{border:0;border-radius:18px;padding:0;width:min(640px,96vw);max-height:92vh;box-shadow:0 20px 50px rgba(23,43,77,.35)}
dialog#dlgMedio::backdrop{background:rgba(23,43,77,.45)}
#fMedio{padding:16px 18px;overflow:auto;max-height:92vh}#fMedio h2{margin:0 0 4px;font-size:17px;color:var(--fuerte)}
#fMedio label{display:block;font-size:12.5px;font-weight:700;color:var(--suave);margin-top:10px}
#fMedio input[type=text],#fMedio select,#fMedio textarea{display:block;width:100%;margin-top:3px;font:500 14px 'Plus Jakarta Sans',sans-serif;border:1.5px solid var(--borde);border-radius:10px;padding:8px 10px;color:var(--texto);background:#fff}
#fMedio label[hidden]{display:none}
.amb-ed{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 8px;align-items:end;padding:8px;margin:6px 0;border-radius:10px;background:var(--fondo)}.amb-ed label{display:block;margin:0}.amb-ed label small{display:block;font-size:11px;font-weight:700;color:var(--tenue);margin-bottom:2px}.amb-ed label.w{grid-column:1/-1}.amb-ed input,.amb-ed select{font:500 13.5px 'Plus Jakarta Sans',sans-serif;border:1.5px solid var(--borde);border-radius:10px;padding:7px 8px;min-width:0;width:100%}.amb-ed [data-quitar]{justify-self:start}
#fMedio .dos{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:520px){#fMedio .dos{grid-template-columns:1fr}}
#fMedio .chk{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px}#fMedio .chk label{display:flex;align-items:center;gap:6px;margin:0;font-weight:500;color:var(--texto);font-size:13.5px}
#fMedio .acc{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;position:sticky;bottom:-16px;background:#fff;padding:10px 0}
.btn.pri{background:var(--fuerte);border-color:var(--fuerte);color:#fff}.btn.pri:hover{background:var(--medio)}
#mMsg{margin-top:10px}
footer{text-align:center;padding:10px 16px 28px}footer img{width:66.67%;min-width:min(300px,92%);max-width:900px;object-fit:contain;height:auto}
@media print{.barra .icono,.ayuda,.tabs,.filtros,.escs,.btn{display:none}.barra{position:static;background:#fff;color:#000;border-bottom:2px solid #000}body{background:#fff}.card{break-inside:avoid}}
</style>

<header class="barra">
  <a class="icono" href="index.html" aria-label="Inicio"><span class="ms">home</span></a>
  <h1>Transportes y distancias<small>Preparación · versión 0 · base orientadora</small></h1>
  <button class="icono" type="button" onclick="window.print()" aria-label="Imprimir"><span class="ms">print</span></button>
</header>
<main id="app"><p class="pie">Cargando…</p></main>
<dialog id="dlgMedio"><form id="fMedio" method="dialog"></form></dialog>
<footer><img src="logo-hysl.png" alt="Hospitales más seguros para las personas"></footer>
<script src="config.js"></script>
<script src="starh.js"></script>
<script>
(function () {
'use strict';
const S = window.STARH, E = S.esc, app = document.getElementById('app');
const SD = 's/d (revisar)';
const TABS = [['amb', 'local_hospital', 'Ambulancias y móviles de los hospitales'], ['med', 'airport_shuttle', 'Medios de traslado'],
  ['esp', 'flood', 'Transportes especiales'], ['dis', 'route', 'Distancias']];
const ESCENARIOS = ['inundación o anegamiento', 'barro o ripio', 'nieve o hielo', 'zona sin acceso por ruta (aéreo)', 'traslado bariátrico',
  'neonatal (incubadora)', 'aislamiento infeccioso', 'salud mental'];
let D = null, tab = S.store.get('transp.tab') || 'amb', esc = '', orig = S.store.get('transp.orig') || 'L-002', dest = S.store.get('transp.dest') || '', filtro = '';

const vacio = v => !String(v == null ? '' : v).trim() || /^s\/d/i.test(String(v).trim());
const val = v => vacio(v) ? `<span class="sd">${E(String(v || '').trim() || SD)}</span>` : E(v);
function chipEstado(e) {
  const t = String(e || '').trim() || 'Sin estado';
  // 18/11/2026 · escala única (Muy bueno, Bueno, Regular, Malo, Fuera de servicio); se siguen leyendo los estados viejos (Funciona…).
  const c = /^(funciona|muy bueno|bueno)$/i.test(t) ? 'e-ok' : /problema|^regular$/i.test(t) ? 'e-pr' : /fuera|^malo$/i.test(t) ? 'e-fs' : 'e-ns';
  return `<span class="chip ${c}">${E(t)}</span>`;
}
const tel = t => vacio(t) ? val(t) : `<a href="tel:${E(String(t).replace(/[^\d+]/g, ''))}">${E(t)}</a>`;
const mail = t => vacio(t) ? val(t) : `<a href="mailto:${E(t)}">${E(t)}</a>`;
function nombreDe(id) {
  if (!D) return id;
  const l = D.base.lugares.find(x => x.id === id); if (l) return l.corto && l.corto !== l.nombre && !vacio(l.corto) ? `${l.nombre} (${l.corto})` : l.nombre;
  const r = D.base.recursos.find(x => x.id === id); return r ? r.nombre : id;
}
function contactosDe(id) {
  const out = [];
  const r = D.base.recursos.find(x => x.id === id);
  if (r && !vacio(r.telefono)) out.push(`<div class="contacto"><b>${E(r.nombre)}</b> · ${tel(r.telefono)}${vacio(r.direccion) ? '' : ' · ' + E(r.direccion)}</div>`);
  D.base.contactos.filter(c => c.id === id).forEach(c => out.push(`<div class="contacto"><b>${E(c.rol || 'Contacto')}</b>${vacio(c.nombre) ? '' : ' · ' + E(c.nombre)} · ${tel(c.telefono)}${vacio(c.correo) ? '' : ' · ' + mail(c.correo)}${vacio(c.horario) ? '' : ' · ' + E(c.horario)}</div>`));
  return out.join('') || `<div class="contacto"><span class="sd">Sin contacto cargado (${SD})</span></div>`;
}

// 1) Ambulancias de los hospitales (ficha de cada establecimiento)
// 15/11/2026 07:44 (Belén: «estos comparten el servicio de ambulancia. el equipo directivo»): el HMH y el HZT tienen un solo servicio de
// ambulancias (mismo equipo directivo). Se muestra una sola tarjeta y se guarda en la ficha del HZT (un solo dato).
const COMPARTE = { 'Hospital María Humphreys': 'Hospital Zonal Trelew' };
const conQuien = est => Object.keys(COMPARTE).filter(k => COMPARTE[k] === est);
function vAmb() {
  const hs = D.hospitales.filter(h => !COMPARTE[h.est]);
  const tot = {}; let n = 0;
  hs.forEach(h => (h.ambs || []).forEach(a => { n++; const e = String(a.estado || '').trim() || 'Sin estado'; tot[e] = (tot[e] || 0) + 1; }));
  const sin = hs.filter(h => !h.ambs).length;
  return `${faltaPub ? '<div class="aviso">Para corregir ambulancias y vehículos falta publicar la versión nueva del servidor. Avisale a Higiene y Seguridad Laboral. Mientras tanto se pueden cargar desde la ficha del establecimiento.</div>' : ''}<div class="card" style="margin-bottom:12px"><h3>Total del Área Programática</h3>
    <div class="resumen"><span class="chip e-ns">${n} ambulancia${n === 1 ? '' : 's'} cargada${n === 1 ? '' : 's'}</span>${Object.keys(tot).map(e => chipEstado(e).replace('</span>', ` · ${tot[e]}</span>`)).join('')}</div>
    <div class="sub">${sin ? `${sin} establecimiento${sin === 1 ? '' : 's'} sin ambulancias cargadas en la ficha.` : 'Todos los establecimientos tienen la lista cargada.'}</div></div>
  <div class="grid">${hs.map(h => {
    const l = D.base.lugares.find(x => x.id === h.id);
    const lista = h.ambs === null ? `<p class="sd">Sin cargar en la ficha (${SD}).</p>` : !h.ambs.length ? '<p class="sd">La ficha indica que no hay ambulancias.</p>' :
      h.ambs.map(a => itemVeh(a, 'ambulance', COLS_AMB)).join('');
    const listaM = h.movs === null || !h.movs ? '' : !h.movs.length ? '' : `<div class="sub" style="margin-top:8px"><b>Vehículos de apoyo</b></div>${h.movs.map(a => itemVeh(a, 'airport_shuttle', COLS_MOV)).join('')}`;
    const otros = conQuien(h.est);
    const cab = `<h3>${E([h.est].concat(otros).join(' y '))}</h3>${otros.length ? '<div class="sub"><b>Servicio de ambulancias compartido</b> (mismo equipo directivo)</div>' : ''}<div class="sub">${l && !vacio(l.localidad) ? E(l.localidad) + ' · ' : ''}${h.act ? 'Ambulancias actualizadas el ' + E(h.act) : 'Ambulancias sin cargar'}</div>`;
    if (edAmb && edAmb.est === h.est) return `<div class="card">${cab}${editorAmb()}</div>`;
    return `<div class="card">${cab}${lista}${listaM}
      ${h.puede ? `<button class="btn" type="button" data-amb="${E(h.est)}"><span class="ms">edit</span>Corregir ambulancias y vehículos</button>` : ''}</div>`;
  }).join('')}</div>
  <p class="pie">Fuente: ficha de cada establecimiento (campos «Ambulancias» y «Vehículos de apoyo»). Se corrige acá o en la ficha: es el mismo dato. Lo corrige el referente de cada establecimiento y Administración. Estado: Muy bueno, Bueno, Regular, Malo o Fuera de servicio.</p>`;
}
// 15/11/2026 07:30 (Belén: «acá se debería ver y corregir solo lo de ambulancia»): se corrigen las ambulancias en la misma tarjeta,
// sin ir a la ficha completa. Se guarda en el mismo campo «ambs» de la ficha (acción ficha_guardar): un solo dato.
// 18/11/2026 · Belén: «que todos los hospitales deban cargar el estado igual que las ambulancias y móviles de Trelew». Mismas columnas que la ficha.
const EST_VEH = ['Muy bueno', 'Bueno', 'Regular', 'Malo', 'Fuera de servicio', 'No sabe'], SNN = ['Sí', 'No', 'No sabe'];
const COLS_AMB = [{ k: 'id', l: 'Patente' }, { k: 'marca', l: 'Marca y modelo' }, { k: 'anio', l: 'Año', n: 1 }, { k: 'estado', l: 'Estado', o: EST_VEH }, { k: 'uso', l: '¿En uso?', o: SNN },
  { k: 'equip', l: 'Equipamiento', o: ['Traslado simple', 'Soporte básico', 'Soporte avanzado', 'Solo apoyo (no traslada pacientes)', 'No sabe'] },
  { k: 'camilla', l: 'Pacientes en camilla', n: 1 }, { k: 'sentados', l: 'Personas sentadas', n: 1 }, { k: 'barro', l: '¿Apta para barro, ripio o anegamiento?', o: SNN }, { k: 'obs', l: 'Observaciones', w: 1 }];
const COLS_MOV = [{ k: 'id', l: 'Patente' }, { k: 'marca', l: 'Marca y modelo' }, { k: 'anio', l: 'Año', n: 1 }, { k: 'funcion', l: 'Función', o: ['Apoyo', 'Mantenimiento', 'Servicio o programa específico', 'Otro'] },
  { k: 'estado', l: 'Estado', o: EST_VEH }, { k: 'uso', l: '¿En uso?', o: SNN }, { k: 'emerg', l: '¿Se puede usar en una emergencia?', o: SNN }, { k: 'h24', l: '¿Disponible las 24 h?', o: SNN },
  { k: 'sentados', l: 'Personas sentadas', n: 1 }, { k: 'camilla', l: '¿Puede llevar camilla?', o: SNN }, { k: 'obs', l: 'Observaciones', w: 1 }];
// Un vehículo en la tarjeta: patente, marca · año, estado y el resto de los datos cargados.
function itemVeh(a, ico, cols) {
  const det = cols.filter(c => ['id', 'marca', 'anio', 'estado', 'obs'].indexOf(c.k) < 0 && !vacio(a[c.k])).map(c => `${E(c.l.replace(/[¿?]/g, ''))}: <b>${E(a[c.k])}</b>`).join(' · ');
  return `<div class="amb"><span class="ms" style="color:var(--medio)">${ico}</span><div style="flex:1"><b>${val(a.id)}</b>${vacio(a.marca) ? '' : ' · ' + E(a.marca)}${vacio(a.anio) ? '' : ' · ' + E(a.anio)} ${chipEstado(a.estado)}${det ? `<div class="fu">${det}</div>` : ''}${vacio(a.obs) ? '' : `<div class="fu">${E(a.obs)}</div>`}</div></div>`;
}
let edAmb = null; // { est, L: ambulancias, M: vehículos de apoyo, msg }
let faltaPub = false; // 18/11/2026 · si el servidor todavía no devuelve «movs», no se abre el editor (se perderían marca, año, etc.)
function editorAmb() {
  const ctl = (lista, cols) => (a, i) => `<div class="amb-ed" data-l="${lista}" data-i="${i}">${cols.map(c => `<label class="${c.w ? 'w' : ''}"><small>${E(c.l)}</small>${c.o
    ? `<select data-c="${c.k}"><option value="">Elegí…</option>${c.o.concat(a[c.k] && c.o.indexOf(a[c.k]) < 0 && !vacio(a[c.k]) ? [a[c.k]] : []).map(o => `<option${o === a[c.k] ? ' selected' : ''}>${E(o)}</option>`).join('')}</select>`
    : `<input type="text" data-c="${c.k}" ${c.n ? 'inputmode="numeric"' : ''} value="${E(vacio(a[c.k]) ? '' : a[c.k])}">`}</label>`).join('')}
    <button class="btn" type="button" data-quitar="${lista}:${i}" aria-label="Quitar" style="margin-top:0"><span class="ms">delete</span>Quitar</button></div>`;
  return `<div class="sub" style="margin-top:6px"><b>Ambulancias</b></div><div class="amb-eds">${edAmb.L.length ? edAmb.L.map(ctl('L', COLS_AMB)).join('') : '<p class="sd">Sin ambulancias. Si el establecimiento no tiene, guardá así.</p>'}</div>
    <button class="btn" type="button" data-mas="L"><span class="ms">add</span>Agregar ambulancia</button>
    <div class="sub" style="margin-top:12px"><b>Vehículos de apoyo</b> (utilitarios, camionetas, de mantenimiento u otros que no son ambulancias)</div><div class="amb-eds">${edAmb.M.length ? edAmb.M.map(ctl('M', COLS_MOV)).join('') : '<p class="sd">Sin vehículos de apoyo cargados.</p>'}</div>
    <button class="btn" type="button" data-mas="M"><span class="ms">add</span>Agregar vehículo de apoyo</button>
    ${edAmb.msg ? `<div class="aviso" style="margin:8px 0 0">${E(edAmb.msg)}</div>` : ''}
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" type="button" id="ambCan">Cancelar</button><button class="btn pri" type="button" id="ambOk"><span class="ms">save</span>Guardar</button></div>`;
}
function leerAmb() { document.querySelectorAll('.amb-ed').forEach(r => { const a = edAmb[r.dataset.l][+r.dataset.i]; r.querySelectorAll('[data-c]').forEach(c => { a[c.dataset.c] = c.value.trim(); }); }); }
async function guardarAmb() {
  leerAmb();
  const limpio = (L, cols) => L.filter(a => cols.some(c => String(a[c.k] || '').trim())).map(a => { const o = {}; cols.forEach(c => { o[c.k] = String(a[c.k] || '').trim() || (c.k === 'id' ? SD : c.k === 'estado' ? 'No sabe' : ''); }); return o; });
  const L = limpio(edAmb.L, COLS_AMB), M = limpio(edAmb.M, COLS_MOV);
  edAmb.msg = 'Guardando…'; pintar();
  try {
    const r = await S.api('ficha_guardar', { est: edAmb.est, cambios: { ambs: L, movs: M } }, 60000); if (!r || !r.ok) throw r;
    edAmb = null; const n = await S.api('transportes_leer', {}); if (n && n.ok) { S.store.set('transp.cache', n); D = n; } pintar();

// 4) Distancias (BASE · DISTANCIAS): cualquier origen a cualquier destino
// 16/11/2026 21:24 (Belén: «ok» a sumar instituciones, albergues y población a cargo del COE · Derivaciones y albergues; «en el buscador
// de distancias debe estar ordenado por 1. localidad. 2. institucion de salud: publica/privada - 3. albergues 4. asilos 5. etc...»).
// Los lugares del COE llegan en D.base.coe (ID CR-, CA-, CP-); si tienen id_base, ya están en la BASE y no se duplican.
// 18/11/2026 21:40 (Belén: «no puedo poner hasta HMH - revisar y ordenar bien por tipo»): las instituciones públicas se separan por tipo
// (hospitales primero, con HMH, HZT y HSST arriba; después CAPS y centros de salud, puestos sanitarios y otros servicios), accesos rápidos
// «Hasta» al HMH y al HZT, y la tabla vuelve a ordenarse por tipo por defecto (clave nueva, para no arrastrar «del más cercano»).
const GRUPOS_DIS = ['Localidades', 'Hospitales públicos', 'CAPS y centros de salud', 'Puestos sanitarios', 'Otros servicios de salud pública',
  'Instituciones de salud privadas', 'Albergues', 'Geriátricos', 'Dispositivos intermedios de Salud Mental Comunitaria', 'Otra población a cargo', 'Recursos de apoyo'];
const PRIMEROS = ['L-002', 'L-001', 'L-003'];
const grupoPub = t => /hospital/i.test(t || '') ? 'Hospitales públicos' : /\bcaps\b|centro de salud|centro integral|prosate|salud integral/i.test(t || '') ? 'CAPS y centros de salud' : /puesto/i.test(t || '') ? 'Puestos sanitarios' : 'Otros servicios de salud pública';
let ordenDis = S.store.get('transp.ordenDis2') || 'grupo';
function lugaresDis() {
  const o = [], pubRx = /cl[ií]nica privada|sanatorio privado|privad/i;
  (D.base.localidades || []).forEach(r => o.push({ id: r.id, n: r.nombre, g: 'Localidades', t: 'Localidad (centro)', loc: r.departamento ? 'Depto. ' + r.departamento : '' }));
  D.base.lugares.forEach(l => o.push({ id: l.id, n: l.nombre, g: grupoPub(l.tipo), t: l.tipo, loc: l.localidad }));
  // 15/11/2026 06:05 y 06:13: la columna «albergue» de RECURSOS DE APOYO tiene el ID A- del COE; «recurso» = Sí → aparece en los dos grupos.
  D.base.recursos.forEach(r => {
    if (pubRx.test(r.tipo || '')) { o.push({ id: r.id, n: r.nombre, g: 'Instituciones de salud privadas', t: r.tipo, loc: r.localidad }); return; }
    const alb = /^A-\d+/.test(String(r.albergue || '').trim()), rec = !alb || /^s[ií]/i.test(String(r.recurso || '').trim());
    const t = alb ? (rec ? 'Albergue y recurso de apoyo · ' : 'Albergue · ') + r.tipo : r.tipo;
    if (alb) o.push({ id: r.id, n: r.nombre, g: 'Albergues', t: t, loc: r.localidad });
    if (rec) o.push({ id: r.id, n: r.nombre, g: 'Recursos de apoyo', t: t, loc: r.localidad });
  });
  (D.base.coe || []).forEach(c => {
    let g;
    if (c.hoja === 'RECEPTORAS') { if (c.id_base) return; g = /privad/i.test(c.tipo) ? 'Instituciones de salud privadas' : grupoPub(c.tipo || 'Hospital'); }
    else if (c.hoja === 'ALBERGUES') { if (c.id_base) return; g = 'Albergues'; }
    else g = /geri[aá]tric/i.test(c.tipo) ? 'Geriátricos' : /salud mental/i.test(c.tipo) ? 'Dispositivos intermedios de Salud Mental Comunitaria' : 'Otra población a cargo';
    // Población a cargo que ya está en la BASE (p. ej. las comisarías): mismo ID de la BASE, aparece también en su grupo.
    o.push({ id: c.id_base || c.id, n: c.nombre, g: g, t: c.tipo + (c.hoja === 'POBLACION A CARGO' ? ' · población a cargo' : ''), loc: c.localidad, sinCoord: !c.id_base && !c.lat });
  });
  const cmp = (a, b) => String(a).localeCompare(String(b), 'es', { sensitivity: 'base' });
  const pr = x => { const i = PRIMEROS.indexOf(x.id); return i < 0 ? 99 : i; };
  return o.sort((a, b) => GRUPOS_DIS.indexOf(a.g) - GRUPOS_DIS.indexOf(b.g) || pr(a) - pr(b) || (a.g === 'Localidades' ? 0 : cmp(a.loc, b.loc)) || cmp(a.t, b.t) || cmp(a.n, b.n));
}
function vDis() {
  const idx = {}; D.base.distancias.forEach(d => { idx[d[0] + '|' + d[1]] = d; });
  const par = (a, b) => idx[a + '|' + b] || (idx[b + '|' + a] ? [a, b].concat(idx[b + '|' + a].slice(2)) : null);

    .map(l => ({ l: l, d: par(orig, l.id) }))

  return `<div class="filtros"><label>Desde <select id="fOrig">${grupos(orig, '')}</select></label>
    <button class="btn" type="button" id="fInv" style="margin-top:0"${dest ? '' : ' disabled title="Elegí un destino para invertir"'} aria-label="Invertir origen y destino"><span class="ms">swap_horiz</span>Invertir</button>
    <label>Hasta <select id="fDest"><option value="">Todos (${total - 1})</option>${grupos(dest, orig)}</select></label>
    <span style="display:inline-flex;gap:6px;align-items:center">${[['L-002', 'Al HMH'], ['L-001', 'Al HZT']].filter(x => x[0] !== orig && lugares.some(l => l.id === x[0])).map(x => `<button class="btn" type="button" data-hasta="${x[0]}" style="margin-top:0"${dest === x[0] ? ' aria-pressed="true"' : ''}><span class="ms">local_hospital</span>${x[1]}</button>`).join('')}</span>
    ${dest ? '' : `<label>Ordenar <select id="fOrden"><option value="grupo"${ordenDis === 'grupo' ? ' selected' : ''}>Por tipo de lugar</option><option value="cerca"${ordenDis === 'cerca' ? ' selected' : ''}>Del más cercano al más lejano</option></select></label>
    <input type="search" id="fBus" placeholder="Buscar destino, tipo, grupo o localidad" value="${E(filtro)}">`}</div>
  <div class="tabw"><table><thead><tr><th>Hasta</th><th>Tipo</th><th>Localidad</th><th class="n">km</th><th class="n">min</th><th>Fuente</th></tr></thead><tbody>
  ${filas.map(fila).join('')}
  </tbody></table></div>
  <p class="pie">Distancia y tiempo en auto. Grupos en este orden: localidades, hospitales públicos (HMH, HZT y HSST primero), CAPS y centros de salud, puestos sanitarios, otros servicios de salud pública, instituciones de salud privadas, albergues, geriátricos, dispositivos intermedios de Salud Mental Comunitaria, otra población a cargo y recursos de apoyo; dentro de cada grupo, del más cercano al más lejano. Hacia el HMH: Google Maps, 14/11/2026 18 h, con el tránsito de ese momento. Resto: cálculo por calles con OSRM (OpenStreetMap), 15 y 16/11/2026, sin tránsito. Las localidades se miden desde su punto central (OpenStreetMap). Son estimados: no reemplazan la planificación del traslado. Fuente: BASE · Establecimientos de salud (hoja DISTANCIAS) y COE · Derivaciones y albergues (receptoras, albergues y población a cargo).</p>`;
}

function pintar() {

  app.innerHTML = `<div class="aviso"><b>Distancias y tiempos en condiciones normales.</b> En una emergencia (inundación, barro, nieve, cortes), antes de trasladar verificá el estado de las rutas: <a href="https://chubut.gob.ar/destacado/1291" target="_blank" rel="noopener">Rutas · Defensa Civil Chubut</a>.<br>Base orientadora, versión 0: los datos son estimados y no son un registro en tiempo real. Si falta un dato figura «${SD}».${D.error ? '<br><b>' + E(D.error) + '</b>' : ''}</div>
  <details class="ayuda"><summary><span class="ms">help</span> Ayuda</summary>
  <p><b>Ambulancias y móviles de los hospitales:</b> cada hospital carga, en su ficha o acá con «Corregir ambulancias y vehículos», sus ambulancias (patente, marca y modelo, año, estado, si está en uso, equipamiento, pacientes en camilla, personas sentadas, si es apta para barro, ripio o anegamiento y observaciones) y sus vehículos de apoyo (patente, marca y modelo, año, función, estado, si está en uso, si se puede usar en una emergencia, si está disponible las 24 h, personas sentadas, si puede llevar camilla y observaciones). El estado es el mismo para todos: Muy bueno, Bueno, Regular, Malo o Fuera de servicio. El HMH y el HZT comparten el servicio (mismo equipo directivo): van en una sola tarjeta y se guardan en la ficha del HZT. Es el mismo dato de la ficha: no hace falta cargarlo dos veces. Lo corrige el referente de cada establecimiento y Administración.</p>
  <p><b>Medios de traslado:</b> medios que no son de los hospitales públicos (con marca y modelo, patente, año y estado si se conocen): ambulancias privadas y vehículos de bomberos, fuerzas, Defensa Civil u otros. Los cargan Administración y los referentes con «Agregar medio» (en esa pestaña); cada referente corrige los que cargó él y Administración corrige todos. Se guardan en la base maestra (hoja MEDIOS DE TRASLADO), que sirve de respaldo. El contacto sale de la hoja CONTACTOS y del teléfono del organismo.</p>
  <p><b>Transportes especiales:</b> es la misma lista, filtrada por escenario (inundación, barro, nieve, sin acceso por ruta, bariátrico, neonatal, aislamiento, salud mental).</p>
  <p><b>Distancias:</b> elegí el lugar de salida («Desde»). Con «Hasta» en «Todos» se ordenan todos los destinos del más cercano al más lejano; si elegís un destino, ves solo ese par, y «Invertir» cambia el sentido. Los lugares están ordenados por grupo: localidades (punto central de cada una), instituciones de salud públicas, instituciones de salud privadas, albergues, geriátricos, dispositivos intermedios de Salud Mental Comunitaria, otra población a cargo (alcaidía, comisarías, centros de detención, casas infantiles, casas de madres) y recursos de apoyo. Las instituciones receptoras, los albergues y la población a cargo salen del COE · Derivaciones y albergues: se cargan una sola vez, ahí. Con «Ordenar» elegís ver la tabla por grupo o toda junta del más cercano al más lejano. Un lugar sin coordenadas figura con «s/d». Son estimados en auto.</p>
  <p>Consultado el ${E(D.consultado || '')}.</p></details>
  <div class="tabs" role="tablist">${TABS.map(t => `<button class="tab" role="tab" type="button" data-tab="${t[0]}" aria-selected="${t[0] === tab}"><span class="ms">${t[1]}</span>${E(t[2])}</button>`).join('')}</div>
  <section>${cuerpo}</section>`;
}
app.addEventListener('click', ev => {
  const t = ev.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; filtro = ''; S.store.set('transp.tab', tab); pintar(); return; }
  const e = ev.target.closest('[data-esc]'); if (e) { esc = esc === e.dataset.esc ? '' : e.dataset.esc; pintar(); return; }
  const bh = ev.target.closest('[data-hasta]'); if (bh) { dest = bh.dataset.hasta; S.store.set('transp.dest', dest); pintar(); return; }
  if (ev.target.closest('#fInv') && dest) { const t = orig; orig = dest; dest = t; S.store.set('transp.orig', orig); S.store.set('transp.dest', dest); pintar(); return; }
  const ea = ev.target.closest('[data-amb]'); if (ea) { const h = D.hospitales.find(x => x.est === ea.dataset.amb); if (!('movs' in h)) { faltaPub = true; pintar(); return; } edAmb = { est: h.est, L: JSON.parse(JSON.stringify(h.ambs || [])), M: JSON.parse(JSON.stringify(h.movs || [])), msg: '' }; if (!edAmb.L.length) edAmb.L.push({}); pintar(); return; }
  const ms = ev.target.closest('[data-mas]'); if (edAmb && ms) { leerAmb(); edAmb[ms.dataset.mas].push({}); pintar(); return; }
  const q = ev.target.closest('[data-quitar]'); if (q && edAmb) { leerAmb(); const [l, i] = q.dataset.quitar.split(':'); edAmb[l].splice(+i, 1); pintar(); return; }
  if (ev.target.closest('#ambCan')) { edAmb = null; pintar(); return; }
  if (ev.target.closest('#ambOk')) { guardarAmb(); return; }
  if (ev.target.closest('#mNuevo')) { abrirMedio(''); return; }
  const md = ev.target.closest('[data-medio]'); if (md) { abrirMedio(md.dataset.medio); return; }
  const f = ev.target.closest('[data-ficha]'); if (f) { S.store.set('ficha.estab', f.dataset.ficha); location.href = 'ficha.html'; }
});
app.addEventListener('change', ev => {
  if (ev.target.id === 'fTipo') { filtro = ev.target.value; pintar(); }
  if (ev.target.id === 'fOrig') { orig = ev.target.value; S.store.set('transp.orig', orig); pintar(); }
  if (ev.target.id === 'fDest') { dest = ev.target.value; S.store.set('transp.dest', dest); pintar(); }
  if (ev.target.id === 'fOrden') { ordenDis = ev.target.value; S.store.set('transp.ordenDis2', ordenDis); pintar(); }
});
app.addEventListener('input', ev => {
  if (ev.target.id === 'fBus') { filtro = ev.target.value; const p = ev.target.selectionStart; pintar(); const b = document.getElementById('fBus'); if (b) { b.focus(); b.setSelectionRange(p, p); } }
});
(async function () {
  const c = S.store.get('transp.cache'); if (c && c.ok) { D = c; pintar(); }
  try { const r = await S.api('transportes_leer', {}); if (!r || !r.ok) throw r; S.store.set('transp.cache', r); D = r; pintar(); }
  catch (e) { if (!c) app.innerHTML = '<div class="aviso">No se pudieron leer los transportes. Probá de nuevo en un rato.</div>'; }
})();
})();
</script>
