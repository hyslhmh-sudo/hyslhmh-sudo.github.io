<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PHR · Relevamiento inicial</title>
<meta name="description" content="Relevamiento inicial del plan hospitalario de respuesta a emergencias de salud y desastres (instructivo OPS 2023).">
<meta name="theme-color" content="#B8441A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0..1,0&display=block" rel="stylesheet">
<style>
:root{
  --fuerte:#B8441A; --medio:#E8602A; --claro:#FDEDE4; --borde:#F3D3C2;
  --texto:#3A4A52; --suave:#6B7A82; --tenue:#8A979E; --linea:#E3E8EB; --fondo:#F6F7F8; --papel:#FFFFFF;
  --ok:#2E7D4F; --alerta:#B26A00; --error:#B3261E;
  --radio:12px; --sombra:0 1px 2px rgba(13,49,63,.06),0 4px 14px rgba(13,49,63,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--texto);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:20px;line-height:1;display:inline-block;vertical-align:middle;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';user-select:none}
a{color:var(--fuerte)}
.oculto{display:none!important}

/* barra superior */
.barra{position:sticky;top:0;z-index:20;background:var(--fuerte);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
.barra h1{font-size:16px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra h1 small{display:block;font-size:11.5px;font-weight:500;opacity:.85}
.icono{background:transparent;border:0;color:inherit;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.icono:hover{background:rgba(255,255,255,.14)}
.sync{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:999px;padding:6px 10px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.sync .ms{font-size:18px}
.demo{background:#FFF4CC;color:#5E4B00;font-size:12.5px;padding:7px 16px;text-align:center;border-bottom:1px solid #F0DE9C}

main{max-width:880px;margin:0 auto;padding:16px 16px 120px}
.tarjeta{background:var(--papel);border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra)}
h2{font-size:18px;margin:4px 0 12px;color:var(--fuerte)}
h3{font-size:14.5px;margin:0 0 8px;color:var(--fuerte)}
.sub{color:var(--suave);font-size:13px}

/* ingreso */
.ingreso{max-width:420px;margin:7vh auto 0;padding:26px 22px}
.ingreso h2{font-size:21px;margin:0 0 4px}
.campo{display:block;margin:14px 0}
.campo span{display:block;font-size:12.5px;font-weight:600;color:var(--suave);margin-bottom:5px}
.campo input,.campo select,.campo textarea{width:100%;border:1px solid #CBD3D8;border-radius:10px;padding:11px 12px;background:#fff;outline:none}
.campo textarea{min-height:68px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--medio);box-shadow:0 0 0 3px var(--claro)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--fuerte);color:#fff;min-height:44px}
.btn:hover{filter:brightness(1.06)}
.btn.sec{background:#fff;color:var(--fuerte);border-color:var(--borde)}
.btn.sec:hover{background:var(--claro)}
.btn.ancho{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.msg{margin-top:12px;font-size:13.5px;padding:10px 12px;border-radius:10px;background:#FCE8E6;color:var(--error)}

/* selector de red */
.redes{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.red-tab{border:1px solid var(--linea);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.red-tab[aria-pressed="true"]{background:var(--fuerte);color:#fff;border-color:var(--fuerte)}

/* lista de establecimientos */
.resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.resumen .tarjeta{padding:12px}
.resumen b{display:block;font-size:22px;color:var(--fuerte);font-variant-numeric:tabular-nums}
.resumen span{font-size:12px;color:var(--suave)}
.lista{display:grid;gap:10px}
.est{padding:14px;display:grid;gap:8px;cursor:pointer;text-align:left;width:100%}
.est:hover{border-color:var(--borde)}
.est-cab{display:flex;gap:10px;align-items:flex-start}
.est-cab b{flex:1;font-size:15px;color:#24343B}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--claro);color:var(--fuerte);white-space:nowrap}
.chip.pend{background:#EEF1F3;color:var(--suave)}
.chip.cola{background:#FFF4CC;color:#5E4B00}
.barra-prog{height:6px;border-radius:99px;background:#EEF1F3;overflow:hidden}
.barra-prog i{display:block;height:100%;background:var(--medio);border-radius:99px}
.est-pie{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--suave);align-items:center}
.niv{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}

/* establecimiento */
.volver{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--fuerte);font-weight:700;cursor:pointer;padding:6px 0;margin-bottom:6px}
.cab-est{padding:14px 16px;margin-bottom:12px}
.cab-est h2{margin:0 0 2px}
details.datos{margin-top:10px;border-top:1px solid var(--linea);padding-top:8px}
details.datos summary{cursor:pointer;font-weight:700;color:var(--fuerte);font-size:13.5px;padding:4px 0}
.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.filtros{display:flex;gap:6px;overflow-x:auto;margin:6px 0 10px;padding-bottom:2px}
.filtro{border:1px solid var(--linea);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.filtro[aria-pressed="true"]{background:var(--claro);border-color:var(--borde);color:var(--fuerte)}
.buscar{position:relative;margin-bottom:10px}
.buscar input{width:100%;border:1px solid #CBD3D8;border-radius:10px;padding:10px 12px 10px 38px;background:#fff}
.buscar .ms{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--tenue)}
.guia{margin:0 2px 8px;font-size:13px;color:#3A4A52}
.guia summary{cursor:pointer;color:var(--fuerte);font-weight:700;font-size:13px;list-style:none;display:flex;align-items:center;gap:4px}
.guia summary::-webkit-details-marker{display:none}
.guia .g-in{background:var(--claro);border-radius:10px;padding:10px 12px;margin-top:6px}
.guia p{margin:0 0 6px}.guia p:last-child{margin:0}
.guia .crit{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;margin-top:6px}
.guia .crit b{font-size:12px}
.grupo-tit{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--suave);margin:16px 2px 6px}
.amen{display:flex;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--linea);cursor:pointer;background:#fff;width:100%;text-align:left;border-left:0;border-right:0;border-top:0}
.amen:last-child{border-bottom:0}
.amen:hover{background:#FAFBFB}
.amen .id{font-size:12px;font-weight:700;color:var(--tenue);width:34px;flex:none}
.amen .nom{flex:1;min-width:0;font-size:14px}
.bloque{overflow:hidden}

/* hoja de evaluación */
.hoja{position:fixed;inset:0;z-index:40;background:rgba(20,30,35,.45);display:flex;justify-content:center;align-items:flex-end}
.hoja-in{background:var(--fondo);width:100%;max-width:760px;max-height:100%;height:100%;display:flex;flex-direction:column;border-radius:0}
@media (min-width:800px){.hoja{align-items:center;padding:24px}.hoja-in{height:auto;max-height:94vh;border-radius:16px;overflow:hidden}}
.hoja-cab{background:var(--fuerte);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px 16px;display:flex;align-items:center;gap:8px}
.hoja-cab b{flex:1;font-size:15px;line-height:1.3}
.hoja-cab small{display:block;font-weight:500;opacity:.85;font-size:12px}
.hoja-cuerpo{overflow-y:auto;padding:14px 16px 20px;flex:1}
.contexto{padding:12px 14px;font-size:13.5px;margin-bottom:12px}
.contexto p{margin:0 0 6px}
.dim{padding:12px 14px;margin-bottom:10px}
.dim h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dim h3 small{font-weight:600;color:var(--tenue);font-size:12px}
.opciones{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.opciones.tres{grid-template-columns:repeat(3,1fr)}
.opciones.dos{grid-template-columns:repeat(2,1fr)}
.op{border:1.5px solid #CBD3D8;background:#fff;border-radius:10px;padding:9px 4px;cursor:pointer;font-weight:700;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.op small{font-weight:500;font-size:10.5px;color:var(--suave);line-height:1.15;text-align:center}
.op[aria-pressed="true"]{border-color:var(--fuerte);background:var(--claro);color:var(--fuerte)}
.op[aria-pressed="true"] small{color:var(--fuerte)}
.desc{font-size:13px;color:var(--suave);margin-top:8px;min-height:18px}
.resultado{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--linea);padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);display:grid;gap:10px}
.calc{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px}
.calc b{font-size:16px;color:#24343B;font-variant-numeric:tabular-nums}
.calc .niv{font-size:13px;padding:5px 10px}
.acciones{display:flex;gap:8px}
.acciones .btn{flex:1}
.aviso{font-size:12.5px;color:var(--alerta)}

/* menú y ayuda */
.menu{position:fixed;top:calc(env(safe-area-inset-top) + 56px);right:12px;z-index:30;padding:6px;min-width:220px}
.menu button,.menu a{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left;text-decoration:none;color:var(--texto);font-weight:600}
.menu button:hover,.menu a:hover{background:var(--claro)}
.ayuda{padding:16px 18px}
.ayuda h3{margin-top:16px}
.ayuda p,.ayuda li{font-size:14px}
.tabla-esc{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0 10px}
.tabla-esc td,.tabla-esc th{border:1px solid var(--linea);padding:5px 7px;text-align:left;vertical-align:top}
.tabla-esc th{background:var(--claro);color:var(--fuerte)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);background:#24343B;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:60;box-shadow:var(--sombra);max-width:calc(100% - 32px)}
footer{text-align:center;padding:24px 16px 12px}
footer img{width:min(340px,80%);height:auto;opacity:.95}
footer p{font-size:11.5px;color:var(--tenue);margin:6px 0 0}
.vacio{padding:28px;text-align:center;color:var(--suave)}
@media (max-width:520px){.resumen b{font-size:19px}.rejilla{grid-template-columns:1fr}.op small{display:none}}
.secciones{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sec-chip{font-size:12px;padding:4px 8px;border-radius:6px;color:#24343B;white-space:nowrap}
</style>
</head>
<body>
<div id="demo" class="demo oculto"></div>
<header class="barra" id="barra">
  <h1 id="titulo">PHR · Relevamiento inicial<small>Plan hospitalario de respuesta</small></h1>
  <button class="sync oculto" id="btnSync" aria-live="polite"></button>
  <button class="icono oculto" id="btnMenu" aria-label="Menú"><span class="ms">menu</span></button>
</header>
<div id="menu" class="menu tarjeta oculto" role="menu">
  <a href="index.html"><span class="ms">home</span>Inicio</a>
  <a href="phr-tablero.html"><span class="ms">monitoring</span>Tablero PHR</a>
  <a href="starh.html" id="lnkStarh"><span class="ms">crisis_alert</span>Ir a STAR-H</a>
  <a href="ish.html" id="lnkIsh" class="oculto"><span class="ms">local_hospital</span>Ir a ISH (seguridad hospitalaria)</a>
  <button data-act="actualizar"><span class="ms">refresh</span>Actualizar datos</button>
  <button data-act="ayuda"><span class="ms">help</span>Ayuda</button>
  <button data-act="salir"><span class="ms">logout</span>Salir</button>
</div>
<main id="app" aria-live="polite"></main>
<footer><img src="logo-hysl.png" alt="Hospitales más seguros para las personas"><p>Higiene y Seguridad Laboral · Instructivo OPS para el plan hospitalario de respuesta (2023) · Versión 0</p></footer>
<div id="hoja" class="hoja oculto" role="dialog" aria-modal="true"></div>
<script src="config.js"></script>
<script src="starh.js"></script>
<script src="guias.js"></script>
<script>
(function () {
'use strict';
const S = window.STARH, $ = s => document.querySelector(s), app = $('#app');
const K = S.DEMO ? 'demo.phr.' : 'phr.';
let cat = S.store.get(K + 'cat', null);
let cola = S.store.get(K + 'cola', []);
let redActual = S.store.get('phr.red', '');
let filtro = 'pend', busqueda = '', sincronizando = false, ultimoError = '';
let borrador = null, listaHoja = [];
const EST = ['Cumple', 'Parcial', 'No cumple'];
const COLOR = { 'Cumple': ['#C8E6C9', '#1E5223'], 'Parcial': ['#FFF2B3', '#5E4B00'], 'No cumple': ['#F4B4B4', '#7A1F1F'] };

if (S.DEMO) { $('#demo').textContent = 'La app PHR necesita la conexión con el Apps Script (no tiene modo demostración).'; $('#demo').classList.remove('oculto'); }

function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3200); }
function guardarCat() { S.store.set(K + 'cat', cat); }
function guardarCola() { S.store.set(K + 'cola', cola); pintarSync(); }
function tema(nombre) { const t = S.temaRed(nombre), r = document.documentElement.style; r.setProperty('--fuerte', t.fuerte); r.setProperty('--medio', t.medio); r.setProperty('--claro', t.claro); r.setProperty('--borde', t.borde); document.querySelector('meta[name=theme-color]').setAttribute('content', t.fuerte); }
function chipEstado(e) { return e && COLOR[e] ? `<span class="niv" style="background:${COLOR[e][0]};color:${COLOR[e][1]}">${S.esc(e)}</span>` : ''; }
function red(n) { return cat && cat.redes.find(r => r.nombre === n); }
function rels(r, c) { return r.relevamiento.filter(e => e.codigo === c); }
function resuelto(e) { return e.aplica === 'No aplica' || !!e.estado; }
function pct(lista) { const v = lista.filter(e => e.aplica !== 'No aplica' && e.estado).map(e => ({ 'Cumple': 1, 'Parcial': 0.5, 'No cumple': 0 }[e.estado])); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length * 100) : null; }
function guiaHTML(letra, abierta) {
  const g = (window.GUIAS && GUIAS.PHR_GUIA[letra]); if (!g) return '';
  return `<details class="guia"${abierta ? ' open' : ''}><summary><span class="ms" style="font-size:18px">lightbulb</span>Cómo completar esta sección</summary><div class="g-in">
    <p><b>Qué se evalúa:</b> ${S.esc(g.que)}</p><p><b>Qué pedir o mirar:</b> ${S.esc(g.pedir)}</p>
    <div class="crit"><b style="color:#1E5223">Cumple</b><span>${S.esc(g.c)}</span><b style="color:#5E4B00">Parcial</b><span>${S.esc(g.p)}</span><b style="color:#7A1F1F">No cumple</b><span>${S.esc(g.nc)}</span></div></div></details>`;
}
function secNombre(letra) { const s = (cat.secciones || []).find(x => x[0] === letra); return s ? s[1] : letra; }

/* ---------- sincronización ---------- */
function pintarSync() {
  const b = $('#btnSync'); if (!S.sesion.token()) { b.classList.add('oculto'); return; }
  b.classList.remove('oculto');
  const n = cola.length, off = !navigator.onLine;
  let ic = 'cloud_done', t = 'Sincronizado';
  if (sincronizando) { ic = 'sync'; t = 'Enviando…'; } else if (n && off) { ic = 'cloud_off'; t = n + ' sin enviar'; }
  else if (n && ultimoError) { ic = 'error'; t = n + ' con error'; } else if (n) { ic = 'cloud_upload'; t = n + ' por enviar'; } else if (off) { ic = 'cloud_off'; t = 'Sin señal'; }
  b.innerHTML = `<span class="ms">${ic}</span>${t}`; b.title = ultimoError || '';
}
let temporizador = null;
function programarSync(ms) { clearTimeout(temporizador); temporizador = setTimeout(sincronizar, ms == null ? 1500 : ms); }
async function sincronizar(manual) {
  if (sincronizando || !S.sesion.token()) return;
  if (!navigator.onLine) { pintarSync(); if (manual) toast('Sin conexión. Los cambios quedan guardados en este dispositivo.'); return; }
  if (!cola.length) { if (manual) await actualizarCatalogo(true); return; }
  sincronizando = true; ultimoError = ''; pintarSync(); cola.forEach(c => delete c.error);
  try {
    for (let v = 0; v < 20; v++) {
      const lote = cola.filter(c => c.tipo === 'item' && !c.error).slice(0, 40);
      if (lote.length) {
        const r = await S.api('phr_guardar', { items: lote });
        if (!r.ok) throw r;
        r.resultados.forEach(x => { const it = cola.find(c => c.uid === x.uid); if (x.ok) { cola = cola.filter(c => c.uid !== x.uid); if (x.fila && it) reemplazar(it.red, x.fila); } else { ultimoError = x.error; if (it) it.error = x.error; } });
      }
      for (const it of cola.filter(c => c.tipo === 'estado' && !c.error)) {
        const r = await S.api('phr_estado', it);
        if (r.ok) cola = cola.filter(c => c.uid !== it.uid); else if (r.sesion) throw r; else { it.error = r.error; ultimoError = r.error; }
      }
      guardarCat(); guardarCola();
      if (!cola.some(c => !c.error)) break;
    }
    if (manual && !ultimoError) toast('Todo enviado a la planilla.');
  } catch (e) {
    if (e && e.sesion) { toast(e.error); sincronizando = false; S.sesion.cerrar(); return ir('#/ingreso'); }
    ultimoError = (e && (e.error || e.message)) || 'No se pudo conectar.';
  } finally { sincronizando = false; pintarSync(); render(); }
}
function reemplazar(redN, fila) {
  const r = red(redN); if (!r) return;
  if (cola.some(c => c.tipo === 'item' && c.red === redN && c.codigo === fila.codigo && c.id === fila.id)) return;
  const i = r.relevamiento.findIndex(e => e.codigo === fila.codigo && e.id === fila.id);
  if (i >= 0) r.relevamiento[i] = fila;
}
async function actualizarCatalogo(avisar) {
  if (!navigator.onLine) { if (avisar) toast('Sin conexión: se muestran los últimos datos guardados.'); return; }
  try {
    const r = await S.api('phr_catalogo');
    if (!r.ok) { if (r.sesion) { S.sesion.cerrar(); toast(r.error); return ir('#/ingreso'); } throw r; }
    cat = r; cola.filter(c => c.tipo === 'item').forEach(aplicarLocal); cola.filter(c => c.tipo === 'estado').forEach(aplicarEstadoLocal);
    guardarCat(); if (avisar) toast('Datos actualizados.'); render();
  } catch (e) {
    const m = (e && (e.error || e.message)) || 'No se pudo actualizar.';
    if (!cat) app.innerHTML = `<div class="tarjeta vacio">${S.esc(m)}</div>`; else if (avisar) toast(m);
  }
}
function aplicarLocal(it) {
  const r = red(it.red); const e = r && r.relevamiento.find(x => x.codigo === it.codigo && x.id === it.id); if (!e) return;
  e.aplica = it.aplica; e.estado = it.aplica === 'No aplica' ? '' : it.estado;
  ['evidencia', 'brecha', 'responsable', 'prioridad', 'fecha', 'relevador'].forEach(k => e[k] = it[k] || '');
}
function aplicarEstadoLocal(it) { const r = red(it.red), e = r && r.establecimientos.find(x => x.codigo === it.codigo); if (e) ['referente', 'fecha', 'estado'].forEach(k => { if (it[k] != null) e[k] = it[k]; }); }
function encolar(it) { const k = c => c.tipo + '|' + c.red + '|' + c.codigo + '|' + (c.id || ''); cola = cola.filter(c => k(c) !== k(it)); cola.push(it); guardarCola(); programarSync(); }

/* ---------- hoja de un ítem ---------- */
function abrirHoja(redN, codigo, id) {
  const r = red(redN), est = r.establecimientos.find(x => x.codigo === codigo), e = r.relevamiento.find(x => x.codigo === codigo && x.id === id);
  borrador = Object.assign({}, e, { red: redN, puede: est.puedeCargar !== false });
  if (!borrador.fecha) borrador.fecha = S.hoy();
  if (!borrador.relevador) borrador.relevador = (S.sesion.usuario() || {}).nombre || '';
  pintarHoja(); $('#hoja').classList.remove('oculto'); document.body.style.overflow = 'hidden';
}
function cerrarHoja() { $('#hoja').classList.add('oculto'); $('#hoja').innerHTML = ''; document.body.style.overflow = ''; borrador = null; }
function pintarHoja() {
  const b = borrador, r = red(b.red), est = r.establecimientos.find(x => x.codigo === b.codigo), it = r.items.find(x => x.id === b.id) || {}, dis = b.puede ? '' : 'disabled';
  const idx = listaHoja.indexOf(b.id);
  const op = (campo, lista) => `<div class="opciones ${lista.length === 3 ? 'tres' : 'dos'}">${lista.map(v => `<button type="button" class="op" data-campo="${campo}" data-valor="${S.esc(v)}" aria-pressed="${b[campo] === v}" ${dis}>${S.esc(v)}</button>`).join('')}</div>`;
  $('#hoja').innerHTML = `<div class="hoja-in">
    <div class="hoja-cab"><b>${S.esc(b.id)} · ${S.esc(b.seccion.split('·').slice(1).join('·').trim())}<small>${S.esc(est.nombre)}</small></b><button class="icono" data-act="cerrarHoja" aria-label="Cerrar"><span class="ms">close</span></button></div>
    <div class="hoja-cuerpo">
      <div class="tarjeta contexto"><p style="font-size:15px;color:#24343B"><b>${S.esc(b.item)}</b></p>
        ${it.evidencia ? `<p><b>Qué buscar:</b> ${S.esc(it.evidencia)}</p>` : ''}<p class="sub">Instructivo OPS 2023: ${S.esc(b.ref || it.ref || '')} · Aplica a: ${S.esc(it.aplicaA || 's/d')}</p></div>
      ${guiaHTML(b.seccion.charAt(0), false)}
      <div class="tarjeta dim"><h3>¿Aplica a este establecimiento?</h3>${op('aplica', ['Sí', 'No aplica'])}</div>
      ${b.aplica === 'No aplica' ? '' : `<div class="tarjeta dim"><h3>Estado</h3>${op('estado', EST)}
        <div class="desc">${{ 'Cumple': (GUIAS.PHR_GUIA[b.seccion.charAt(0)] || {}).c || 'Existe, está vigente y hay evidencia.', 'Parcial': (GUIAS.PHR_GUIA[b.seccion.charAt(0)] || {}).p || 'Existe en parte o está desactualizado.', 'No cumple': (GUIAS.PHR_GUIA[b.seccion.charAt(0)] || {}).nc || 'No existe o no se pudo verificar.' }[b.estado] || 'Elegí una opción. Ante la duda, el estado más bajo.'}</div></div>
      <div class="tarjeta dim"><h3>Registro</h3>
        <label class="campo"><span>Evidencia encontrada</span><textarea data-texto="evidencia" ${dis} placeholder="Documento, fecha, acta, registro…">${S.esc(b.evidencia)}</textarea></label>
        <label class="campo"><span>Brecha u observación</span><textarea data-texto="brecha" ${dis}>${S.esc(b.brecha)}</textarea></label>
        <div class="rejilla"><label class="campo"><span>Responsable propuesto</span><input data-texto="responsable" value="${S.esc(b.responsable)}" ${dis} placeholder="Área o cargo"></label>
        <div class="campo"><span>Prioridad</span>${op('prioridad', ['Alta', 'Media', 'Baja'])}</div></div></div>`}
      <div class="tarjeta dim"><div class="rejilla"><label class="campo"><span>Fecha</span><input data-texto="fecha" value="${S.esc(b.fecha)}" placeholder="dd/mm/aaaa" ${dis}></label>
        <label class="campo"><span>Relevado por</span><input data-texto="relevador" value="${S.esc(b.relevador)}" ${dis}></label></div></div>
    </div>
    <div class="resultado"><div class="calc">${b.aplica === 'No aplica' ? '<span>El ítem no cuenta para el cumplimiento.</span>' : b.estado ? `<span>Estado</span>${chipEstado(b.estado)}<span>Puntaje <b>${{ 'Cumple': '1', 'Parcial': '0,5', 'No cumple': '0' }[b.estado]}</b></span>` : '<span class="aviso">Sin estado: se puede guardar y completar después.</span>'}</div>
      ${b.puede ? `<div class="acciones">${idx > 0 ? '<button class="btn sec" data-act="anterior" aria-label="Anterior"><span class="ms">chevron_left</span></button>' : ''}
        <button class="btn sec" data-act="guardar"><span class="ms">save</span>Guardar</button>
        ${idx >= 0 && idx < listaHoja.length - 1 ? '<button class="btn" data-act="siguiente"><span class="ms">save</span>Guardar y siguiente</button>' : ''}</div>` : '<p class="sub">Tu acceso es de consulta para este establecimiento.</p>'}</div></div>`;
}
function guardarBorrador() {
  const b = borrador, it = { tipo: 'item', uid: S.uid() };
  ['red', 'codigo', 'id', 'aplica', 'estado', 'evidencia', 'brecha', 'responsable', 'prioridad', 'fecha', 'relevador'].forEach(k => it[k] = b[k] || '');
  if (it.aplica === 'No aplica') { it.estado = ''; it.prioridad = ''; }
  aplicarLocal(it); guardarCat(); encolar(it);
  const r = red(b.red), est = r.establecimientos.find(x => x.codigo === b.codigo);
  if (est && /Pendiente|Convocado/.test(est.estado)) { const st = { tipo: 'estado', uid: S.uid(), red: b.red, codigo: b.codigo, estado: 'En curso' }; aplicarEstadoLocal(st); guardarCat(); encolar(st); }
}

/* ---------- eventos ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-ir],[data-act],[data-red],[data-filtro],[data-it],[data-campo],#btnMenu,#btnSync');
  if (!t) { if (!ev.target.closest('#menu')) $('#menu').classList.add('oculto'); return; }
  if (t.id === 'btnMenu') { $('#menu').classList.toggle('oculto'); return; }
  if (t.id === 'btnSync') { sincronizar(true); return; }
  if (t.dataset.ir) { ir(t.dataset.ir); window.scrollTo(0, 0); return; }
  if (t.dataset.red) { redActual = t.dataset.red; render(); return; }
  if (t.dataset.filtro) { filtro = t.dataset.filtro; render(); return; }
  if (t.dataset.it) { const p = location.hash.slice(2).split('/').map(decodeURIComponent); abrirHoja(p[1], p[2], t.dataset.it); return; }
  if (t.dataset.campo && borrador) { const v = t.dataset.valor; borrador[t.dataset.campo] = (t.dataset.campo === 'prioridad' && borrador.prioridad === v) ? '' : v; const sc = $('.hoja-cuerpo').scrollTop; pintarHoja(); $('.hoja-cuerpo').scrollTop = sc; return; }
  const a = t.dataset.act;
  if (a === 'cerrarHoja') return cerrarHoja();
  if (a === 'guardar') { guardarBorrador(); cerrarHoja(); toast(navigator.onLine ? 'Guardado.' : 'Guardado en el dispositivo: se envía al volver la señal.'); render(); return; }
  if (a === 'siguiente' || a === 'anterior') {
    if (a === 'siguiente') guardarBorrador();
    const i = listaHoja.indexOf(borrador.id) + (a === 'siguiente' ? 1 : -1), p = [borrador.red, borrador.codigo, listaHoja[i]];
    if (a === 'siguiente') render(); if (p[2]) abrirHoja(p[0], p[1], p[2]); else cerrarHoja(); return;
  }
  if (a === 'marcar') { const p = location.hash.slice(2).split('/').map(decodeURIComponent); const st = { tipo: 'estado', uid: S.uid(), red: p[1], codigo: p[2], estado: 'Relevado' }; aplicarEstadoLocal(st); guardarCat(); encolar(st); toast('Establecimiento marcado como relevado.'); render(); return; }
  if (a === 'actualizar') { $('#menu').classList.add('oculto'); if (cola.length) sincronizar(true).then(() => actualizarCatalogo(true)); else actualizarCatalogo(true); return; }
  if (a === 'ayuda') return ir('#/ayuda');
  if (a === 'salir') { $('#menu').classList.add('oculto'); if (cola.length && !confirm('Hay ' + cola.length + ' cambios sin enviar. Si salís ahora, se pierden. ¿Salir igual?')) return; S.sesion.cerrar(); cola = []; guardarCola(); cat = null; S.store.del(K + 'cat'); ir('#/ingreso'); }
});
document.addEventListener('input', ev => { const t = ev.target; if (t.dataset && t.dataset.texto && borrador) borrador[t.dataset.texto] = t.value; });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && borrador) cerrarHoja(); });
