<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emergencias y desastres · Inicio</title>
<meta name="description" content="Pantalla principal: STAR-H, ISH, PHR, Fuentes, COE y formularios para imprimir.">
<meta name="theme-color" content="#1B2A41">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0..1,0&display=block" rel="stylesheet">
<style>
:root{--fuerte:#1B2A41;--medio:#3AA0FF;--claro:#CFE9FF;--borde:#9CCFFF;--naranja:#1B2A41;--naranja-claro:#CFE9FF;
  --texto:#1B2A41;--suave:#44546C;--tenue:#5E6E86;--linea:#CFE9FF;--fondo:#F4FAFF;--papel:#fff;--radio:14px;
  --sombra:0 1px 2px rgba(27,42,65,.06),0 4px 14px rgba(27,42,65,.06)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--texto);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input{font:inherit;color:inherit}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:22px;line-height:1;display:inline-block;vertical-align:middle;font-feature-settings:'liga';user-select:none}
.oculto{display:none!important}
.barra{background:var(--fuerte);color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 16px 22px}
.barra-in{max-width:960px;margin:0 auto;display:flex;gap:12px;align-items:flex-start}
.barra h1{font-size:20px;margin:0;line-height:1.2;flex:1}
.barra h1 small{display:block;font-size:13px;font-weight:500;opacity:.85;margin-top:4px}
.sesion{display:flex;gap:8px;align-items:center;font-size:12.5px;white-space:nowrap}
.sesion button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:999px;padding:7px 12px;font-weight:600;cursor:pointer}
main{max-width:960px;margin:-10px auto 0;padding:0 16px 40px}
.tarjeta{background:var(--papel);border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra)}
.ingreso{padding:16px;margin-bottom:14px;display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.ingreso h2{grid-column:1/-1;font-size:15px;margin:0;color:var(--fuerte)}
.ingreso label span{display:block;font-size:12px;font-weight:600;color:var(--suave);margin-bottom:4px}
.ingreso input{width:100%;border:1px solid #9CCFFF;border-radius:10px;padding:10px 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--fuerte);color:#fff;min-height:44px}
.msg{grid-column:1/-1;font-size:13px;padding:8px 10px;border-radius:8px;background:#FFC9CB;color:#1B2A41}
.rejilla{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mod{position:relative;display:flex;flex-direction:column;gap:6px;padding:18px 18px 14px;text-decoration:none;color:inherit;min-height:168px;transition:transform .12s,box-shadow .12s;border-top:5px solid var(--c,var(--fuerte))}
.mod:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(27,42,65,.08),0 10px 24px rgba(27,42,65,.1)}
.mod .num{position:absolute;top:12px;right:14px;font-size:12px;font-weight:800;color:var(--tenue)}
.mod .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--cc,var(--claro));color:var(--c,var(--fuerte))}
.mod .ico .ms{font-size:26px}
.mod b{font-size:17px;color:#1B2A41;margin-top:4px}
.mod p{margin:0;font-size:13px;color:var(--suave);flex:1}
.mod .pie{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.mod .pie a{color:var(--c,var(--fuerte));font-weight:700;text-decoration:none}
.candado{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:#F4FAFF;color:var(--suave)}
.candado .ms{font-size:15px}
.nota{font-size:12.5px;color:var(--tenue);margin:18px 2px 0}
footer{text-align:center;padding:10px 16px 28px}footer img{width:min(340px,80%)}footer p{font-size:11.5px;color:var(--tenue);margin:6px 0 0}
@media (max-width:820px){.rejilla{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.rejilla{grid-template-columns:1fr}.mod{min-height:0}.ingreso{grid-template-columns:1fr}.barra h1{font-size:18px}}
/* Paleta del sitio (alerta de triaje): #F4FAFF #CFE9FF #3AA0FF #FF5A5F #1B2A41. Coral solo para errores y alta prioridad. */
:root{--fuerte:#1B2A41;--medio:#3AA0FF;--claro:#CFE9FF;--borde:#9CCFFF;--texto:#1B2A41;--suave:#44546C;--tenue:#5E6E86;--linea:#CFE9FF;--fondo:#F4FAFF}
body{background:#F4FAFF}
.barra{background:#1B2A41;color:#F4FAFF;border-bottom:3px solid #3AA0FF}
.tarjeta,.grupo{border-color:#CFE9FF}
.btn{background:#3AA0FF;color:#1B2A41}
.btn.sec{background:#fff;color:#1B2A41;border-color:#3AA0FF}
.btn.peligro{background:#fff;color:#1B2A41;border-color:#FF5A5F;box-shadow:inset 4px 0 0 #FF5A5F}
.msg{background:#fff;color:#1B2A41;border:1.5px solid #FF5A5F;box-shadow:inset 5px 0 0 #FF5A5F}
.toast{background:#1B2A41;color:#F4FAFF;border-left:5px solid #3AA0FF}
.mod{background:var(--bg)!important;color:var(--fg);border:0!important;border-radius:18px;overflow:hidden;min-height:184px;
  box-shadow:0 2px 4px rgba(27,42,65,.10),0 10px 26px rgba(27,42,65,.14)}
.mod:hover{transform:translateY(-3px);box-shadow:0 4px 8px rgba(27,42,65,.12),0 16px 34px rgba(58,160,255,.28)}
.mod:focus-visible{outline:3px solid #3AA0FF;outline-offset:3px}
.mod .num{color:var(--fg);opacity:.65}
.mod .ico{background:var(--chip)!important;color:var(--fg)!important;border-radius:14px}
.mod b{color:var(--fg);font-size:18px;position:relative}
.mod p{color:var(--fg);opacity:.88;position:relative}
.mod .pie{position:relative}
.mod .pie a{color:var(--fg)!important;background:var(--chip);padding:6px 11px;border-radius:999px}
.mod .pie a:hover{filter:brightness(1.1)}
.mod .fantasma{position:absolute;right:-14px;bottom:-22px;font-size:118px;color:var(--fg);opacity:.08;pointer-events:none}
.mod .candado{background:var(--chip);color:var(--fg)}
.sesion button{background:#3AA0FF;color:#1B2A41}
.ingreso h2{color:#1B2A41}
</style>
</head>
<body>
<header class="barra"><div class="barra-in">
  <h1>Emergencias y desastres<small>Comité de crisis El Niño 2026-2027 · Higiene y Seguridad Laboral</small></h1>
  <div class="sesion oculto" id="sesion"><span id="quien"></span><button id="btnSalir">Salir</button></div>
</div></header>
<main>
  <form class="tarjeta ingreso oculto" id="fIng">
    <h2>Ingresá una vez y entrás a todas las secciones habilitadas</h2>
    <label><span>DNI (sin puntos)</span><input name="dni" inputmode="numeric" autocomplete="username" required maxlength="10"></label>
    <label><span>Clave</span><input name="clave" type="password" autocomplete="current-password" required maxlength="40"></label>
    <button class="btn" type="submit"><span class="ms">login</span>Ingresar</button>
    <div class="msg oculto" id="msg"></div>
  </form>
  <div class="rejilla" id="rejilla"></div>
  <p class="nota">Los relevamientos complementan y no reemplazan el trabajo del Servicio de Higiene y Seguridad de cada establecimiento.</p>
</main>
<footer><img src="logo-hysl.png" alt="Hospitales más seguros para las personas"><p>Higiene y Seguridad Laboral</p></footer>
<script src="config.js"></script>
<script src="starh.js"></script>
<script>
(function () {
'use strict';
const S = window.STARH, $ = s => document.querySelector(s), E = S.esc;
// clave: flag del usuario que habilita la sección (null = abierta a todos)
const MODS = [
  { n: 1, t: 'STAR-H', d: 'Relevamiento estratégico de riesgos: amenazas, gravedad, impacto y nivel de riesgo por establecimiento.', ico: 'crisis_alert', href: 'starh.html', tab: 'tablero.html', flag: 'starh', bg: 'linear-gradient(135deg,#1B2A41 0%,#2E4A70 100%)', fg: '#F4FAFF', chip: 'rgba(244,250,255,.16)' },
  { n: 2, t: 'ISH', d: 'Índice de Seguridad Hospitalaria (OPS/OMS 2018): seguridad estructural, no estructural y gestión de emergencias.', ico: 'local_hospital', href: 'ish.html', tab: 'ish-tablero.html', flag: 'ish', bg: 'linear-gradient(135deg,#3AA0FF 0%,#6CB8FF 100%)', fg: '#1B2A41', chip: 'rgba(27,42,65,.12)' },
  { n: 3, t: 'PHR', d: 'Relevamiento inicial del plan hospitalario de respuesta a emergencias de salud y desastres (OPS 2023).', ico: 'fact_check', href: 'phr.html', tab: 'phr-tablero.html', flag: 'phr', bg: 'linear-gradient(135deg,#1B2A41 0%,#2C5C93 100%)', fg: '#F4FAFF', chip: 'rgba(244,250,255,.16)' },
  { n: 4, t: 'Fuentes', d: 'Bibliografía y normativa en que se basan los relevamientos, con enlaces.', ico: 'menu_book', href: 'fuentes.html', flag: null, bg: 'linear-gradient(135deg,#CFE9FF 0%,#F4FAFF 100%)', fg: '#1B2A41', chip: 'rgba(27,42,65,.08)' },
  { n: 5, t: 'COE', d: 'Participantes del comité y del centro de operaciones de emergencia: datos, contactos, proyectos y funciones.', ico: 'groups', href: 'coe.html', flag: 'coe', bg: 'linear-gradient(135deg,#9CCFFF 0%,#3AA0FF 100%)', fg: '#1B2A41', chip: 'rgba(27,42,65,.12)' },
  { n: 6, t: 'Formularios para imprimir', d: 'Formularios de campo de STAR-H, PHR e ISH, en blanco o con lo cargado, por establecimiento.', ico: 'print', href: 'imprimir.html', flag: null, bg: 'linear-gradient(135deg,#2E4A70 0%,#1B2A41 100%)', fg: '#F4FAFF', chip: 'rgba(244,250,255,.16)' },
  { n: 7, t: 'Evacuación hospitalaria', d: 'Fichas de cada establecimiento y dependencia para los planes de evacuación: población, edificio, salidas, gases, incendio y organización.', ico: 'directions_run', href: 'evac.html', flag: 'evac', bg: 'linear-gradient(135deg,#FF5A5F 0%,#FF8A8D 100%)', fg: '#1B2A41', chip: 'rgba(27,42,65,.12)' }
];
function pintar() {
  const u = S.sesion.token() ? (S.sesion.usuario() || {}) : null;
  $('#fIng').classList.toggle('oculto', !!u);
  $('#sesion').classList.toggle('oculto', !u);
  if (u) $('#quien').textContent = (u.nombre || '') + (u.rol ? ' · ' + u.rol : '');
  $('#rejilla').innerHTML = MODS.map(m => {
    const cerrado = u && m.flag && u[m.flag] === false;
    return `<div class="tarjeta mod" role="link" tabindex="0" data-href="${m.href}" aria-label="${E(m.n + '. ' + m.t)}" style="--bg:${m.bg};--fg:${m.fg};--chip:${m.chip};cursor:pointer"><span class="ms fantasma" aria-hidden="true">${m.ico}</span>
      <span class="num">${m.n}</span><span class="ico"><span class="ms">${m.ico}</span></span>
      <b>${E(m.t)}</b><p>${E(m.d)}</p>
      <span class="pie">${cerrado ? `<span class="candado"><span class="ms">lock</span>${m.flag === 'ish' ? 'Solo Administración por ahora' : 'Sin acceso con tu usuario'}</span>` : ''}
      ${m.tab && !cerrado ? `<a href="${m.tab}"><span class="ms" style="font-size:17px">monitoring</span> Tablero</a>` : ''}</span></div>`;
  }).join('');
}
$('#fIng').addEventListener('submit', async ev => {
  ev.preventDefault(); const f = ev.target, b = f.querySelector('button'), m = $('#msg'); b.disabled = true; m.classList.add('oculto');
  try { const r = await S.api('login', { dni: f.dni.value, clave: f.clave.value }); if (!r.ok) throw r; S.sesion.guardar(r.token, r.usuario); f.reset(); pintar(); }
  catch (e) { m.textContent = (e && (e.error || e.message)) || 'No se pudo ingresar.'; m.classList.remove('oculto'); }
  finally { b.disabled = false; }
});
$('#rejilla').addEventListener('click', ev => { if (ev.target.closest('a')) return; const t = ev.target.closest('[data-href]'); if (t) location.href = t.dataset.href; });
$('#rejilla').addEventListener('keydown', ev => { const t = ev.target.closest('[data-href]'); if (t && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); location.href = t.dataset.href; } });
$('#btnSalir').addEventListener('click', () => { S.sesion.cerrar(); pintar(); });
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
pintar();
})();
</script>
</body>
</html>
