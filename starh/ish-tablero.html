<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ISH · Tablero</title>
<meta name="description" content="Tablero del Índice de Seguridad Hospitalaria por hospital y red.">
<meta name="theme-color" content="#172B4D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0..1,0&display=block" rel="stylesheet">
<style>
:root{--fuerte:#172B4D;--medio:#2F5BEA;--claro:#E4EAFB;--borde:#C5D1F2;--texto:#172B4D;--suave:#4B5B73;--tenue:#6B7A90;--linea:#E4EAFB;--fondo:#F5F7FB;--papel:#fff;--radio:12px;--sombra:0 1px 2px rgba(27,42,65,.06),0 4px 14px rgba(27,42,65,.06)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--texto);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14.5px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.ms{font-family:'Material Symbols Outlined';font-size:20px;line-height:1;display:inline-block;vertical-align:middle;font-feature-settings:'liga'}
.oculto{display:none!important}
.barra{position:sticky;top:0;z-index:20;background:var(--fuerte);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
.barra h1{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra h1 small{display:block;font-size:11.5px;font-weight:500;opacity:.85}
.icono{background:transparent;border:0;color:inherit;height:40px;padding:0 10px;border-radius:10px;display:inline-flex;gap:6px;align-items:center;cursor:pointer;font-weight:600;font-size:13px;text-decoration:none}
.icono:hover{background:rgba(255,255,255,.14)}
.demo{background:#E4EAFB;color:#172B4D;font-size:12.5px;padding:7px 16px;text-align:center;border-bottom:1px solid #C5D1F2}
main{max-width:1180px;margin:0 auto;padding:16px 16px 60px}
.tarjeta{background:var(--papel);border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra)}
.panel{padding:16px;margin-bottom:14px}
.panel h2{font-size:15.5px;margin:0 0 4px;color:var(--fuerte)}
.panel .nota{font-size:12.5px;color:var(--suave);margin:0 0 12px}
.controles{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tab{border:1px solid var(--linea);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--fuerte);color:#fff;border-color:var(--fuerte)}
.controles select{border:1px solid #C5D1F2;border-radius:10px;padding:8px 10px;background:#fff;max-width:100%}
.esp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{padding:14px}
.kpi b{display:block;font-size:26px;color:#172B4D;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--suave)}
.kpi .marca{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.niv{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.leyenda{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--suave);margin:0 0 10px}
.leyenda i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* barras apiladas */
.fila-b{display:grid;grid-template-columns:minmax(120px,260px) 1fr 44px;gap:10px;align-items:center;padding:5px 0}
.fila-b .nom{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pila{display:flex;gap:2px;height:16px;background:#F5F7FB;border-radius:4px;overflow:hidden}
.pila i{display:block;height:100%;min-width:2px;cursor:default}
.pila i:first-child{border-radius:4px 0 0 4px}.pila i:last-child{border-radius:0 4px 4px 0}
.fila-b .n{font-size:12.5px;color:var(--suave);text-align:right;font-variant-numeric:tabular-nums}
/* matriz */
.matriz{display:grid;grid-template-columns:auto repeat(5,1fr);gap:2px;font-size:12px}
.matriz .celda{aspect-ratio:1.6;display:grid;place-items:center;border-radius:6px;font-weight:800;font-size:15px;cursor:pointer;border:0;padding:0}
.matriz .celda.cero{opacity:.45;font-weight:500;font-size:12px;cursor:default}
.matriz .eje{display:grid;place-items:center;color:var(--suave);font-weight:600;padding:0 6px}
.matriz-tit{display:flex;justify-content:space-between;font-size:12px;color:var(--suave);margin-top:6px}
/* tablas */
.tabla-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--linea);text-align:left;vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--suave);font-weight:700;background:#F5F7FB;position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
.calor td.cel{text-align:center;font-weight:700;min-width:44px;border:2px solid #fff}
.calor td.cel.vacia{color:var(--tenue);font-weight:500}
.mas{margin-top:10px;background:none;border:0;color:var(--fuerte);font-weight:700;cursor:pointer;padding:4px 0}
.vacio{padding:28px;text-align:center;color:var(--suave)}
.tooltip{position:fixed;z-index:50;pointer-events:none;background:#172B4D;color:#fff;font-size:12.5px;padding:7px 10px;border-radius:8px;max-width:280px;box-shadow:var(--sombra)}
.ingreso{max-width:420px;margin:7vh auto 0;padding:26px 22px}
.campo{display:block;margin:14px 0}.campo span{display:block;font-size:12.5px;font-weight:600;color:var(--suave);margin-bottom:5px}
.campo input{width:100%;border:1px solid #C5D1F2;border-radius:10px;padding:11px 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--fuerte);color:#fff;min-height:44px;width:100%}
.msg{margin-top:12px;font-size:13.5px;padding:10px 12px;border-radius:10px;background:#FFE5CC;color:#172B4D}
.pie{font-size:12px;color:var(--tenue);margin-top:8px}
footer{text-align:center;padding:10px 16px 20px}footer img{width:min(340px,80%)}footer p{font-size:11.5px;color:var(--tenue);margin:6px 0 0}
body.embebido .barra,body.embebido footer,body.embebido .demo{display:none}
@media (max-width:860px){.dos{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.fila-b{grid-template-columns:110px 1fr 34px}.kpi b{font-size:22px}}
@media print{.barra,.controles button.imp,footer .no,.mas{display:none}body{background:#fff}.tarjeta{box-shadow:none;break-inside:avoid}main{padding:0}}
.cat{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;font-weight:800}
.kpi .cat{width:38px;height:38px;font-size:20px;float:right}
</style>
</head>
<body>
<header class="barra">
  <a class="icono" href="index.html" title="Inicio" aria-label="Inicio"><span class="ms">home</span></a>
  <h1 id="titulo">ISH · Tablero<small>Índice de Seguridad Hospitalaria</small></h1>
  <a class="icono" href="ish.html"><span class="ms">edit_note</span><span>Cargar</span></a>
  <button class="icono" id="btnAct" title="Actualizar"><span class="ms">refresh</span></button>
</header>
<main id="app"></main>
<footer><img src="logo-hysl.png" alt="Hospitales más seguros para las personas"><p>Higiene y Seguridad Laboral · Índice de Seguridad Hospitalaria OPS/OMS (2018)</p></footer>
<div id="tip" class="tooltip oculto" role="tooltip"></div>
<script src="config.js"></script>
<script src="starh.js"></script>
<script src="guias.js"></script>
<script>
(function () {
'use strict';
const S = window.STARH, G = window.GUIAS, $ = s => document.querySelector(s), app = $('#app'), E = S.esc;
const qs = new URLSearchParams(location.search);
if (qs.get('embebido') === '1') document.body.classList.add('embebido');
let datos = S.store.get('ish.tab', null), vista = S.store.get('ish.tab.vista', '');
const CATC = { A: ['#C8E6C9', '#1B5E20'], B: ['#FFF3C4', '#5D4500'], C: ['#FFD8B0', '#7A3300'] };
const celda = (v, tip) => `<td class="cel ${v == null ? 'vacia' : ''}" ${v == null ? '' : `style="background:${G.colorValor(v)};color:#172B4D"`} data-tip="${E(tip || '')}">${G.fmt2(v)}</td>`;
const catH = c => c ? `<span class="cat" style="background:${CATC[c.cat][0]};color:${CATC[c.cat][1]}">${c.cat}</span>` : '<span class="cat" style="background:#F5F7FB;color:#6B7A90">–</span>';
function tema(n) { const t = S.temaRed(n), r = document.documentElement.style; r.setProperty('--fuerte', t.fuerte); r.setProperty('--medio', t.medio); r.setProperty('--claro', t.claro); r.setProperty('--borde', t.borde); }
function leyenda() { return `<div class="leyenda">${G.ISH_GUIA.categorias.map(c => `<span><i style="background:${CATC[c.cat][0]};outline:1px solid ${CATC[c.cat][1]}55"></i>${c.cat} · ${String(c.min).replace('.', ',')} a ${String(c.max).replace('.', ',')}</span>`).join('')}</div>`; }

async function cargar(avisar) {
  if (!navigator.onLine) { if (!datos) app.innerHTML = '<div class="tarjeta vacio">Sin conexión y sin datos guardados en este dispositivo.</div>'; return; }
  $('#btnAct').disabled = true;
  try {
    const r = await S.api('ish_tablero');
    if (!r.ok) { if (r.sesion) { S.sesion.cerrar(); return render(); } throw r; }
    datos = r; S.store.set('ish.tab', r); render();
  } catch (e) { if (avisar || !datos) app.innerHTML = `<div class="tarjeta vacio">${E((e && (e.error || e.message)) || 'No se pudieron traer los datos.')}</div>`; }
  finally { $('#btnAct').disabled = false; }
}

function render() {
  if (!S.sesion.token()) return vistaIngreso();
  if (!datos) { app.innerHTML = '<div class="vacio">Cargando…</div>'; return; }
  const R = datos.redes;
  if (!R.length) { app.innerHTML = '<div class="tarjeta vacio">No hay planillas ISH activas o tu acceso no tiene hospitales asignados.</div>'; return; }
  const ops = R.map(r => r.nombre).concat(R.length > 1 ? ['Todos los hospitales'] : []);
  if (ops.indexOf(vista) < 0) vista = R.length > 1 ? 'Todos los hospitales' : R[0].nombre;
  S.store.set('ish.tab.vista', vista);
  const tabs = ops.length > 1 ? ops.map(o => `<button class="tab" data-vista="${E(o)}" aria-pressed="${o === vista}">${E(o)}</button>`).join('') : '';
  const imp = '<span class="esp"></span><button class="tab imp" data-act="imprimir"><span class="ms" style="font-size:18px">print</span> Imprimir</button>';
  const pie = `<p class="pie">Datos al ${new Date(datos.generado).toLocaleString('es-AR')}. Fuente: planillas ISH de cada red. Base: OPS/OMS, Índice de seguridad hospitalaria, Guía para evaluadores, 2.ª ed., 2018. Pesos: hoja PESOS de cada planilla.${navigator.onLine ? '' : ' Sin conexión: últimos datos guardados.'}</p>`;
  const lista = vista === 'Todos los hospitales' ? R : R.filter(r => r.nombre === vista);
  tema(vista === 'Todos los hospitales' ? 'Secretaría' : vista);
  $('#titulo').innerHTML = `ISH · ${E(vista)}<small>Índice de Seguridad Hospitalaria</small>`;
  app.innerHTML = `<div class="controles">${tabs}${imp}</div>` + vistaHosp(lista) + pie;
}

function vistaHosp(R) {
  const H = []; R.forEach(r => r.establecimientos.forEach(e => H.push({ r, e, c: G.ishCalcular(r, e.codigo) })));
  let h = `<div class="kpis" style="grid-template-columns:repeat(${Math.min(Math.max(H.length, 1), 4)},1fr)">${H.map(x => `<div class="tarjeta kpi" style="border-top:4px solid ${S.temaRed(x.r.nombre).fuerte}">${catH(x.c.categoria)}
    <span style="font-weight:700;color:${S.temaRed(x.r.nombre).fuerte}">${E(x.e.nombre)}</span><b>${G.fmt2(x.c.indice)}</b><span>índice · ${x.c.evaluados} de ${x.c.total} ítems · ${E(x.e.modelo || 'Modelo 1')}</span></div>`).join('')}</div>`;
  h += `<div class="tarjeta panel"><h2>Índice y módulos por hospital</h2><p class="nota">Valores de 0 a 1. El índice aparece cuando los módulos 2, 3 y 4 tienen datos. Se aplica solo a hospitales (la herramienta de la OPS/OMS está diseñada para hospitales).</p>${leyenda()}
    <div class="tabla-wrap"><table class="calor"><tr><th>Hospital</th><th class="c">Categoría</th><th class="c">Índice</th><th class="c">2 · Estructural</th><th class="c">3 · No estructural</th><th class="c">4 · Gestión</th><th>Qué significa</th></tr>
    ${H.map(x => `<tr><td>${E(x.e.nombre)}</td><td class="c">${catH(x.c.categoria)}</td>${celda(x.c.indice, x.e.nombre + ': índice')}${['2', '3', '4'].map(m => celda(x.c.mod[m], x.e.nombre + ' · módulo ' + m)).join('')}<td style="font-size:12px">${x.c.categoria ? E(x.c.categoria.texto) : 's/d'}</td></tr>`).join('')}</table></div></div>`;
  const subs = datos.submodulos;
  h += `<div class="tarjeta panel"><h2>Submódulos</h2><p class="nota">Promedio ponderado de los ítems evaluados de cada submódulo. Los valores bajos marcan dónde concentrar las intervenciones.</p>
    <div class="tabla-wrap"><table class="calor"><tr><th>Submódulo</th>${H.map(x => `<th class="c">${E(x.e.codigo)}</th>`).join('')}</tr>
    ${subs.map(s => `<tr><td><b>${E(s[0])}</b> · ${E(s[2])}</td>${H.map(x => celda(x.c.sub[s[0]], x.e.nombre + ' · ' + s[2])).join('')}</tr>`).join('')}</table></div></div>`;
  // ítems con seguridad baja
  const bajos = [];
  H.forEach(x => x.r.relevamiento.filter(i => i.codigo === x.e.codigo && i.nivel === 'Bajo').forEach(i => bajos.push({ x, i })));
  h += `<div class="tarjeta panel"><h2>Ítems con seguridad baja</h2><p class="nota">Base para el plan de intervenciones; las medidas las define cada hospital con su conducción.</p>
    ${bajos.length ? `<div class="tabla-wrap"><table><tr><th>Hospital</th><th>N.º</th><th>Submódulo</th><th>Ítem</th><th>Observaciones</th></tr>${bajos.map(b => `<tr><td>${E(b.x.e.codigo)}</td><td>${E(b.i.n)}</td><td>${E(b.i.sub)}</td><td>${E(b.i.item)}</td><td>${E(b.i.obs || '')}</td></tr>`).join('')}</table></div>` : '<div class="vacio">Todavía no hay ítems con seguridad baja.</div>'}</div>`;
  // amenazas
  const am = [];
  H.forEach(x => x.r.amenazas.filter(a => a.codigo === x.e.codigo && (a.nivel === 'Alto' || a.nivel === 'Medio')).forEach(a => am.push({ x, a })));
  h += `<div class="tarjeta panel"><h2>Módulo 1 · Amenazas de nivel medio o alto</h2><p class="nota">No suman al índice: indican frente a qué tiene que estar preparado cada hospital.</p>
    ${am.length ? `<div class="tabla-wrap"><table><tr><th>Hospital</th><th>Grupo</th><th>Amenaza</th><th class="c">Nivel</th><th class="c">Prepararse</th><th>Observaciones</th></tr>${am.sort((p, q) => (q.a.nivel === 'Alto') - (p.a.nivel === 'Alto')).map(b => `<tr><td>${E(b.x.e.codigo)}</td><td>${E(b.a.grupo)}</td><td>${E(b.a.amenaza)}</td><td class="c"><b>${E(b.a.nivel)}</b></td><td class="c">${E(b.a.prepararse || '')}</td><td>${E(b.a.obs || '')}</td></tr>`).join('')}</table></div>` : '<div class="vacio">Todavía no hay amenazas cargadas con nivel medio o alto.</div>'}</div>`;
  return h;
}

function vistaIngreso() {
  tema('');
  app.innerHTML = `<form class="tarjeta ingreso" id="fIng"><h2 style="color:var(--fuerte);margin:0 0 4px">Tablero ISH</h2><p style="color:var(--suave);font-size:13px">Ingresá con el mismo DNI y clave de las apps. Por ahora es solo para Administración.</p>
    <label class="campo"><span>DNI (sin puntos)</span><input name="dni" inputmode="numeric" autocomplete="username" required></label>
    <label class="campo"><span>Clave</span><input name="clave" type="password" autocomplete="current-password" required maxlength="40"></label>
    <button class="btn" type="submit">Ingresar</button><div id="m" class="msg oculto"></div></form>`;
  $('#fIng').addEventListener('submit', async ev => {
    ev.preventDefault(); const f = ev.target, m = $('#m');
    try { const r = await S.api('login', { dni: f.dni.value, clave: f.clave.value }); if (!r.ok) throw r; S.sesion.guardar(r.token, r.usuario); app.innerHTML = '<div class="vacio">Cargando…</div>'; cargar(true); }
    catch (e) { m.textContent = (e && (e.error || e.message)) || 'No se pudo ingresar.'; m.classList.remove('oculto'); }
  });
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-vista],[data-act]'); if (!t) return;
  if (t.dataset.vista) { vista = t.dataset.vista; render(); }
  else if (t.dataset.act === 'imprimir') window.print();
});
$('#btnAct').addEventListener('click', () => cargar(true));
const tip = $('#tip');
document.addEventListener('mousemove', ev => {
  const t = ev.target.closest && ev.target.closest('[data-tip]');
  if (!t || !t.dataset.tip) { tip.classList.add('oculto'); return; }
  tip.textContent = t.dataset.tip; tip.classList.remove('oculto');
  tip.style.left = Math.max(8, Math.min(ev.clientX + 12, innerWidth - tip.offsetWidth - 8)) + 'px';
  tip.style.top = (ev.clientY + 14 + tip.offsetHeight > innerHeight ? ev.clientY - tip.offsetHeight - 10 : ev.clientY + 14) + 'px';
});
document.addEventListener('scroll', () => tip.classList.add('oculto'), { passive: true });
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
if (S.sesion.token()) cargar(false);
})();
</script>
</body>
</html>
