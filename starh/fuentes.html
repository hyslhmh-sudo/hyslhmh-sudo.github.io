<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuentes · Emergencias y desastres</title>
<meta name="description" content="Bibliografía y normativa de STAR-H, PHR, ISH y COE.">
<meta name="theme-color" content="#1B2A41">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0..1,0&display=block" rel="stylesheet">
<style>
:root{--fuerte:#1B2A41;--medio:#3AA0FF;--claro:#CFE9FF;--texto:#1B2A41;--suave:#44546C;--tenue:#5E6E86;--linea:#CFE9FF;--fondo:#F4FAFF}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--texto);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;line-height:1.5}
.ms{font-family:'Material Symbols Outlined';font-size:20px;line-height:1;display:inline-block;vertical-align:middle;font-feature-settings:'liga'}
.barra{position:sticky;top:0;background:var(--fuerte);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
.barra h1{font-size:16px;margin:0;flex:1}.barra h1 small{display:block;font-size:11.5px;font-weight:500;opacity:.85}
.icono{color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;font-weight:600;font-size:13px}
.icono:hover{background:rgba(255,255,255,.14)}
main{max-width:860px;margin:0 auto;padding:16px 16px 40px}
.grupo{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:6px 18px 10px;margin-bottom:14px}
.grupo h2{font-size:15px;color:var(--fuerte);margin:12px 0 4px;display:flex;align-items:center;gap:8px}
ol{margin:0;padding-left:20px}
li{padding:8px 0;border-bottom:1px solid var(--linea);font-size:14px}
li:last-child{border-bottom:0}
li a{color:var(--fuerte);font-weight:700;font-size:13px;word-break:break-word}
li small{display:block;color:var(--suave);font-size:12.5px;margin-top:2px}
.pie{font-size:12px;color:var(--tenue)}
footer{text-align:center;padding:10px 16px 28px}footer img{width:min(340px,80%)}
@media print{.barra .icono{display:none}}
/* Paleta del sitio (alerta de triaje): #F4FAFF #CFE9FF #3AA0FF #FF5A5F #1B2A41. Coral solo para errores y alta prioridad. */
:root{--fuerte:#1B2A41;--medio:#3AA0FF;--claro:#CFE9FF;--borde:#9CCFFF;--texto:#1B2A41;--suave:#44546C;--tenue:#5E6E86;--linea:#CFE9FF;--fondo:#F4FAFF}
body{background:#F4FAFF}
.barra{background:#1B2A41;color:#F4FAFF;border-bottom:3px solid #3AA0FF}
.tarjeta,.grupo{border-color:#CFE9FF}
.btn{background:#3AA0FF;color:#1B2A41}
.btn.sec{background:#fff;color:#1B2A41;border-color:#3AA0FF}
.btn.peligro{background:#fff;color:#1B2A41;border-color:#FF5A5F;box-shadow:inset 4px 0 0 #FF5A5F}
.msg{background:#fff;color:#1B2A41;border:1.5px solid #FF5A5F;box-shadow:inset 5px 0 0 #FF5A5F}
.toast{background:#1B2A41;color:#F4FAFF;border-left:5px solid #3AA0FF}
.grupo h2{color:#1B2A41}
li a{color:#1B2A41;text-decoration:underline;text-decoration-color:#3AA0FF}
</style>
</head>
<body>
<header class="barra">
  <a class="icono" href="index.html" aria-label="Inicio"><span class="ms">home</span></a>
  <h1>Fuentes<small>Bibliografía y normativa de los relevamientos</small></h1>
  <a class="icono" href="#" onclick="window.print();return false"><span class="ms">print</span></a>
</header>
<main id="app"><p class="pie">Cargando…</p></main>
<footer><img src="logo-hysl.png" alt="Hospitales más seguros para las personas"></footer>
<script src="config.js"></script>
<script src="starh.js"></script>
<script>
(function () {
'use strict';
const S = window.STARH, E = S.esc, app = document.getElementById('app');
// Respaldo sin conexión (la versión vigente se edita en la hoja FUENTES del libro)
const BASE = [
  ['STAR-H', 'OPS/OMS. Herramienta estratégica de evaluación de riesgos para establecimientos de salud (STAR-H). Washington, D.C.: Organización Panamericana de la Salud; 2023.', '', 'Base del relevamiento de amenazas y de las escalas A, B, C y D.'],
  ['STAR-H', 'OMS. Strategic toolkit for assessing risks (STAR): a comprehensive toolkit for all-hazards health emergency risk assessment. Ginebra: OMS; 2021.', '', 'Metodología general de la que deriva STAR-H.'],
  ['PHR', 'OPS. Instructivo para elaborar un plan hospitalario de respuesta a emergencias de salud y desastres (OPS/PHE/CPI/23-0015). Washington, D.C.: OPS; 2023.', 'https://educacionensalud.imss.gob.mx/p/portal/wp-content/uploads/2025/10/Instructivo-para-elaborar-un-plan-hospitalario-1.pdf', 'Copia publicada por el IMSS. Base de los 80 ítems del relevamiento inicial PHR.'],
  ['ISH', 'OPS/OMS. Índice de seguridad hospitalaria. Guía para evaluadores, 2.ª ed. Washington, D.C.: OPS; 2018.', 'https://www.salud.gob.ec/wp-content/uploads/2021/01/ISH-Guia-de-Evaluadores-2da-Edicion.pdf', 'Copia publicada por el Ministerio de Salud Pública de Ecuador. Cálculo, modelos de ponderación y categorías A, B y C.'],
  ['ISH', 'OPS/OMS. Índice de seguridad hospitalaria. Formularios para la evaluación, 2.ª ed. Washington, D.C.: OPS; 2018.', 'https://www.salud.gob.ec/wp-content/uploads/2021/01/ISH-Formularios-2da-Edicion.pdf', 'Copia publicada por el Ministerio de Salud Pública de Ecuador. Formulario 2: lista de verificación de 151 ítems.'],
  ['Evacuación', 'OPS. EVAC-H: Evacuación de hospitales y sus áreas críticas. Washington, D.C.: OPS; 2024.', 'https://www.paho.org/es/documentos/evac-h-evacuacion-hospitales-sus-areas-criticas', 'Clasificación de pacientes por movilidad, evacuación horizontal y vertical, zonas seguras, áreas críticas. Base de las fichas de dependencia.'],
  ['Evacuación', 'OPS/OMS. Índice de seguridad hospitalaria, 2.ª ed., 2018: Formulario 1 (información general acerca del hospital) e ítem 147 (plan de evacuación).', 'https://www.salud.gob.ec/wp-content/uploads/2021/01/ISH-Formularios-2da-Edicion.pdf', 'Base de la ficha del establecimiento.'],
  ['Evacuación', 'Decreto N.º 351/79, Anexo VII, capítulo 18: protección contra incendios y medios de escape.', '', ''],
  ['General', 'OPS. Hospitales seguros (iniciativa regional).', 'https://www.paho.org/es/emergencias-salud/hospitales-seguros', ''],
  ['General', 'OPS. Caja de herramientas de preparación para emergencias de salud.', 'https://www.paho.org/es/emergencias-salud/preparacion-paises-para-emergencias-salud-rsi/caja-herramientas-preparacion', ''],
  ['Normativa', 'Ley N.º 19.587 de Higiene y Seguridad en el Trabajo y su Decreto reglamentario N.º 351/79 (capítulo 18: protección contra incendios).', '', ''],
  ['Normativa', 'Resolución SRT N.º 905/2015, Anexo II, punto 2.2: funciones de los Servicios de Higiene y Seguridad en el Trabajo (planes de contingencia y emergencias).', '', '']
].map(x => ({ modulo: x[0], cita: x[1], enlace: x[2], nota: x[3] }));
const ORDEN = ['STAR-H', 'ISH', 'PHR', 'COE', 'Evacuación', 'General', 'Normativa'];
const ICO = { 'STAR-H': 'crisis_alert', ISH: 'local_hospital', PHR: 'fact_check', COE: 'groups', 'Evacuación': 'directions_run', General: 'public', Normativa: 'gavel' };
function pintar(lista, nota) {
  const g = {}; lista.forEach(f => (g[f.modulo || 'General'] = g[f.modulo || 'General'] || []).push(f));
  const claves = Object.keys(g).sort((a, b) => (ORDEN.indexOf(a) + 99) % 99 - (ORDEN.indexOf(b) + 99) % 99);
  app.innerHTML = claves.map(k => `<section class="grupo"><h2><span class="ms">${ICO[k] || 'description'}</span>${E(k)}</h2><ol>${g[k].map(f => `<li>${E(f.cita)}
    ${f.enlace ? `<br><a href="${E(f.enlace)}" target="_blank" rel="noopener">${E(f.enlace.replace(/^https?:\/\//, '').split('/')[0])} · abrir</a>` : ''}${f.nota ? `<small>${E(f.nota)}</small>` : ''}</li>`).join('')}</ol></section>`).join('')
    + `<p class="pie">${E(nota)} La lista se mantiene en la hoja FUENTES del libro «STAR-H y PHR · Tablero comparativo».</p>`;
}
const guardadas = S.store.get('fuentes', null);
pintar(guardadas || BASE, guardadas ? 'Últimos datos guardados.' : 'Lista base.');
if (!S.DEMO && navigator.onLine) S.api('fuentes').then(r => { if (r && r.ok && r.fuentes.length) { S.store.set('fuentes', r.fuentes); pintar(r.fuentes, 'Actualizado.'); } }).catch(() => {});
})();
</script>
</body>
</html>
