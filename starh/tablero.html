<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STAR-H · Tablero</title>
<meta name="description" content="Tablero de resultados del relevamiento STAR-H por red y comparativo entre redes.">
<meta name="theme-color" content="#B8441A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0..1,0&display=block" rel="stylesheet">
<style>
:root{--fuerte:#B8441A;--medio:#E8602A;--claro:#FDEDE4;--borde:#F3D3C2;--texto:#3A4A52;--suave:#6B7A82;--tenue:#8A979E;--linea:#E3E8EB;--fondo:#F6F7F8;--papel:#fff;--radio:12px;--sombra:0 1px 2px rgba(13,49,63,.06),0 4px 14px rgba(13,49,63,.06)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--texto);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14.5px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.ms{font-family:'Material Symbols Outlined';font-size:20px;line-height:1;display:inline-block;vertical-align:middle;font-feature-settings:'liga'}
.oculto{display:none!important}
.barra{position:sticky;top:0;z-index:20;background:var(--fuerte);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
.barra h1{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra h1 small{display:block;font-size:11.5px;font-weight:500;opacity:.85}
.icono{background:transparent;border:0;color:inherit;height:40px;padding:0 10px;border-radius:10px;display:inline-flex;gap:6px;align-items:center;cursor:pointer;font-weight:600;font-size:13px;text-decoration:none}
.icono:hover{background:rgba(255,255,255,.14)}
.demo{background:#FFF4CC;color:#5E4B00;font-size:12.5px;padding:7px 16px;text-align:center;border-bottom:1px solid #F0DE9C}
main{max-width:1180px;margin:0 auto;padding:16px 16px 60px}
.tarjeta{background:var(--papel);border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra)}
.panel{padding:16px;margin-bottom:14px}
.panel h2{font-size:15.5px;margin:0 0 4px;color:var(--fuerte)}
.panel .nota{font-size:12.5px;color:var(--suave);margin:0 0 12px}
.controles{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tab{border:1px solid var(--linea);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--fuerte);color:#fff;border-color:var(--fuerte)}
.controles select{border:1px solid #CBD3D8;border-radius:10px;padding:8px 10px;background:#fff;max-width:100%}
.esp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{padding:14px}
.kpi b{display:block;font-size:26px;color:#24343B;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--suave)}
.kpi .marca{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.niv{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.leyenda{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--suave);margin:0 0 10px}
.leyenda i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* barras apiladas */
.fila-b{display:grid;grid-template-columns:minmax(120px,260px) 1fr 44px;gap:10px;align-items:center;padding:5px 0}
.fila-b .nom{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pila{display:flex;gap:2px;height:16px;background:#F0F3F4;border-radius:4px;overflow:hidden}
.pila i{display:block;height:100%;min-width:2px;cursor:default}
.pila i:first-child{border-radius:4px 0 0 4px}.pila i:last-child{border-radius:0 4px 4px 0}
.fila-b .n{font-size:12.5px;color:var(--suave);text-align:right;font-variant-numeric:tabular-nums}
/* matriz */
.matriz{display:grid;grid-template-columns:auto repeat(5,1fr);gap:2px;font-size:12px}
.matriz .celda{aspect-ratio:1.6;display:grid;place-items:center;border-radius:6px;font-weight:800;font-size:15px;cursor:pointer;border:0;padding:0}
.matriz .celda.cero{opacity:.45;font-weight:500;font-size:12px;cursor:default}
.matriz .eje{display:grid;place-items:center;color:var(--suave);font-weight:600;padding:0 6px}
.matriz-tit{display:flex;justify-content:space-between;font-size:12px;color:var(--suave);margin-top:6px}
/* tablas */
.tabla-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--linea);text-align:left;vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--suave);font-weight:700;background:#FAFBFB;position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
.calor td.cel{text-align:center;font-weight:700;min-width:44px;border:2px solid #fff}
.calor td.cel.vacia{color:var(--tenue);font-weight:500}
.mas{margin-top:10px;background:none;border:0;color:var(--fuerte);font-weight:700;cursor:pointer;padding:4px 0}
.vacio{padding:28px;text-align:center;color:var(--suave)}
.tooltip{position:fixed;z-index:50;pointer-events:none;background:#24343B;color:#fff;font-size:12.5px;padding:7px 10px;border-radius:8px;max-width:280px;box-shadow:var(--sombra)}
.ingreso{max-width:420px;margin:7vh auto 0;padding:26px 22px}
.campo{display:block;margin:14px 0}.campo span{display:block;font-size:12.5px;font-weight:600;color:var(--suave);margin-bottom:5px}
.campo input{width:100%;border:1px solid #CBD3D8;border-radius:10px;padding:11px 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--fuerte);color:#fff;min-height:44px;width:100%}
.msg{margin-top:12px;font-size:13.5px;padding:10px 12px;border-radius:10px;background:#FCE8E6;color:#B3261E}
.pie{font-size:12px;color:var(--tenue);margin-top:8px}
footer{text-align:center;padding:10px 16px 20px}footer img{width:min(340px,80%)}footer p{font-size:11.5px;color:var(--tenue);margin:6px 0 0}
body.embebido .barra,body.embebido footer,body.embebido .demo{display:none}
@media (max-width:860px){.dos{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.fila-b{grid-template-columns:110px 1fr 34px}.kpi b{font-size:22px}}
@media print{.barra,.controles button.imp,footer .no,.mas{display:none}body{background:#fff}.tarjeta{box-shadow:none;break-inside:avoid}main{padding:0}}
</style>
</head>
<body>
<div id="demo" class="demo oculto">Modo demostración: datos de prueba. Clave: 123456.</div>
<header class="barra">
  <a class="icono" href="index.html" title="Inicio" aria-label="Inicio"><span class="ms">home</span></a>
  <h1 id="titulo">STAR-H · Tablero<small>Comité de crisis El Niño 2026-2027</small></h1>
  <a class="icono" href="starh.html" id="lnkApp"><span class="ms">edit_note</span><span>Cargar</span></a>
  <button class="icono" id="btnAct" title="Actualizar"><span class="ms">refresh</span></button>
</header>
<main id="app"></main>
<footer><img src="logo-hysl.png" alt="Hospitales más seguros para las personas"><p>Higiene y Seguridad Laboral · Metodología STAR-H (OPS, 2023)</p></footer>
<div id="tip" class="tooltip oculto" role="tooltip"></div>
<script src="config.js"></script>
<script src="demo-amenazas.js"></script>
<script src="starh.js"></script>
<script>
(function () {
'use strict';
const S = window.STARH, $ = s => document.querySelector(s), app = $('#app');
const qs = new URLSearchParams(location.search);
if (qs.get('embebido') === '1') document.body.classList.add('embebido');
if (S.DEMO) $('#demo').classList.remove('oculto');
const NIV = S.NIVELES;                     // de mayor a menor
const ELNINO = [['E01', 'Inundación por lluvias'], ['E02', 'Crecida del río'], ['E03', 'Tormenta severa'], ['E04', 'Viento fuerte'], ['E17', 'Corte de energía'], ['E19', 'Corte de agua'], ['E14', 'Brote hídrico o alimentario'], ['E15', 'Vectores o roedores']];
let datos = S.store.get(S.DEMO ? 'demo.tab' : 'tab', null);
let vista = S.store.get('tab.vista', ''), estSel = '', verTodas = false;

/* ---------- ayudas ---------- */
const E = S.esc;
const chip = n => n ? `<span class="niv" style="background:${S.COLOR_NIVEL[n]};color:${S.TINTA_NIVEL[n]}">${E(n)}</span>` : '<span class="pie">–</span>';
const chipTxt = (n, t) => `<span class="niv" style="background:${S.COLOR_NIVEL[n]};color:${S.TINTA_NIVEL[n]}">${E(t)}</span>`;
const celda = (n, txt, tip) => `<td class="cel ${n ? '' : 'vacia'}" ${n ? `style="background:${S.COLOR_NIVEL[n]};color:${S.TINTA_NIVEL[n]}"` : ''} data-tip="${E(tip || '')}">${txt}</td>`;
function nivelDe(r) { return r >= 17 ? 'Muy alto' : r >= 12 ? 'Alto' : r >= 7 ? 'Moderado' : r >= 4 ? 'Bajo' : r >= 1 ? 'Muy bajo' : ''; }
function tema(n) { const t = S.temaRed(n), r = document.documentElement.style; r.setProperty('--fuerte', t.fuerte); r.setProperty('--medio', t.medio); r.setProperty('--claro', t.claro); r.setProperty('--borde', t.borde); }
function leyenda() { return `<div class="leyenda">${NIV.map(n => `<span><i style="background:${S.COLOR_NIVEL[n]};outline:1px solid ${S.TINTA_NIVEL[n]}33"></i>${n}</span>`).join('')}</div>`; }
const obj = f => ({ codigo: f[0], id: f[1], origen: f[2], grupo: f[3], amenaza: f[4], aplica: f[5], A: f[6], grav: f[7], imp: Number(f[8]) || '', riesgo: f[9] === '' ? '' : Number(f[9]), nivel: f[10], cargada: f[11] === 1 });

/* ---------- datos ---------- */
async function cargar(avisar) {
  if (!navigator.onLine) { if (!datos) app.innerHTML = '<div class="tarjeta vacio">Sin conexión y sin datos guardados en este dispositivo.</div>'; return; }
  $('#btnAct').disabled = true;
  try {
    const r = await S.api('tablero');
    if (!r.ok) { if (r.sesion) { S.sesion.cerrar(); return render(); } throw r; }
    datos = r; S.store.set(S.DEMO ? 'demo.tab' : 'tab', r); render();
  } catch (e) { if (avisar || !datos) app.innerHTML = `<div class="tarjeta vacio">${E((e && (e.error || e.message)) || 'No se pudieron traer los datos.')}</div>`; }
  finally { $('#btnAct').disabled = false; }
}
function redesProc() {
  return datos.redes.map(r => {
    const filas = r.filas.map(obj);
    const nombre = {}; r.establecimientos.forEach(e => nombre[e.codigo] = e.nombre);
    return Object.assign({}, r, { filas: filas, nombreDe: c => nombre[c] || c });
  });
}
function resumenFilas(filas) {
  const cuenta = {}; NIV.forEach(n => cuenta[n] = 0);
  let cargadas = 0, aplican = 0;
  filas.forEach(f => { if (f.cargada) cargadas++; if (f.aplica !== 'No aplica') aplican++; if (f.nivel) cuenta[f.nivel]++; });
  return { cuenta: cuenta, cargadas: cargadas, total: filas.length, aplican: aplican, evaluadas: NIV.reduce((a, n) => a + cuenta[n], 0) };
}

/* ---------- vistas ---------- */
function render() {
  if (!S.sesion.token()) return vistaIngreso();
  if (!datos) { app.innerHTML = '<div class="vacio">Cargando…</div>'; return; }
  const u = datos.usuario || {}, R = redesProc();
  if (!R.length) { app.innerHTML = '<div class="tarjeta vacio">Tu acceso no tiene redes asignadas.</div>'; return; }
  const opciones = R.map(r => r.nombre).concat(u.comparativo && R.length > 1 ? ['Comparativo'] : []);
  if (opciones.indexOf(vista) < 0) vista = u.comparativo && R.length > 1 ? 'Comparativo' : R[0].nombre;
  S.store.set('tab.vista', vista);
  const tabs = opciones.length > 1 ? opciones.map(o => `<button class="tab" data-vista="${E(o)}" aria-pressed="${o === vista}">${o === 'Comparativo' ? '<span class="ms" style="font-size:18px">compare_arrows</span> ' : ''}${E(o)}</button>`).join('') : '';
  const pie = `<p class="pie">Datos al ${new Date(datos.generado).toLocaleString('es-AR')}. Fuente: planillas STAR-H de cada red.${navigator.onLine ? '' : ' Sin conexión: se muestran los últimos datos guardados.'}</p>`;
  if (vista === 'Comparativo') { tema('Secretaría'); $('#titulo').innerHTML = 'STAR-H · Comparativo entre redes<small>Reporte conjunto de Higiene y Seguridad Laboral</small>'; app.innerHTML = `<div class="controles">${tabs}<span class="esp"></span><button class="tab imp" data-act="imprimir"><span class="ms" style="font-size:18px">print</span> Imprimir</button></div>` + vistaComparativo(R) + pie; }
  else { const r = R.find(x => x.nombre === vista); tema(r.nombre); $('#titulo').innerHTML = `STAR-H · ${E(r.nombre)}<small>Resultados del relevamiento</small>`; app.innerHTML = `<div class="controles">${tabs}<select id="selEst" aria-label="Establecimiento"><option value="">Toda la red</option>${r.establecimientos.map(e => `<option value="${E(e.codigo)}" ${e.codigo === estSel ? 'selected' : ''}>${E(e.codigo + ' · ' + e.nombre)}</option>`).join('')}</select><span class="esp"></span><button class="tab imp" data-act="imprimir"><span class="ms" style="font-size:18px">print</span> Imprimir</button></div>` + vistaRed(r) + pie; }
  const s = $('#selEst'); if (s) s.addEventListener('change', () => { estSel = s.value; verTodas = false; render(); });
}

function kpis(items) { return `<div class="kpis">${items.map(k => `<div class="tarjeta kpi"><b>${k[0]}</b><span>${k[2] ? `<i class="marca" style="background:${S.COLOR_NIVEL[k[2]]};outline:1px solid ${S.TINTA_NIVEL[k[2]]}55"></i>` : ''}${k[1]}</span></div>`).join('')}</div>`; }

function barrasNivel(filasPorItem) {
  const max = Math.max(1, ...filasPorItem.map(x => x.res.evaluadas));
  return filasPorItem.map(x => `<div class="fila-b"><span class="nom" title="${E(x.nombre)}">${E(x.nombre)}</span>
    <div class="pila" style="width:${Math.max(4, x.res.evaluadas / max * 100)}%">${NIV.filter(n => x.res.cuenta[n]).map(n => `<i style="flex:${x.res.cuenta[n]};background:${S.COLOR_NIVEL[n]}" data-tip="${E(x.nombre)}: ${x.res.cuenta[n]} ${n.toLowerCase()}"></i>`).join('') || ''}</div>
    <span class="n">${x.res.evaluadas}</span></div>`).join('');
}

function vistaRed(r) {
  const est = estSel ? r.establecimientos.filter(e => e.codigo === estSel) : r.establecimientos;
  const filas = r.filas.filter(f => !estSel || f.codigo === estSel);
  const res = resumenFilas(filas);
  const completos = est.filter(e => /Evaluado|Validado/.test(e.estado)).length;
  let h = kpis([
    [estSel ? (est[0].estado || 's/d') : `${completos}/${est.length}`, estSel ? 'estado del relevamiento' : 'establecimientos evaluados'],
    [`${res.total ? Math.round(res.cargadas * 100 / res.total) : 0} %`, 'amenazas resueltas'],
    [res.cuenta['Muy alto'], 'riesgos muy altos', 'Muy alto'],
    [res.cuenta['Alto'], 'riesgos altos', 'Alto']]);

  // matriz probabilidad × impacto
  const m = {}; filas.filter(f => f.riesgo !== '').forEach(f => { const k = f.A + '|' + f.imp; (m[k] = m[k] || []).push(f); });
  let mat = '<div class="matriz"><div></div>' + [1, 2, 3, 4, 5].map(i => `<div class="eje">${i}</div>`).join('');
  for (let p = 5; p >= 1; p--) {
    mat += `<div class="eje">${p}</div>`;
    for (let i = 1; i <= 5; i++) {
      const l = m[p + '|' + i] || [], n = nivelDe(p * i);
      const tip = l.length ? `P ${p} × I ${i} = ${p * i} (${n}). ` + l.slice(0, 6).map(f => f.id + ' ' + f.amenaza + (estSel ? '' : ' · ' + f.codigo)).join('; ') + (l.length > 6 ? '…' : '') : `P ${p} × I ${i} = ${p * i} (${n}). Sin amenazas.`;
      mat += `<div class="celda ${l.length ? '' : 'cero'}" style="background:${S.COLOR_NIVEL[n]};color:${S.TINTA_NIVEL[n]}" data-tip="${E(tip)}">${l.length || ''}</div>`;
    }
  }
  mat += '</div><div class="matriz-tit"><span>↑ Probabilidad (A)</span><span>Impacto →</span></div>';

  // barras por establecimiento
  const porEst = est.map(e => ({ nombre: e.nombre, res: resumenFilas(r.filas.filter(f => f.codigo === e.codigo)) }))
    .sort((a, b) => (b.res.cuenta['Muy alto'] * 100 + b.res.cuenta['Alto']) - (a.res.cuenta['Muy alto'] * 100 + a.res.cuenta['Alto']));
  h += `<div class="dos"><div class="tarjeta panel"><h2>Matriz de probabilidad e impacto</h2><p class="nota">Cantidad de amenazas evaluadas en cada combinación. Pasá el cursor o tocá una celda para ver cuáles son.</p>${mat}</div>
    <div class="tarjeta panel"><h2>${estSel ? 'Amenazas por nivel de riesgo' : 'Nivel de riesgo por establecimiento'}</h2><p class="nota">Amenazas evaluadas según su nivel${estSel ? '' : ', ordenadas por cantidad de riesgos muy altos y altos'}.</p>${leyenda()}${barrasNivel(porEst)}</div></div>`;

  // amenazas prioritarias
  const porAm = {};
  filas.filter(f => f.riesgo !== '').forEach(f => {
    const a = porAm[f.id] = porAm[f.id] || { id: f.id, amenaza: f.amenaza, max: 0, altos: [], suma: 0, n: 0 };
    a.max = Math.max(a.max, f.riesgo); a.suma += f.riesgo; a.n++;
    if (f.nivel === 'Alto' || f.nivel === 'Muy alto') a.altos.push(r.nombreDe(f.codigo));
  });
  const lista = Object.values(porAm).sort((a, b) => b.max - a.max || b.altos.length - a.altos.length);
  const vis = verTodas ? lista : lista.slice(0, 12);
  h += `<div class="tarjeta panel"><h2>Amenazas prioritarias</h2><p class="nota">Ordenadas por riesgo máximo${estSel ? '' : ' en la red'}. El criterio de respuesta del procedimiento: muy alto, prioridad inmediata y revisión a los 3 meses; alto, incluir en el plan de respuesta y revisar a los 6 meses.</p>
    ${lista.length ? `<div class="tabla-wrap"><table><tr><th>ID</th><th>Amenaza</th><th class="num">Riesgo máx.</th><th>Nivel</th>${estSel ? '' : '<th class="num">Promedio</th><th>Establecimientos con riesgo alto o muy alto</th>'}</tr>
    ${vis.map(a => `<tr><td>${E(a.id)}</td><td>${E(a.amenaza)}</td><td class="num"><b>${a.max}</b></td><td>${chip(nivelDe(a.max))}</td>${estSel ? '' : `<td class="num">${(a.suma / a.n).toFixed(1).replace('.', ',')}</td><td>${a.altos.length ? `<b>${a.altos.length}</b> · ${E(a.altos.join('; '))}` : '<span class="pie">ninguno</span>'}</td>`}</tr>`).join('')}</table></div>
    ${lista.length > 12 ? `<button class="mas" data-act="todas">${verTodas ? 'Ver solo las 12 primeras' : 'Ver las ' + lista.length + ' amenazas evaluadas'}</button>` : ''}` : '<div class="vacio">Todavía no hay amenazas evaluadas.</div>'}</div>`;

  // El Niño
  h += `<div class="tarjeta panel"><h2>Amenazas asociadas a El Niño 2026-2027</h2><p class="nota">Riesgo de cada establecimiento frente a las amenazas cuya probabilidad aumenta con el fenómeno. «NA»: no aplica; «–»: sin evaluar.</p>
    <div class="tabla-wrap"><table class="calor"><tr><th>Establecimiento</th>${ELNINO.map(x => `<th class="c" title="${x[1]}">${x[0]}<br><span style="text-transform:none;font-weight:500">${x[1]}</span></th>`).join('')}</tr>
    ${est.map(e => `<tr><td>${E(e.nombre)}</td>${ELNINO.map(x => { const f = r.filas.find(y => y.codigo === e.codigo && y.id === x[0]);
      if (!f) return celda('', '·', 'No figura en el catálogo');
      if (f.aplica === 'No aplica') return celda('', 'NA', x[1] + ': no aplica');
      return f.riesgo === '' ? celda('', '–', x[1] + ': sin evaluar') : celda(f.nivel, f.riesgo, `${e.nombre} · ${x[1]}: riesgo ${f.riesgo} (${f.nivel})`); }).join('')}</tr>`).join('')}</table></div></div>`;

  // avance
  if (!estSel) h += `<div class="tarjeta panel"><h2>Avance del relevamiento</h2><div class="tabla-wrap"><table><tr><th>Código</th><th>Establecimiento</th><th>Estado</th><th>Referente</th><th>Reunión</th><th class="num">Resueltas</th><th class="num">Muy alto</th><th class="num">Alto</th></tr>
    ${r.establecimientos.map(e => { const x = resumenFilas(r.filas.filter(f => f.codigo === e.codigo)); return `<tr><td>${E(e.codigo)}</td><td>${E(e.nombre)}</td><td>${E(e.estado || 's/d')}</td><td>${E(e.referente || 's/d')}</td><td>${E(e.fechaReunion || 's/d')}</td><td class="num">${x.cargadas}/${x.total}</td><td class="num">${x.cuenta['Muy alto'] || ''}</td><td class="num">${x.cuenta['Alto'] || ''}</td></tr>`; }).join('')}</table></div></div>`;
  return h;
}

function vistaComparativo(R) {
  const res = R.map(r => {
    const x = resumenFilas(r.filas);
    const ev = r.filas.filter(f => f.riesgo !== '');
    return { r: r, x: x, prom: ev.length ? ev.reduce((a, f) => a + f.riesgo, 0) / ev.length : 0, completos: r.establecimientos.filter(e => /Evaluado|Validado/.test(e.estado)).length };
  });
  let h = `<div class="kpis" style="grid-template-columns:repeat(${Math.min(R.length, 4)},1fr)">${res.map(o => `<div class="tarjeta kpi" style="border-top:4px solid ${S.temaRed(o.r.nombre).fuerte}">
    <span style="font-weight:700;color:${S.temaRed(o.r.nombre).fuerte}">${E(o.r.nombre)}</span>
    <b>${o.x.total ? Math.round(o.x.cargadas * 100 / o.x.total) : 0} %</b><span>resuelto · ${o.completos}/${o.r.establecimientos.length} establecimientos evaluados</span>
    <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">${chipTxt('Muy alto', o.x.cuenta['Muy alto'] + ' muy alto')}${chipTxt('Alto', o.x.cuenta['Alto'] + ' alto')}</div>
    <span style="display:block;margin-top:6px">Riesgo promedio: ${o.prom ? o.prom.toFixed(1).replace('.', ',') : 's/d'}</span></div>`).join('')}</div>`;

  h += `<div class="tarjeta panel"><h2>Distribución de los riesgos por red</h2><p class="nota">Proporción de amenazas evaluadas en cada nivel. Las redes trabajan en forma independiente; la comparación ayuda a identificar necesidades comunes.</p>${leyenda()}
    ${res.map(o => `<div class="fila-b"><span class="nom">${E(o.r.nombre)}</span><div class="pila">${NIV.filter(n => o.x.cuenta[n]).map(n => `<i style="flex:${o.x.cuenta[n]};background:${S.COLOR_NIVEL[n]}" data-tip="${E(o.r.nombre)}: ${o.x.cuenta[n]} ${n.toLowerCase()} (${Math.round(o.x.cuenta[n] * 100 / o.x.evaluadas)} %)"></i>`).join('')}</div><span class="n">${o.x.evaluadas}</span></div>`).join('')}</div>`;

  // amenazas comunes
  const am = {};
  res.forEach(o => o.r.filas.filter(f => f.riesgo !== '').forEach(f => {
    const a = am[f.id] = am[f.id] || { id: f.id, amenaza: f.amenaza, por: {}, altos: 0 };
    const p = a.por[o.r.nombre] = a.por[o.r.nombre] || { max: 0, altos: 0 };
    p.max = Math.max(p.max, f.riesgo); if (f.nivel === 'Alto' || f.nivel === 'Muy alto') { p.altos++; a.altos++; }
  }));
  const lista = Object.values(am).map(a => Object.assign(a, { max: Math.max(...Object.values(a.por).map(p => p.max)), redesAltas: Object.values(a.por).filter(p => p.altos).length }))
    .sort((a, b) => b.redesAltas - a.redesAltas || b.max - a.max || b.altos - a.altos);
  const vis = verTodas ? lista : lista.slice(0, 15);
  h += `<div class="tarjeta panel"><h2>Amenazas comunes</h2><p class="nota">Riesgo máximo de cada amenaza en cada red, con la cantidad de establecimientos en nivel alto o muy alto. Primero, las que son altas en más de una red.</p>
    ${lista.length ? `<div class="tabla-wrap"><table class="calor"><tr><th>ID</th><th>Amenaza</th>${R.map(r => `<th class="c">${E(r.nombre)}</th>`).join('')}</tr>
    ${vis.map(a => `<tr><td>${E(a.id)}</td><td>${E(a.amenaza)}</td>${R.map(r => { const p = a.por[r.nombre]; return p ? celda(nivelDe(p.max), p.max + (p.altos ? ` <span style="font-weight:600">· ${p.altos} est.</span>` : ''), `${r.nombre} · ${a.amenaza}: máximo ${p.max} (${nivelDe(p.max)}); ${p.altos} establecimiento(s) en alto o muy alto`) : celda('', '–', r.nombre + ': sin evaluar'); }).join('')}</tr>`).join('')}</table></div>
    ${lista.length > 15 ? `<button class="mas" data-act="todas">${verTodas ? 'Ver solo las 15 primeras' : 'Ver las ' + lista.length + ' amenazas'}</button>` : ''}` : '<div class="vacio">Todavía no hay amenazas evaluadas.</div>'}</div>`;

  // El Niño
  h += `<div class="tarjeta panel"><h2>El Niño 2026-2027 en cada red</h2><p class="nota">Riesgo máximo y cantidad de establecimientos en nivel alto o muy alto.</p><div class="tabla-wrap"><table class="calor"><tr><th>Amenaza</th>${R.map(r => `<th class="c">${E(r.nombre)}</th>`).join('')}</tr>
    ${ELNINO.map(x => `<tr><td>${x[0]} · ${x[1]}</td>${R.map(r => { const l = r.filas.filter(f => f.id === x[0] && f.riesgo !== ''); if (!l.length) return celda('', '–', 'Sin evaluar'); const mx = Math.max(...l.map(f => f.riesgo)), al = l.filter(f => f.nivel === 'Alto' || f.nivel === 'Muy alto').length; return celda(nivelDe(mx), mx + ` <span style="font-weight:600">· ${al}/${r.establecimientos.length}</span>`, `${r.nombre}: máximo ${mx}; ${al} de ${r.establecimientos.length} establecimientos en alto o muy alto`); }).join('')}</tr>`).join('')}</table></div></div>`;

  // ranking de establecimientos
  const rk = [];
  R.forEach(r => r.establecimientos.forEach(e => { const x = resumenFilas(r.filas.filter(f => f.codigo === e.codigo)); if (x.evaluadas) rk.push({ red: r.nombre, e: e, x: x }); }));
  rk.sort((a, b) => (b.x.cuenta['Muy alto'] - a.x.cuenta['Muy alto']) || (b.x.cuenta['Alto'] - a.x.cuenta['Alto']));
  h += `<div class="tarjeta panel"><h2>Establecimientos con más riesgos altos y muy altos</h2><div class="tabla-wrap"><table><tr><th>Red</th><th>Establecimiento</th><th class="num">Muy alto</th><th class="num">Alto</th><th class="num">Evaluadas</th><th>Estado</th></tr>
    ${rk.slice(0, 10).map(o => `<tr><td>${E(o.red)}</td><td>${E(o.e.nombre)}</td><td class="num"><b>${o.x.cuenta['Muy alto']}</b></td><td class="num">${o.x.cuenta['Alto']}</td><td class="num">${o.x.evaluadas}</td><td>${E(o.e.estado || 's/d')}</td></tr>`).join('') || '<tr><td colspan="6" class="vacio">Sin datos.</td></tr>'}</table></div></div>`;
  return h;
}

function vistaIngreso() {
  tema('');
  app.innerHTML = `<form class="tarjeta ingreso" id="fIng"><h2 style="color:var(--fuerte);margin:0 0 4px">Tablero STAR-H</h2><p style="color:var(--suave);font-size:13px">Ingresá con el mismo DNI y clave de la app de relevamiento.</p>
    <label class="campo"><span>DNI (sin puntos)</span><input name="dni" inputmode="numeric" autocomplete="username" required></label>
    <label class="campo"><span>Clave</span><input name="clave" type="password" autocomplete="current-password" required maxlength="40"></label>
    <button class="btn" type="submit">Ingresar</button><div id="m" class="msg oculto"></div></form>`;
  $('#fIng').addEventListener('submit', async ev => {
    ev.preventDefault(); const f = ev.target, m = $('#m');
    try { const r = await S.api('login', { dni: f.dni.value, clave: f.clave.value }); if (!r.ok) throw r; S.sesion.guardar(r.token, r.usuario); app.innerHTML = '<div class="vacio">Cargando…</div>'; cargar(true); }
    catch (e) { m.textContent = (e && (e.error || e.message)) || 'No se pudo ingresar.'; m.classList.remove('oculto'); }
  });
}

/* ---------- eventos ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-vista],[data-act]');
  if (!t) return;
  if (t.dataset.vista) { vista = t.dataset.vista; estSel = ''; verTodas = false; render(); }
  else if (t.dataset.act === 'todas') { verTodas = !verTodas; render(); }
  else if (t.dataset.act === 'imprimir') window.print();
});
$('#btnAct').addEventListener('click', () => cargar(true));
const tip = $('#tip');
function mostrarTip(ev) {
  const t = ev.target.closest('[data-tip]');
  if (!t || !t.dataset.tip) { tip.classList.add('oculto'); return; }
  tip.textContent = t.dataset.tip; tip.classList.remove('oculto');
  const x = Math.min(ev.clientX + 12, innerWidth - tip.offsetWidth - 8), y = ev.clientY + 14 + tip.offsetHeight > innerHeight ? ev.clientY - tip.offsetHeight - 10 : ev.clientY + 14;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = y + 'px';
}
document.addEventListener('mousemove', mostrarTip);
document.addEventListener('touchstart', ev => mostrarTip(ev.touches[0] ? Object.assign({}, { target: ev.target, clientX: ev.touches[0].clientX, clientY: ev.touches[0].clientY }) : ev), { passive: true });
document.addEventListener('scroll', () => tip.classList.add('oculto'), { passive: true });

if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
if (S.sesion.token()) cargar(false);
})();
</script>
