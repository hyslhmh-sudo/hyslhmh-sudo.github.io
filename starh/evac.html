<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evacuación hospitalaria</title>
<meta name="description" content="Fichas por establecimiento y por dependencia para los planes de evacuación.">
<meta name="theme-color" content="#8E1B1B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0..1,0&display=block" rel="stylesheet">
<style>
:root{--fuerte:#172B4D;--medio:#2F5BEA;--claro:#E4EAFB;--borde:#C5D1F2;
  --texto:#172B4D;--suave:#4B5B73;--tenue:#6B7A90;--linea:#E4EAFB;--fondo:#F5F7FB;--papel:#fff;--radio:12px;
  --sombra:0 1px 2px rgba(27,42,65,.06),0 4px 14px rgba(27,42,65,.06)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--texto);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:20px;line-height:1;display:inline-block;vertical-align:middle;font-feature-settings:'liga';user-select:none}
.oculto{display:none!important}
.barra{position:sticky;top:0;z-index:20;background:var(--fuerte);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;display:flex;align-items:center;gap:6px}
.barra h1{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra h1 small{display:block;font-size:11.5px;font-weight:500;opacity:.85}
.icono{background:transparent;border:0;color:#fff;height:40px;min-width:40px;padding:0 8px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;text-decoration:none}
.icono:hover{background:rgba(255,255,255,.14)}
main{max-width:920px;margin:0 auto;padding:14px 16px 110px}
.tarjeta{background:var(--papel);border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra)}
h2{font-size:18px;margin:4px 0 10px;color:var(--fuerte)}
h3{font-size:15px;margin:16px 2px 8px;color:var(--fuerte)}
.sub{color:var(--suave);font-size:13px}
.redes{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.red-tab{border:1px solid var(--linea);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.red-tab[aria-pressed="true"]{background:var(--fuerte);color:#fff;border-color:var(--fuerte)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;background:var(--fuerte);color:#fff;min-height:44px;text-decoration:none}
.btn.sec{background:#fff;color:var(--fuerte);border-color:var(--borde)}
.btn.mini{min-height:32px;padding:5px 9px;font-size:12.5px}
.btn.peligro{background:#fff;color:#172B4D;border-color:#F57C00}
.btn:disabled{opacity:.5;cursor:default}
.lista{display:grid;gap:10px}
.est{padding:14px;display:grid;gap:7px;cursor:pointer;text-align:left;width:100%}
.est-cab{display:flex;gap:10px;align-items:flex-start}.est-cab b{flex:1;font-size:15px;color:#172B4D}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--claro);color:var(--fuerte);white-space:nowrap}
.chip.pend{background:#F5F7FB;color:var(--suave)}
.chip.ok{background:#2F5BEA;color:#FFFFFF}
.barra-prog{height:6px;border-radius:99px;background:#F5F7FB;overflow:hidden}.barra-prog i{display:block;height:100%;background:var(--medio)}
.pie{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--suave)}
.buscar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.buscar input,.buscar select{border:1px solid #C5D1F2;border-radius:10px;padding:9px 11px;background:#fff;min-height:42px}
.buscar input{flex:1;min-width:170px}
.volver{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--fuerte);font-weight:700;cursor:pointer;padding:6px 0;margin-bottom:6px}
.cab{padding:14px 16px;margin-bottom:12px;display:grid;gap:8px}
.cab h2{margin:0}
.acc{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
details.sec{margin-bottom:10px}
details.sec>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;font-weight:700;color:var(--fuerte)}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary small{font-weight:600;color:var(--suave);font-size:12px}
details.sec[open]>summary{border-bottom:1px solid var(--linea)}
.campos{padding:6px 14px 12px;display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.campo{display:block;margin:9px 0}
.campo.ancho{grid-column:1/-1}
.campo>span{display:block;font-size:12.5px;font-weight:700;color:#172B4D;margin-bottom:4px}
.campo>small{display:block;font-size:11.5px;color:var(--tenue);margin-top:3px}
.campo input,.campo select,.campo textarea{width:100%;border:1px solid #C5D1F2;border-radius:10px;padding:9px 11px;background:#fff}
.campo textarea{min-height:62px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--medio);box-shadow:0 0 0 3px var(--claro)}
.ops{display:flex;gap:6px;flex-wrap:wrap}
.op{border:1.5px solid #C5D1F2;background:#fff;border-radius:9px;padding:7px 11px;cursor:pointer;font-weight:600;font-size:13.5px}
.op[aria-pressed="true"]{border-color:var(--fuerte);background:var(--claro);color:var(--fuerte)}
.cambiado{border-color:#2F5BEA!important}
.flotante{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--linea);padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:10px;justify-content:center;align-items:center;box-shadow:0 -4px 14px rgba(27,42,65,.08)}
.dep{padding:12px 14px;display:flex;gap:10px;align-items:center;cursor:pointer;width:100%;text-align:left}
.dep b{flex:1;color:#172B4D}
.dlg{position:fixed;inset:0;z-index:40;background:rgba(20,30,35,.45);display:flex;justify-content:center;align-items:flex-end}
.dlg-in{background:var(--fondo);width:100%;max-width:760px;max-height:100%;height:100%;display:flex;flex-direction:column}
@media (min-width:800px){.dlg{align-items:center;padding:24px}.dlg-in{height:auto;max-height:94vh;border-radius:16px;overflow:hidden}}
.dlg-cab{background:var(--fuerte);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px 16px;display:flex;align-items:center;gap:8px}
.dlg-cab b{flex:1}
.dlg-cuerpo{overflow-y:auto;padding:12px 14px;flex:1}
.dlg-pie{background:#fff;border-top:1px solid var(--linea);padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 80px);transform:translateX(-50%);background:#172B4D;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:60;max-width:calc(100% - 32px)}
.vacio{padding:26px;text-align:center;color:var(--suave)}
.ingreso{max-width:420px;margin:7vh auto 0;padding:24px 22px}
.msg{margin-top:10px;font-size:13.5px;padding:9px 11px;border-radius:10px;background:#FFE5CC;color:#172B4D}
.ayuda{padding:16px 18px}.ayuda p,.ayuda li{font-size:14px}
footer{text-align:center;padding:10px 16px 24px}footer img{width:min(340px,80%)}footer p{font-size:11.5px;color:var(--tenue);margin:6px 0 0}
/* impresión */
.imp{display:none}
@media print{
  @page{size:A4;margin:14mm 12mm}
  body{background:#fff;font-size:9pt}
  .barra,main,footer,.flotante,.dlg,.toast{display:none!important}
  .imp{display:block}
  .imp h1{font-size:13pt;color:var(--fuerte);margin:0 0 2px}.imp .kick{font-size:7.5pt;color:var(--medio);font-weight:700;letter-spacing:.06em}
  .imp h2{font-size:10.5pt;margin:10px 0 4px;border-bottom:1.5px solid var(--fuerte)}
  .imp table{width:100%;border-collapse:collapse;font-size:8.5pt}
  .imp td{border:1px solid #C5D1F2;padding:4px 6px;vertical-align:top}
  .imp td.l{width:42%;background:var(--claro);font-weight:700;color:var(--fuerte)}
  .imp td.v{height:20px}
  .imp .hoja{break-after:page}.imp .hoja:last-child{break-after:auto}
  .imp .pieimp{margin-top:12px;display:flex;justify-content:space-between;align-items:center;font-size:7.5pt;color:var(--suave)}
  .imp .pieimp img{height:34px}
}
@media (max-width:640px){.campos{grid-template-columns:1fr}}
/* ---------- Paleta de esta app (alerta de triaje): #F5F7FB #E4EAFB #2F5BEA #F57C00 #172B4D ----------
   Azul pálido de base, azul brillante para acciones, azul marino para texto; el coral solo para errores y acciones de alto riesgo. */

.barra,.dlg-cab{background:#172B4D;color:#F5F7FB;border-bottom:3px solid #2F5BEA}
.btn{background:#2F5BEA;color:#FFFFFF}
.btn:hover{filter:brightness(1.05)}
.btn.sec{background:#fff;color:#172B4D;border-color:#2F5BEA}
.btn.peligro{background:#fff;color:#172B4D;border-color:#F57C00;box-shadow:inset 4px 0 0 #F57C00}
.red-tab{border-color:#E4EAFB}
.red-tab[aria-pressed="true"]{background:#172B4D;color:#F5F7FB;border-color:#172B4D}
.tarjeta{border-color:#E4EAFB;box-shadow:0 1px 2px rgba(27,42,65,.06),0 4px 14px rgba(27,42,65,.06)}
.est:hover,.dep:hover{border-color:#2F5BEA}
.chip{background:#E4EAFB;color:#172B4D}
.chip.pend{background:#F5F7FB;color:#172B4D;border:1px dashed #2F5BEA}
.chip.ok{background:#172B4D;color:#F5F7FB}
.barra-prog{background:#E4EAFB}.barra-prog i{background:#2F5BEA}
.op{border-color:#C5D1F2}
.op[aria-pressed="true"]{border-color:#2F5BEA;background:#E4EAFB;color:#172B4D}
.campo>span,.est-cab b,.dep b{color:#172B4D}
.campo input,.campo select,.campo textarea,.buscar input,.buscar select{border-color:#C5D1F2}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:#2F5BEA;box-shadow:0 0 0 3px #E4EAFB}
.cambiado{border-color:#2F5BEA!important;background:#F5F7FB}
.flotante{border-top:3px solid #2F5BEA;background:#fff}
.flotante .sub{color:#172B4D;font-weight:700}
.toast{background:#172B4D;color:#F5F7FB;border-left:5px solid #2F5BEA}
.toast.error{border-left-color:#F57C00}
.msg{background:#fff;color:#172B4D;border:1.5px solid #F57C00;box-shadow:inset 5px 0 0 #F57C00}
.critico{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:999px;background:#F57C00;color:#172B4D}
.datos-donde{padding:12px 14px;margin-bottom:12px;font-size:13.5px;background:#fff}
.datos-donde a{color:#172B4D;font-weight:700}
footer p{color:#4B5B73}
@media print{.imp td{border-color:#C5D1F2}.imp td.l{background:#E4EAFB;color:#172B4D}.imp h2{border-bottom-color:#2F5BEA}.imp .kick{color:#172B4D}}

<body>
<header class="barra">
  <a class="icono" href="index.html" aria-label="Inicio"><span class="ms">home</span></a>
  <h1 id="titulo">Evacuación hospitalaria<small>Fichas por establecimiento y dependencia</small></h1>
  <button class="icono oculto" id="btnAct" title="Actualizar" aria-label="Actualizar"><span class="ms">refresh</span></button>
  <button class="icono oculto" id="btnAyuda" title="Ayuda" aria-label="Ayuda"><span class="ms">help</span></button>
  <button class="icono oculto" id="btnSalir" title="Salir" aria-label="Salir"><span class="ms">logout</span></button>
</header>
<main id="app"></main>
<footer><img src="logo-hysl.png" alt="Hospitales más seguros para las personas"><p>Higiene y Seguridad Laboral · Evacuación hospitalaria</p></footer>
<div id="flot" class="flotante oculto"><span class="sub" id="flotTxt">Hay cambios sin guardar</span><button class="btn" data-act="guardarEst"><span class="ms">save</span>Guardar ficha</button></div>
<div id="dlg" class="dlg oculto" role="dialog" aria-modal="true"></div>
<div id="imp" class="imp"></div>
<script src="config.js"></script>
<script src="starh.js"></script>
<script>
(function () {
'use strict';
const S = window.STARH, $ = s => document.querySelector(s), E = S.esc, app = $('#app');
let cat = S.store.get('evac.cat', null), redActual = S.store.get('evac.red', ''), q = '', fTipo = '', fEvento = '';
let borrador = null, borradorDep = null, ocupado = false;

function toast(t, error) { const d = document.createElement('div'); d.className = 'toast' + (error ? ' error' : ''); d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3200); }
function tema() { /* esta app usa siempre su paleta propia (ver estilos) */ }
const red = n => cat && cat.redes.find(r => r.nombre === n);
const camposDe = (r, ficha) => r.campos.filter(c => c.ficha === ficha);
const secciones = l => { const o = []; l.forEach(c => { let s = o.find(x => x.n === c.seccion); if (!s) o.push(s = { n: c.seccion, c: [] }); s.c.push(c); }); return o; };
const lleno = v => v != null && String(v).trim() !== '';
const avance = (obj, l) => l.length ? Math.round(l.filter(c => lleno(obj[c.clave])).length * 100 / l.length) : 0;
const chipEstado = e => `<span class="chip ${/Completa|Validada/.test(e) ? 'ok' : /En curso/.test(e) ? '' : 'pend'}">${E(e || 'Pendiente')}</span>`;

async function cargar(avisar) {
  if (!navigator.onLine) { if (avisar) toast('Sin conexión: se muestran los últimos datos guardados.'); return render(); }
  try {
    const r = await S.api('evac_catalogo');
    if (!r.ok) { if (r.sesion) { S.sesion.cerrar(); cat = null; toast(r.error); return render(); } throw r; }
    cat = r; S.store.set('evac.cat', r); if (avisar) toast('Datos actualizados.'); render();
  } catch (e) { const m = (e && (e.error || e.message)) || 'No se pudieron traer los datos.'; if (!cat) app.innerHTML = `<div class="tarjeta vacio">${E(m)}</div>`; else toast(m); }
}

/* ---------- campos ---------- */
function campoHTML(c, v, dis, pref) {
  const id = pref + c.clave, val = v == null ? '' : String(v), a = `data-k="${E(c.clave)}" id="${E(id)}" ${dis}`;
  const ancho = c.tipo === 'largo' || c.tipo === 'multi' || c.campo.length > 60;
  let ctl;
  if (c.tipo === 'largo') ctl = `<textarea ${a}>${E(val)}</textarea>`;
  else if (c.tipo === 'sino') ctl = `<div class="ops" data-op="${E(c.clave)}">${['Sí', 'No', 's/d'].map(o => `<button type="button" class="op" data-v="${o}" aria-pressed="${val === o}" ${dis}>${o}</button>`).join('')}</div>`;
  else if (c.tipo === 'multi') { const sel = val.split(';').map(s => s.trim()); ctl = `<div class="ops" data-multi="${E(c.clave)}">${c.opciones.map(o => `<button type="button" class="op" data-v="${E(o)}" aria-pressed="${sel.indexOf(o) >= 0}" ${dis}>${E(o)}</button>`).join('')}</div>`; }
  else if (c.tipo === 'lista') ctl = `<select ${a}><option value="">s/d</option>${c.opciones.map(o => `<option ${o === val ? 'selected' : ''}>${E(o)}</option>`).join('')}${val && c.opciones.indexOf(val) < 0 ? `<option selected>${E(val)}</option>` : ''}</select>`;
  else if (c.tipo === 'numero' || c.tipo === 'porcentaje') ctl = `<input ${a} inputmode="decimal" value="${E(val)}" placeholder="${c.tipo === 'porcentaje' ? '0 a 100' : 's/d'}">`;

  const qi = $('#q'); qi.addEventListener('input', () => { q = qi.value; const p = qi.selectionStart; vistaEvacuados(); const n = $('#q'); n.focus(); n.setSelectionRange(p, p); });
  $('#fEv').addEventListener('change', ev2 => { fEvento = ev2.target.value; vistaEvacuados(); });
}
function encImp(r) { return /trelew/i.test(r.nombre) ? '<img src="enc-trelew.png" style="height:44px">' : '<img src="enc-secretaria.png" style="height:36px">'; }
function pieImp(r) { return `<div class="pieimp"><div><b>${/trelew/i.test(r.nombre) ? 'Servicio de Higiene y Seguridad Laboral' : 'Referente de Higiene y Seguridad Laboral'}</b><br>Impreso el ${S.hoy()}</div><img src="logo-hysl.png" alt="HySL"><div>${E(r.nombre)}</div></div>`; }
function imprimirTraslado(x) {
  const r = redVista(); x = x || {};
  const est = r.establecimientos.find(e => e.codigo === x.codigo) || {};
  const v = k => E(x[k] || ''), cas = (k, o) => `<span class="casilla" style="${String(x[k] || '').split('; ').indexOf(o) >= 0 ? 'background:#7F1D1D' : ''}"></span>${E(o)}`;
  const fila = (l, val) => `<tr><td class="l">${E(l)}</td><td class="v">${val}</td></tr>`;
  const ops = k => (cat.defEva.find(c => c.clave === k) || { opciones: [] }).opciones.map(o => cas(k, o)).join(' ');
  $('#imp').innerHTML = `<section class="hoja">${encImp(r)}<div class="kick">EVACUACIÓN HOSPITALARIA · FICHA DE TRASLADO DEL PACIENTE</div><h1>${v('paciente') || 'Paciente: ______________________________'}</h1>
    <div style="color:#4B5B73">Acompaña al paciente. ${x.id ? 'Registro ' + v('id') + ' · ' : ''}${E(est.nombre || '')}</div>
    <h2>1. Paciente</h2><table class="f260">${fila('Apellido y nombre', v('paciente'))}${fila('DNI o historia clínica', v('documento'))}${fila('Servicio o dependencia de origen', v('origen'))}${fila('Diagnóstico y médico a cargo', '')}${fila('Familia avisada (nombre y teléfono)', v('familia'))}</table>
    <h2>2. Evacuación</h2><table class="f260">${fila('Fecha y evento', [v('fecha'), v('evento')].filter(Boolean).join(' · '))}${fila('Prioridad', ops('prioridad'))}${fila('Movilidad (EVAC-H)', ops('movilidad'))}${fila('Se traslada en', ops('traslado_en'))}${fila('Equipos que lleva', ops('equipos'))}${fila('Aislamiento', ops('aislamiento'))}${fila('Necesidades especiales', '')}</table>
    <h2>3. Salida del servicio</h2><table class="f260">${fila('Habitación o cama · hora', '')}${fila('Pulsera de identificación verificada por', '')}${fila('Historia clínica enviada', ops('hc_enviada'))}${fila('Medicación enviada', ops('med_enviada'))}${fila('Pertenencias y valores', '')}</table>
    <h2>4. Traslado a otra institución</h2><table class="f260">${fila('Institución de destino', v('destino'))}${fila('Hora en que se avisó al destino', v('hora_aviso'))}${fila('Tipo de móvil', ops('movil'))}${fila('Móvil, empresa o patente', v('movil_id'))}${fila('Hora de salida', v('hora_salida'))}</table>
    <h2>5. Llegada (completa quien recibe)</h2><table class="f260">${fila('Llegada confirmada · hora', [v('llegada'), v('hora_llegada')].filter(Boolean).join(' · '))}${fila('Sector donde quedó', v('sector_ingreso'))}${fila('Recibió (nombre, cargo y firma)', '')}${fila('Historia clínica, medicación y pertenencias recibidas', '')}</table>
    <h2>Observaciones</h2><table class="f260"><tr><td style="height:46px">${v('observaciones')}</td></tr></table>
    <p style="font-size:7.5pt;color:#4B5B73">Adaptado de HICS 260 (Patient Evacuation Tracking Form, California EMSA, 2014) y de OPS, EVAC-H (2024). Datos de pacientes: uso exclusivo para la gestión de la emergencia. Preparó: ______________________ Firma: ____________</p>${pieImp(r)}</section>`;
  setTimeout(() => window.print(), 300);
}
function imprimirInst() {
  const r = redVista();
  $('#imp').innerHTML = `<section class="hoja">${encImp(r)}<div class="kick">EVACUACIÓN HOSPITALARIA · INSTITUCIONES RECEPTORAS</div><h1>Directorio de derivación · ${E(r.nombre)}</h1>
    <table><tr><td class="l">Institución</td><td class="l">Contacto 24 h</td><td class="l">Acuerdo · guardia</td><td class="l">Camas en 24 h</td></tr>
    ${(r.instituciones || []).map(x => `<tr><td><b>${E(x.nombre)}</b><br>${E([x.tipo, x.localidad, x.distancia ? x.distancia + ' km' : ''].filter(Boolean).join(' · '))}<br>Recibe de: ${E(x.recibe_de || 's/d')}</td><td>${E(x.contacto || '')}<br>${E(x.tel || '')}<br>${E(x.correo || '')}</td><td>${E(x.acuerdo || 's/d')}<br>${E(x.guardia || '')}</td>
      <td>${cat.camas.filter(c => num(x[c[0] + '_24'])).map(c => E(c[1]) + ': ' + E(x[c[0] + '_24'])).join('<br>') || 's/d'}${x.camas_fecha ? '<br>al ' + E(x.camas_fecha) : ''}</td></tr>`).join('') || '<tr><td colspan="4">Sin instituciones cargadas.</td></tr>'}</table>
    <p style="font-size:7.5pt;color:#4B5B73">Camas según las categorías HAvBED (disponibles en 24 y 72 horas).</p>${pieImp(r)}</section>`;
  setTimeout(() => window.print(), 300);
}
function imprimirEva() {
  const r = redVista(), l = (r.evacuados || []).filter(x => !fEvento || x.evento === fEvento);
  $('#imp').innerHTML = `<section class="hoja">${encImp(r)}<div class="kick">EVACUACIÓN HOSPITALARIA · REGISTRO DE PACIENTES EVACUADOS</div><h1>${E(fEvento || 'Todos los eventos')}</h1>
    <table><tr><td class="l">Paciente</td><td class="l">Origen</td><td class="l">Prioridad · movilidad</td><td class="l">Destino</td><td class="l">Móvil · salida</td><td class="l">HC · med. · familia</td><td class="l">Llegada</td></tr>
    ${l.map(x => `<tr><td><b>${E(x.paciente)}</b><br>${E(x.documento || '')}</td><td>${E(x.codigo)} · ${E(x.origen || '')}</td><td>${E(x.prioridad || '')}<br>${E(x.movilidad || '')}</td><td>${E(x.destino_tipo || '')}<br>${E(x.destino || '')}</td>
      <td>${E(x.movil || '')} ${E(x.movil_id || '')}<br>${E(x.hora_salida || '')}</td><td>${E([x.hc_enviada, x.med_enviada, x.familia].map(y => y || '–').join(' · '))}</td><td>${E(x.llegada || '')} ${E(x.hora_llegada || '')}<br>${E(x.sector_ingreso || '')}</td></tr>`).join('') || '<tr><td colspan="7">Sin registros.</td></tr>'}</table>
    <p style="font-size:7.5pt;color:#4B5B73">Adaptado de HICS 255 (Master Patient Evacuation Tracking, California EMSA, 2014). Datos de pacientes: uso exclusivo para la gestión de la emergencia.</p>${pieImp(r)}</section>`;
  setTimeout(() => window.print(), 300);
}

function abrirDep(id) {
  const r = red(borrador.red), e = r.establecimientos.find(x => x.codigo === borrador.codigo), d = id ? r.dependencias.find(x => x.id === id) : {};
  const puede = e.puedeCargar !== false, dis = puede ? '' : 'disabled';
  borradorDep = { id: id || '', datos: {}, nombre: d.nombre || '', estado: d.estado || '' };
  $('#flot').classList.add('oculto');
  $('#dlg').innerHTML = `<div class="dlg-in"><div class="dlg-cab"><b>${id ? E(d.nombre) : 'Nueva dependencia'}<small style="display:block;font-weight:500;opacity:.85">${E(e.nombre)}</small></b><button class="icono" data-act="cerrarDep" aria-label="Cerrar"><span class="ms">close</span></button></div>
    <div class="dlg-cuerpo" id="fichaDep"><div class="tarjeta" style="padding:6px 14px 10px;margin-bottom:10px"><label class="campo"><span>Nombre de la dependencia *</span><input id="depNombre" value="${E(d.nombre || '')}" ${dis} placeholder="Ej.: Terapia intensiva adultos"></label>
      <label class="campo"><span>Estado de la ficha</span><select id="depEstado" ${dis}>${cat.estados.map(s => `<option ${s === (d.estado || 'En curso') ? 'selected' : ''}>${s}</option>`).join('')}</select></label></div>
      ${seccionesHTML(camposDe(r, 'Dependencia'), d, dis, 'd_', true)}</div>
    <div class="dlg-pie">${id && puede ? '<button class="btn peligro" data-act="borrarDep"><span class="ms">delete</span>Quitar</button>' : ''}<button class="btn sec" data-act="cerrarDep">Cerrar</button>${puede ? '<button class="btn" data-act="guardarDep"><span class="ms">save</span>Guardar</button>' : ''}</div></div>`;
  $('#dlg').classList.remove('oculto'); document.body.style.overflow = 'hidden';
  atarCampos($('#fichaDep'), borradorDep);
}
function cerrarDep() { $('#dlg').classList.add('oculto'); $('#dlg').innerHTML = ''; document.body.style.overflow = ''; borradorDep = null; avisarCambios(); }

/* ---------- impresión ---------- */
function imprimir(modo) {
  const r = red(borrador.red), e = r.establecimientos.find(x => x.codigo === borrador.codigo), cargado = modo === 'cargado';
  const tw = /trelew/i.test(r.nombre);
  const tabla = (l, obj) => secciones(l).map(s => `<h2>${E(s.n)}</h2><table>${s.c.map(c => `<tr><td class="l">${E(c.campo)}${c.tipo === 'lista' || c.tipo === 'multi' ? `<br><span style="font-weight:400;color:#4B5B73;font-size:7.5pt">${E(c.opciones.join(' · '))}</span>` : c.tipo === 'sino' ? '<br><span style="font-weight:400;color:#4B5B73;font-size:7.5pt">Sí · No</span>' : ''}</td><td class="v">${cargado ? E(obj[c.clave] || '') : ''}</td></tr>`).join('')}</table>`).join('');
  const enc = tw ? '<img src="enc-trelew.png" style="height:44px">' : '<img src="enc-secretaria.png" style="height:36px">';
  const pie = `<div class="pieimp"><div><b>${tw ? 'Servicio de Higiene y Seguridad Laboral' : 'Referente de Higiene y Seguridad Laboral'}</b><br>Impreso el ${S.hoy()}</div><img src="logo-hysl.png" alt="HySL"><div>${E(r.nombre)}</div></div>`;
  const deps = cargado ? r.dependencias.filter(d => d.codigo === e.codigo) : [{}];
  $('#imp').innerHTML = `<section class="hoja">${enc}<div class="kick">EVACUACIÓN HOSPITALARIA · FICHA DEL ESTABLECIMIENTO</div><h1>${E(e.nombre)}</h1><div style="color:#4B5B73">${E(e.codigo)} · ${E(e.tipo || '')} · ${E(r.nombre)}</div>
      ${tabla(camposDe(r, 'Establecimiento'), e)}<p style="font-size:7.5pt;color:#4B5B73">Si falta un dato, anotar «s/d». Modelos: OPS, EVAC-H (2024); OPS/OMS, ISH Formulario 1 e ítem 147 (2018); Decreto 351/79, Anexo VII. Esta ficha complementa y no reemplaza el trabajo del Servicio de Higiene y Seguridad de cada establecimiento.</p>${pie}</section>`
    + deps.map(d => `<section class="hoja">${enc}<div class="kick">EVACUACIÓN HOSPITALARIA · FICHA DE DEPENDENCIA</div><h1>${cargado ? E(d.nombre) : 'Dependencia: ______________________________'}</h1><div style="color:#4B5B73">${E(e.nombre)} · ${E(e.codigo)}</div>${tabla(camposDe(r, 'Dependencia'), d)}${pie}</section>`).join('');
  setTimeout(() => window.print(), 300);
}

/* ---------- eventos ---------- */
document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-ir],[data-act],[data-red],[data-dep],[data-inst],[data-eva]'); if (!t) return;
  if (t.dataset.ir) { ir(t.dataset.ir); window.scrollTo(0, 0); return; }
  if (t.dataset.red) { redActual = t.dataset.red; render(); return; }
  if (t.dataset.dep) return abrirDep(t.dataset.dep);
  if (t.dataset.inst) return abrirFila('inst', t.dataset.inst);
  if (t.dataset.eva) return abrirFila('eva', t.dataset.eva);
  const a = t.dataset.act;
  if (a === 'fichaTraslado') return imprimirTraslado(null);
  if (a === 'impInst') return imprimirInst();
  if (a === 'impEva') return imprimirEva();
  if (a === 'nuevaInst') return abrirFila('inst', '');
  if (a === 'nuevoEva') return abrirFila('eva', '');
  if (a === 'cerrarFila') { if (borradorFila && Object.keys(borradorFila.datos).length && !confirm('Hay cambios sin guardar. ¿Cerrar igual?')) return; return cerrarFila(); }
  if (a === 'imprimirTraslado') { const r = redVista(); const x = Object.assign({}, r.evacuados.find(y => y.id === borradorFila.id), borradorFila.datos); return imprimirTraslado(x); }
  if (a === 'guardarFila' || a === 'borrarFila') {
    if (a === 'borrarFila' && !confirm('¿Quitar este registro? No se puede deshacer desde la app.')) return;
    const b = borradorFila, r = redVista();
    if (a === 'guardarFila' && b.tipo === 'eva') { const ant = b.id ? r.evacuados.find(y => y.id === b.id) || {} : {}; const d = Object.assign({}, ant, b.datos); if (!d.codigo) { toast('Elegí el establecimiento.', true); return; } if (!String(d.paciente || '').trim()) { toast('Falta el paciente.', true); return; } if (!b.datos.codigo) b.datos.codigo = d.codigo; }
    if (a === 'guardarFila' && b.tipo === 'inst' && !b.id && !String(b.datos.nombre || '').trim()) { toast('Falta el nombre de la institución.', true); return; }
    if (!navigator.onLine) { toast('Para guardar se necesita conexión.', true); return; }
    t.disabled = true;
    try { const res = await S.api(b.tipo === 'inst' ? 'evac_institucion' : 'evac_evacuado', { red: r.nombre, id: b.id, borrar: a === 'borrarFila', datos: b.datos }); if (!res.ok) throw res; toast(a === 'borrarFila' ? 'Quitado.' : 'Guardado.'); borradorFila = null; cerrarFila(); await cargar(false); }
    catch (e) { toast((e && (e.error || e.message)) || 'No se pudo guardar.', true); t.disabled = false; }
    return;
  }
  if (a === 'volver') { if (borrador && (Object.keys(borrador.datos).length || borrador.estado) && !confirm('Hay cambios sin guardar en la ficha. ¿Salir igual?')) return; borrador = null; ir('#/'); return; }
  if (a === 'imprimir') return imprimir(t.dataset.modo);
  if (a === 'nuevaDep') return abrirDep('');
  if (a === 'cerrarDep') { if (borradorDep && Object.keys(borradorDep.datos).length && !confirm('Hay cambios sin guardar. ¿Cerrar igual?')) return; return cerrarDep(); }
  if (a === 'guardarEst') {
    t.disabled = true;
    const ok = await guardar({ ficha: 'Establecimiento', red: borrador.red, codigo: borrador.codigo, datos: borrador.datos, estado: borrador.estado }, 'Ficha guardada.');
    t.disabled = false; if (ok) { borrador.datos = {}; borrador.estado = ''; render(); } return;
  }
  if (a === 'guardarDep') {
    const nombre = $('#depNombre').value.trim(); if (!nombre) { toast('Falta el nombre de la dependencia.'); return; }
    t.disabled = true;
    const ok = await guardar({ ficha: 'Dependencia', red: borrador.red, codigo: borrador.codigo, id: borradorDep.id, nombre: nombre, estado: $('#depEstado').value, datos: borradorDep.datos }, 'Dependencia guardada.');
    t.disabled = false; if (ok) { borradorDep = null; cerrarDep(); render(); } return;
  }
  if (a === 'borrarDep') {
    if (!confirm('¿Quitar esta dependencia y sus datos? No se puede deshacer desde la app.')) return;
    const ok = await guardar({ ficha: 'Dependencia', red: borrador.red, codigo: borrador.codigo, id: borradorDep.id, borrar: true }, 'Dependencia quitada.');
    if (ok) { borradorDep = null; cerrarDep(); render(); }
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && borradorDep) cerrarDep(); else if (ev.key === 'Escape' && borradorFila) cerrarFila(); });
window.addEventListener('beforeunload', ev => { if ((borrador && Object.keys(borrador.datos).length) || (borradorDep && Object.keys(borradorDep.datos).length)) { ev.preventDefault(); ev.returnValue = ''; } });
window.addEventListener('hashchange', render);
$('#btnAct').addEventListener('click', () => cargar(true));
$('#btnAyuda').addEventListener('click', () => ir('#/ayuda'));
$('#btnSalir').addEventListener('click', () => { S.sesion.cerrar(); cat = null; S.store.del('evac.cat'); render(); });

function vistaIngreso() {
  tema('');
  app.innerHTML = `<form class="tarjeta ingreso" id="fIng"><h2>Ingresar</h2><p class="sub">Mismo DNI y clave de STAR-H, PHR, ISH y COE.</p>
    <label class="campo"><span>DNI (sin puntos)</span><input name="dni" inputmode="numeric" autocomplete="username" required maxlength="10"></label>
    <label class="campo"><span>Clave</span><input name="clave" type="password" autocomplete="current-password" required maxlength="40"></label>
    <button class="btn" style="width:100%" type="submit"><span class="ms">login</span>Ingresar</button><div id="msg" class="msg oculto"></div></form>`;
  $('#fIng').addEventListener('submit', async ev => {
    ev.preventDefault(); const f = ev.target, m = $('#msg');
    try { const r = await S.api('login', { dni: f.dni.value, clave: f.clave.value }); if (!r.ok) throw r;
      if (r.usuario.evac === false) throw { error: 'Tu acceso no incluye Evacuación hospitalaria. Consultá con Higiene y Seguridad Laboral.' };
      S.sesion.guardar(r.token, r.usuario); app.innerHTML = '<div class="vacio">Cargando…</div>'; cargar(false); }
    catch (e) { m.textContent = (e && (e.error || e.message)) || 'No se pudo ingresar.'; m.classList.remove('oculto'); }
  });
}
function vistaAyuda() {
  app.innerHTML = `<button class="volver" data-ir="#/"><span class="ms">arrow_back</span>Volver</button><div class="tarjeta ayuda"><h2>Ayuda · Evacuación hospitalaria</h2>
    <p>Acá se reúne la información de cada establecimiento y de cada dependencia que necesita un plan de evacuación: contacto, población, edificio y salidas, gases medicinales, energía, protección contra incendios, organización y entorno.</p>
    <ol><li>Elegí la red y el establecimiento. Completá la ficha por secciones; si falta un dato, dejalo vacío o poné «s/d». Tocá «Guardar ficha».</li>
      <li>Agregá una ficha por dependencia (servicio, sector o área). Empezá por las áreas críticas: terapia, neonatología, quirófano, guardia.</li>
      <li>En cada dependencia, contá a los pacientes según su movilidad (EVAC-H): autónomos, con apoyo, totalmente dependientes y con soporte vital. Con eso se calcula el personal y los elementos que hacen falta para evacuar.</li>
      <li>Cuando la ficha esté completa, cambiá su estado a «Completa». «Validada» queda para cuando la revisa la Dirección o el Servicio de Higiene y Seguridad del lugar.</li>
      <li>«Imprimir en blanco» da la ficha para completar a mano en el recorrido; «Imprimir con lo cargado», la ficha con los datos.</li></ol>
    <h3>Desde la planilla</h3><p>Cada red tiene su planilla EVAC (hojas ESTABLECIMIENTOS, DEPENDENCIAS y CAMPOS). En la hoja CAMPOS se agregan, se cambian o se desactivan campos, y la app los toma sola.</p>
    <p class="sub">Modelos: OPS, EVAC-H: Evacuación de hospitales y sus áreas críticas (2024); OPS/OMS, Índice de seguridad hospitalaria, Formulario 1 e ítem 147 (2018); Decreto 351/79, Anexo VII, capítulo 18; Res. SRT 905/2015, Anexo II. Este relevamiento complementa y no reemplaza el trabajo del Servicio de Higiene y Seguridad de cada establecimiento.</p></div>`;
}

if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
if (S.sesion.token()) cargar(false);
})();
</script>
</body>
</html>
